name: edfinder_octopus_fresh_10122

services:
  web:
    image: ghcr.io/octopusreview/octopus-selfhost:1.0.122@sha256:7a65a6009136376a74ff0a4dd58fae26c10f610879bed7f9c97adb0530c7eb78
    container_name: edfinder-octopus-fresh-10122-web
    env_file:
      - .env
    environment:
      DATABASE_URL: ${OCTOPUS_DATABASE_URL:?set OCTOPUS_DATABASE_URL}
      QDRANT_URL: http://qdrant:6333
      ENABLE_REVIEW_WORKERS: ${ENABLE_REVIEW_WORKERS:-false}
    ports:
      - "127.0.0.1:43300:3000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [octopus_fresh]

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: edfinder-octopus-fresh-10122-postgres
    environment:
      POSTGRES_USER: octopus_app
      POSTGRES_PASSWORD: ${OCTOPUS_POSTGRES_PASSWORD:?set OCTOPUS_POSTGRES_PASSWORD}
      POSTGRES_DB: octopus_fresh
    volumes:
      - octopus_fresh_postgres_10122:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus_app -d octopus_fresh"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [octopus_fresh]

  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    container_name: edfinder-octopus-fresh-10122-qdrant
    volumes:
      - octopus_fresh_qdrant_10122:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [octopus_fresh]

volumes:
  octopus_fresh_postgres_10122:
    name: edfinder-octopus-fresh-10122-postgres-data
  octopus_fresh_qdrant_10122:
    name: edfinder-octopus-fresh-10122-qdrant-data

networks:
  octopus_fresh:
    name: edfinder-octopus-fresh-10122-network
    driver: bridge
    external: false
