name: octopus-selfhost

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  web:
    image: ghcr.io/octopusreview/octopus-selfhost:1.0.122
    env_file:
      - octopus.env
    environment:
      DATABASE_URL: postgresql://octopus:${OCTOPUS_POSTGRES_PASSWORD}@postgres:5432/octopus
      QDRANT_URL: http://qdrant:6333
      ENABLE_REVIEW_WORKERS: "true"
    ports:
      - "127.0.0.1:43300:3000"
    networks: [octopus_backend, octopus_egress]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 4g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: ${OCTOPUS_POSTGRES_PASSWORD}
      POSTGRES_DB: octopus
    volumes:
      - octopus_postgres_data:/var/lib/postgresql/data
    networks: [octopus_backend]
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus -d octopus"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.17.0
    volumes:
      - octopus_qdrant_data:/qdrant/storage
    networks: [octopus_backend]
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  octopus_backend:
    name: octopus-selfhost-backend
    internal: true
  octopus_egress:
    name: octopus-selfhost-egress

volumes:
  octopus_postgres_data:
    name: octopus-selfhost-postgres-1-0-122
  octopus_qdrant_data:
    name: octopus-selfhost-qdrant-1-0-122
