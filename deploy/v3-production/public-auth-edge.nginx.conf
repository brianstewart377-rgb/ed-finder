worker_processes 1;
events { worker_connections 512; }
http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  map $http_x_forwarded_proto $edge_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
  }

  server {
    listen 80;
    server_name octopus.ed-finder.app;

    location / {
      proxy_pass http://127.0.0.1:43300;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
  }

  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The public TLS terminator remains externally managed.  It forwards the
    # complete application surface to the verified blue web slot; the web
    # slot owns static files and proxies /api/* to the V3 API container.
    location / {
      proxy_pass http://127.0.0.1:58081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
