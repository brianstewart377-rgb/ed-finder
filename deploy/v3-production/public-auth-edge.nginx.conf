worker_processes 1;
events { worker_connections 512; }
http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # Public traffic arrives through Cloudflare. Its CF-Connecting-IP header
  # names the visitor, but only a connection from Cloudflare may set it:
  # direct connections to the origin keep their own address, so nobody
  # can choose another client's rate-limit key. Ranges from
  # https://www.cloudflare.com/ips/ (last updated there 2023-09-28;
  # checked 2026-10-26). $remote_addr, X-Real-IP and the access log then
  # carry the visitor's address.
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  map $http_x_forwarded_proto $edge_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
  }

  server {
    listen 80;
    server_name octopus.ed-finder.app;

    location / {
      proxy_pass http://127.0.0.1:43300;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
  }

  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Keep the registered Frontier callback and existing auth compatibility
    # aliases on their reviewed legacy loopback route.  The V3 API behind that
    # route owns the callback implementation; the web slot only owns the SPA.
    location = /api/auth/frontier/login {
      proxy_pass http://127.0.0.1:58080/api/v1/auth/frontier/login;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/auth/frontier/callback {
      proxy_pass http://127.0.0.1:58080/api/auth/frontier/callback;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/auth/session {
      proxy_pass http://127.0.0.1:58080/api/v1/auth/session;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/auth/logout {
      proxy_pass http://127.0.0.1:58080/api/v1/auth/logout;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/auth/owner/claim {
      proxy_pass http://127.0.0.1:58080/api/v1/auth/owner/claim;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/v1/auth/ {
      proxy_pass http://127.0.0.1:58080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
    }

    # The public TLS terminator remains externally managed.  It forwards the
    # complete application surface to the single active origin on
    # 127.0.0.1:58080.  Whichever slot is active owns that bind and serves the
    # SPA plus the /api/* proxy, so the blue/green cutover swaps the owning
    # slot without this edge being repointed or recreated.
    location / {
      proxy_pass http://127.0.0.1:58080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $edge_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
