name: V3 Finder capacity measurement

on:
  workflow_dispatch:
    inputs:
      attested_f2d_operator_code_sha256:
        description: F2d operator-code SHA-256 from the accepted-release attestation
        required: true
        type: string
      rows:
        description: Number of deterministic synthetic rows in each measurement
        required: false
        default: '200000'
        type: string

permissions:
  contents: read

concurrency:
  group: v3-finder-capacity-measurement

jobs:
  measure:
    name: Measure Finder capacity inputs on disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: v4validator
          POSTGRES_PASSWORD: v4test
          POSTGRES_DB: ratings_v4_validation
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      ATTESTED: ${{ inputs.attested_f2d_operator_code_sha256 }}
      ROWS: ${{ inputs.rows }}
      EDFINDER_DISPOSABLE_DSN: postgresql://v4validator:v4test@127.0.0.1:5432/ratings_v4_validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Validate attested operator-code identity input
        shell: bash
        run: |
          if [[ ! "$ATTESTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'attested_f2d_operator_code_sha256 must be exactly 64 lowercase hexadecimal characters' >&2
            exit 64
          fi

      - name: Verify checkout identity with both implementations
        shell: bash
        run: |
          bash scripts/operator/lib/f2d_operator_identity.sh verify . "$ATTESTED"
          python scripts/operator/lib/f2d_operator_identity.py verify . "$ATTESTED"

      - name: Install measurement dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Require the committed complete-read receipt
        shell: bash
        run: |
          receipt='docs/operations/evidence/f2d/complete-read-receipt.json'
          if [[ ! -f "$receipt" || -L "$receipt" ]]; then
            echo "required committed complete-read receipt is missing or is a symlink: $receipt" >&2
            exit 65
          fi

      - name: Convert the complete histogram to measured fractions
        run: >-
          python scripts/dev/convert_calibration_histogram.py
          docs/operations/evidence/f2d/complete-read-receipt.json
          --output "$RUNNER_TEMP/calibration-fractions.json"

      - name: Measure the eligible Archetype footprint
        run: >-
          python scripts/dev/measure_wide_archetype_footprint.py
          --migration-sql sql/v3/migrations/011_v3_system_archetype.sql
          --fractions-json "$RUNNER_TEMP/calibration-fractions.json"
          --rows "$ROWS"
          --output "$RUNNER_TEMP/archetype-footprint-receipt.json"

      - name: Measure the Search footprint
        run: >-
          python scripts/dev/measure_search_footprint.py
          --rows "$ROWS"
          --output "$RUNNER_TEMP/search-footprint-receipt.json"

      - name: Verify and summarize the capacity evidence
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.operator.lib.f2d_evidence import (
              ARCHETYPE_FOOTPRINT,
              COMPLETE_RECEIPT,
              FRACTIONS,
              SEARCH_FOOTPRINT,
              canonical_sha256,
              load_sealed,
          )
          from scripts.dev.measure_search_footprint import (
              validate_search_footprint_receipt,
          )
          from scripts.dev.measure_wide_archetype_footprint import (
              validate_archetype_footprint_receipt,
          )

          attested = os.environ["ATTESTED"]
          temporary = Path(os.environ["RUNNER_TEMP"])
          fractions_path = temporary / "calibration-fractions.json"
          archetype_path = temporary / "archetype-footprint-receipt.json"
          search_path = temporary / "search-footprint-receipt.json"

          complete = load_sealed(COMPLETE_RECEIPT)
          archetype = load_sealed(archetype_path)
          search = load_sealed(search_path)
          validate_archetype_footprint_receipt(archetype)
          validate_search_footprint_receipt(search)
          if fractions_path.is_symlink():
              raise ValueError("calibration fractions must not be a symlink")
          try:
              fractions = json.loads(fractions_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise ValueError(f"calibration fractions are unreadable: {exc}") from exc
          if not isinstance(fractions, dict):
              raise ValueError("calibration fractions must be a JSON object")
          fractions_content_sha256 = canonical_sha256(fractions)

          for name, receipt in (
              ("complete-read", complete),
              ("archetype-footprint", archetype),
              ("search-footprint", search),
          ):
              if receipt.get("f2d_operator_code_sha256") != attested:
                  raise ValueError(f"{name} receipt operator-code identity is not attested")
          for field in (
              "source_f2d_operator_code_sha256",
              "converter_f2d_operator_code_sha256",
          ):
              if fractions.get(field) != attested:
                  raise ValueError(f"calibration fractions {field} is not attested")
          if archetype.get("fractions_sha256") != fractions.get("fractions_sha256"):
              raise ValueError("Archetype receipt does not bind the generated fractions")
          migration_011_sha256 = hashlib.sha256(
              Path("sql/v3/migrations/011_v3_system_archetype.sql").read_bytes()
          ).hexdigest()
          if archetype.get("migration_011_sha256") != migration_011_sha256:
              raise ValueError("Archetype receipt does not bind the checked-out migration 011")

          for name, receipt in (
              ("complete-read", complete),
              ("archetype-footprint", archetype),
              ("search-footprint", search),
          ):
              print(f"{name} content_sha256={receipt['content_sha256']}")
          print(f"calibration-fractions content_sha256={fractions_content_sha256}")
          print(f"calibration-fractions fractions_sha256={fractions['fractions_sha256']}")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "## V3 Finder capacity measurement",
              "",
              f"Operator-code identity: `{attested}`",
              "",
              "| Artifact file | Fixed repository destination | Verified digest |",
              "| --- | --- | --- |",
              (
                  f"| `{COMPLETE_RECEIPT}` | `{COMPLETE_RECEIPT}` | "
                  f"`content_sha256={complete['content_sha256']}` |"
              ),
              (
                  f"| `{fractions_path.name}` | `{FRACTIONS}` | "
                  f"`content_sha256={fractions_content_sha256}`; "
                  f"`fractions_sha256={fractions['fractions_sha256']}` |"
              ),
              (
                  f"| `{archetype_path.name}` | `{ARCHETYPE_FOOTPRINT}` | "
                  f"`content_sha256={archetype['content_sha256']}` |"
              ),
              (
                  f"| `{search_path.name}` | `{SEARCH_FOOTPRINT}` | "
                  f"`content_sha256={search['content_sha256']}` |"
              ),
              "",
              (
                  "A reviewed PR must commit these files under "
                  "`docs/operations/evidence/f2d/` at the fixed names shown above."
              ),
              "",
          ]
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Upload capacity-measurement evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-finder-capacity-measurement
          path: |
            docs/operations/evidence/f2d/complete-read-receipt.json
            ${{ runner.temp }}/calibration-fractions.json
            ${{ runner.temp }}/archetype-footprint-receipt.json
            ${{ runner.temp }}/search-footprint-receipt.json
          retention-days: 90
          if-no-files-found: error
