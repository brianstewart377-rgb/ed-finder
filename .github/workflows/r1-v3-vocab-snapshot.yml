name: R1 V3 Vocabulary Snapshot

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/r1-v3-vocab-requests/*.json'

permissions:
  contents: read

concurrency:
  group: r1-v3-vocab-snapshot
  cancel-in-progress: false

jobs:
  vocab:
    name: Read-only V3 vocabulary snapshot
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 15
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || { echo 'Expected exactly one vocabulary request' >&2; exit 64; }
          case "${changed[0]}" in
            .github/r1-v3-vocab-requests/*.json) ;;
            *) echo 'Changed path outside V3 vocabulary request allowlist' >&2; exit 64 ;;
          esac
          python3 - "${changed[0]}" <<'PY'
          import json,pathlib,sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {'operation':'r1-v3-vocab-snapshot'}:
              raise SystemExit('Unsupported V3 vocabulary request')
          PY

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"; test -n "$SSH_HOST"; test -n "$SSH_PORT"; test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key; chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null || { echo 'Pinned host trust mismatch' >&2; exit 1; }

      - name: Read V3 reference vocabulary only
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' > r1-v3-vocab-snapshot.json <<'PY'
          import json,subprocess
          container='edfinder-v3-phase4c-full-20260827_r5-postgres'
          database='edfinder_v3_phase4c_full_20260827_r5'
          inspect=json.loads(subprocess.check_output(['docker','inspect',container],text=True))[0]
          env={}
          for item in inspect.get('Config',{}).get('Env',[]):
              if '=' in item:
                  k,v=item.split('=',1); env[k]=v
          user=env.get('POSTGRES_USER') or 'postgres'; password=env.get('POSTGRES_PASSWORD') or ''
          base=['docker','exec']
          if password: base += ['-e',f'PGPASSWORD={password}']
          base += [container,'psql','-h','127.0.0.1','-U',user,'-d',database,'-At']
          def psql(sql,sep='|'):
              return subprocess.check_output(base+['-F',sep,'-c',sql],text=True,stderr=subprocess.STDOUT).splitlines()

          table_lines=psql("""
            SELECT c.relname
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='v3_vocab' AND c.relkind='r'
            ORDER BY c.relname
          """)
          result={}
          for table in table_lines:
              if not table: continue
              safe=table.replace("'","''")
              cols=psql(f"""
                SELECT a.attname
                FROM pg_attribute a JOIN pg_class c ON c.oid=a.attrelid JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='v3_vocab' AND c.relname='{safe}' AND a.attnum>0 AND NOT a.attisdropped
                ORDER BY a.attnum
              """)
              # Vocabulary tables are deliberately small. Read at most 500 rows per relation.
              query='SELECT row_to_json(t)::text FROM (SELECT * FROM v3_vocab."'+table.replace('"','""')+'" ORDER BY 1 LIMIT 500) t'
              rows=psql(query,sep='\t')
              parsed=[]
              for row in rows:
                  if row.strip(): parsed.append(json.loads(row))
              result[table]={'columns':cols,'rows':parsed,'truncated':len(parsed)>=500}
          print(json.dumps({'database':database,'schema':'v3_vocab','tables':result},separators=(',',':')))
          PY

      - name: Summarize vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('r1-v3-vocab-snapshot.json').read_text())
          print('schema:',d['schema'])
          for name,table in sorted(d['tables'].items()):
              print(f"- {name}: rows={len(table['rows'])} columns={','.join(table['columns'])} truncated={str(table['truncated']).lower()}")
              for row in table['rows'][:30]:
                  print('  ',json.dumps(row,sort_keys=True,ensure_ascii=True))
              if len(table['rows'])>30: print('   ...')
          PY

      - name: Upload vocabulary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r1-v3-vocab-snapshot-${{ github.run_id }}
          path: r1-v3-vocab-snapshot.json
          if-no-files-found: error
          retention-days: 30
