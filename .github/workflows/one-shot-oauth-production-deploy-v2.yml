name: One-shot OAuth Production Deploy V2

on:
  push:
    branches:
      - chatgpt-ops-requests
    paths:
      - '.github/workflows/one-shot-oauth-production-deploy-v2.yml'

permissions:
  contents: read

concurrency:
  group: oauth-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy merged OAuth with shell-safe environment
    runs-on: ubuntu-latest
    environment: hetzner-operator
    timeout-minutes: 45
    env:
      TARGET_SHA: 5403ecca701bc9f53b3e45fe8eedb8457fb21151
      OAUTH_MERGE_SHA: 06cc7d602b22880596790013d66aef6fc4706d47
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hetzner_operator_key
          chmod 600 ~/.ssh/hetzner_operator_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Promote exact main commit and verify OAuth boundary
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.HETZNER_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"
          ssh -i ~/.ssh/hetzner_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              bash -s -- "$TARGET_SHA" "$OAUTH_MERGE_SHA" <<'REMOTE'
          set -euo pipefail

          target_sha="$1"
          oauth_merge_sha="$2"
          repo_dir='/opt/ed-finder'
          backup_root="$repo_dir/.operator-backups"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="$backup_root/oauth-deploy-v2-$timestamp"
          old_head=''
          deployment_started=0
          deployment_succeeded=0

          say() { printf '\n[oauth-deploy-v2] %s\n' "$*"; }
          fail() { printf '[oauth-deploy-v2][ERROR] %s\n' "$*" >&2; exit 1; }

          rollback() {
            rc=$?
            if [ "$rc" -eq 0 ] || [ "$deployment_succeeded" -eq 1 ]; then
              return
            fi
            printf '\n[oauth-deploy-v2][ERROR] deployment failed; restoring prior production state\n' >&2
            if [ "$deployment_started" -eq 1 ] && [ -n "$old_head" ] && [ -d "$backup_dir" ]; then
              cd "$repo_dir" || return
              cp "$backup_dir/env.before" .env || true
              chmod 600 .env || true
              git reset --hard "$old_head" || true
              if command -v yarn >/dev/null 2>&1; then
                (
                  cd frontend
                  yarn install --frozen-lockfile --no-progress --non-interactive --ignore-engines
                  yarn build
                ) || true
              fi
              docker compose up -d --build api eddn maintenance || true
              docker compose up -d --force-recreate nginx || true
              for _ in $(seq 1 30); do
                if curl -fsS --max-time 5 http://127.0.0.1/api/health >/dev/null 2>&1; then
                  printf '[oauth-deploy-v2] rollback_health=true\n' >&2
                  break
                fi
                sleep 2
              done
              printf '[oauth-deploy-v2] rollback_target=%s\n' "$old_head" >&2
            fi
            exit "$rc"
          }
          trap rollback EXIT

          cd "$repo_dir"
          say 'Preflight and immutable backup'
          [ "$(git branch --show-current)" = 'main' ] || fail 'production checkout is not on main'
          old_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          [ "$(git rev-parse origin/main)" = "$target_sha" ] || fail 'origin/main moved beyond the authorised deployment SHA'
          git merge-base --is-ancestor "$oauth_merge_sha" "$target_sha" || fail 'target does not contain OAuth merge'
          [ -f .env ] || fail '.env is missing'
          [ -f maintenance-crontab ] || fail 'maintenance-crontab is missing'

          mkdir -p "$backup_dir"
          chmod 700 "$backup_root" "$backup_dir"
          printf '%s\n' "$old_head" > "$backup_dir/head.before"
          git status --short > "$backup_dir/status.before"
          git diff --binary > "$backup_dir/tracked.patch"
          cp .env "$backup_dir/env.before"
          chmod 600 "$backup_dir/env.before"

          git diff --quiet || fail 'unexpected tracked changes remain after the prior rollback'
          git diff --cached --quiet || fail 'unexpected staged changes remain after the prior rollback'
          [ -f docker-compose.override.yml ] || fail 'the preserved maintenance compose override is missing'
          grep -Fxq '      - /opt/ed-finder/maintenance-crontab:/etc/crontabs/root:ro' docker-compose.override.yml \
            || fail 'maintenance compose override is not the reviewed mount'

          git reset --hard "$target_sha"
          [ "$(git rev-parse HEAD)" = "$target_sha" ] || fail 'failed to select exact deployment SHA'
          git diff --quiet || fail 'tracked worktree dirty at deployment target'

          say 'Serialize OAuth settings safely for both Docker Compose and shell sourcing'
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import tempfile

          path = Path('.env')
          required = (
              'FRONTIER_CLIENT_ID',
              'FRONTIER_CLIENT_SECRET',
              'FRONTIER_REDIRECT_URI',
              'ADMIN_TOKEN',
          )

          # Ask Docker Compose to parse the existing .env according to its own
          # rules, but capture the output privately so no value reaches logs.
          result = subprocess.run(
              ['docker', 'compose', 'config', '--environment'],
              check=True,
              capture_output=True,
              text=True,
          )
          parsed = {}
          for line in result.stdout.splitlines():
              if '=' not in line:
                  continue
              key, value = line.split('=', 1)
              parsed[key] = value

          values = {}
          for key in required:
              value = parsed.get(key, '')
              if not value:
                  raise SystemExit(f'{key} is missing')
              if any(character in value for character in ("'", '\n', '\r')):
                  raise SystemExit(f'{key} cannot be represented safely in the shell-sourced .env')
              values[key] = value

          expected_redirect = 'https://ed-finder.app/api/auth/frontier/callback'
          if values['FRONTIER_REDIRECT_URI'] != expected_redirect:
              raise SystemExit('FRONTIER_REDIRECT_URI is not the exact registered callback')
          values['AUTH_COOKIE_SECURE'] = 'true'

          managed = set(values)
          retained = []
          for line in path.read_text(encoding='utf-8').splitlines():
              stripped = line.lstrip()
              if not stripped or stripped.startswith('#') or '=' not in line:
                  retained.append(line)
                  continue
              key = line.split('=', 1)[0].strip()
              if key not in managed:
                  retained.append(line)

          retained.append('')
          retained.append('# Frontier OAuth values are single-quoted because migration tooling sources this file.')
          for key in (*required, 'AUTH_COOKIE_SECURE'):
              retained.append(f"{key}='{values[key]}'")

          fd, temp_name = tempfile.mkstemp(prefix='.env.', dir='.')
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                  handle.write('\n'.join(retained).rstrip() + '\n')
              os.chmod(temp_name, 0o600)
              os.replace(temp_name, path)
          finally:
              if os.path.exists(temp_name):
                  os.unlink(temp_name)
          PY
          chmod 600 .env

          # This is the path that failed previously. Validate it before any
          # migration or container write, and never echo the sourced values.
          bash -c '
            set -euo pipefail
            set -a
            source .env
            set +a
            test -n "$FRONTIER_CLIENT_ID"
            test -n "$FRONTIER_CLIENT_SECRET"
            test -n "$ADMIN_TOKEN"
            test "$FRONTIER_REDIRECT_URI" = "https://ed-finder.app/api/auth/frontier/callback"
            test "$AUTH_COOKIE_SECURE" = "true"
          '
          docker compose config --quiet
          printf '[oauth-deploy-v2] shell_source_validation=true\n'
          printf '[oauth-deploy-v2] compose_environment_validation=true\n'
          printf '[oauth-deploy-v2] maintenance_override_preserved=true\n'

          say 'Run standard exact-SHA deployment'
          deployment_started=1
          bash scripts/deploy_main.sh --skip-pull
          [ "$(git rev-parse HEAD)" = "$target_sha" ] || fail 'deployment changed away from authorised SHA'

          say 'Verify database migration and API configuration'
          schema_ready="$(docker compose exec -T postgres psql -U edfinder -d edfinder -Atqc \"SELECT (to_regclass('public.app_users') IS NOT NULL AND to_regclass('public.web_sessions') IS NOT NULL AND to_regclass('public.oauth_login_states') IS NOT NULL)::text;\")"
          [ "$schema_ready" = 't' ] || fail 'OAuth schema tables are missing'
          docker compose exec -T api python - <<'PY'
          from edfinder_api.config import settings

          assert settings.frontier_client_id
          assert settings.frontier_client_secret
          assert settings.frontier_redirect_uri == 'https://ed-finder.app/api/auth/frontier/callback'
          assert settings.auth_cookie_secure is True
          print('[oauth-deploy-v2] api_oauth_configuration=true')
          PY

          session_code="$(curl -sS --max-time 10 -o /tmp/oauth-session.json -w '%{http_code}' http://127.0.0.1/api/auth/session)"
          [ "$session_code" = '200' ] || fail 'signed-out session endpoint did not return 200'
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/oauth-session.json').read_text(encoding='utf-8'))
          assert payload == {
              'authenticated': False,
              'user': None,
              'owner_claim_available': False,
          }
          print('[oauth-deploy-v2] signed_out_session_contract=true')
          PY

          say 'Verify Frontier authorization redirect and state-cookie attributes'
          curl -sS --max-time 15 --max-redirs 0 \
            -D /tmp/oauth-login.headers \
            -o /dev/null \
            'https://ed-finder.app/api/auth/frontier/login?return_to=%2F%23finder'
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          lines = Path('/tmp/oauth-login.headers').read_text(encoding='iso-8859-1').splitlines()
          assert lines[0].split()[1] == '302'
          headers = {}
          cookies = []
          for line in lines[1:]:
              if not line or ':' not in line:
                  continue
              name, value = line.split(':', 1)
              name = name.strip().lower()
              value = value.strip()
              if name == 'set-cookie':
                  cookies.append(value)
              else:
                  headers[name] = value

          parsed = urlsplit(headers['location'])
          assert parsed.scheme == 'https'
          assert parsed.netloc == 'auth.frontierstore.net'
          assert parsed.path.rstrip('/') == '/auth'
          query = parse_qs(parsed.query)
          assert query.get('response_type') == ['code']
          assert query.get('redirect_uri') == ['https://ed-finder.app/api/auth/frontier/callback']
          assert query.get('code_challenge_method') == ['S256']
          assert query.get('state', [''])[0]
          assert query.get('code_challenge', [''])[0]
          assert {'auth', 'capi'} <= set(query.get('scope', [''])[0].split())

          state_cookie = next(value for value in cookies if value.startswith('ed_finder_oauth_state='))
          attributes = {part.strip().lower() for part in state_cookie.split(';')[1:]}
          assert 'secure' in attributes
          assert 'httponly' in attributes
          assert 'samesite=lax' in attributes
          assert 'path=/api/auth/frontier' in attributes
          print('[oauth-deploy-v2] frontier_authorization_redirect=true')
          print('[oauth-deploy-v2] oauth_state_cookie_secure=true')
          PY
          rm -f /tmp/oauth-login.headers /tmp/oauth-session.json

          deployment_succeeded=1
          printf '[oauth-deploy-v2] deployed_sha=%s\n' "$target_sha"
          printf '[oauth-deploy-v2] oauth_schema_present=true\n'
          printf '[oauth-deploy-v2] production_boundary_verified=true\n'
          REMOTE
