name: PR644 temporary test synchronization

on:
  push:
    branches: [diagnostic/v3-live-schema-contract]
    paths: ['.github/workflows/v3-pr644-test-sync.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diagnostic/v3-live-schema-contract
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Synchronize stale production authority assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_v3_production_application_deployment.py')
          source = path.read_text(encoding='utf-8')

          replacements = {
              '''    assert {
                  "production_local_docker_context_authority_missing",
                  "production_promotion_cpython314_runtime_unproved",
                  "production_edge_loopback_cutover_topology_authority_missing",
              }.issubset(value["blockers"])
          ''': '''    assert {
                  "production_promotion_cpython314_runtime_unproved",
                  "production_edge_loopback_cutover_topology_authority_missing",
              }.issubset(value["blockers"])
          ''',
              '''    assert all(value["external_authority"][key] is None for key in (
                  "application_network", "api_env_file", "schema_identity_file",
                  "edge_route_authority", "receipt_directory", "docker_context",
              ))
          ''': '''    assert all(value["external_authority"][key] is None for key in (
                  "application_network", "api_env_file", "schema_identity_file",
                  "edge_route_authority", "receipt_directory",
              ))
              assert value["external_authority"]["docker_context"] == "default"
          ''',
              '''    assert workflow["jobs"]["inventory"]["environment"] == "v3-production-readonly"
          ''': '''    assert workflow["jobs"]["inventory"]["environment"] == "ed-new-operator"
          ''',
              '''    assert "ED_NEW_OPERATOR" not in source
          ''': '''    assert "ED_NEW_OPERATOR_SSH_KEY" in source
          ''',
          }

          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one stale assertion block, got {source.count(old)}: {old!r}')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/test_v3_production_application_deployment.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_v3_production_application_deployment.py
          git commit -m 'Sync V3 production tests with reviewed authority'
          git push origin HEAD:diagnostic/v3-live-schema-contract
