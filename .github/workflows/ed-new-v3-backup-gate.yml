name: ed-new V3 Verified Backup Gate

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-v3-backup-gate-requests/*.json'

permissions:
  contents: read

jobs:
  verify:
    name: Verify retained V3 recovery point
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 20
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-v3-backup-gate-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json, pathlib, sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {"operation":"verify-v3-backup-gate"}:
              raise SystemExit(64)
          PY

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key; chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null

      - name: Inspect and verify pgBackRest recovery point
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          container = 'edfinder-v3-phase4c-full-20260827_r5-postgres'
          stanza = 'edfinder_v3'
          pg_user = 'postgres'

          def run(args):
              return subprocess.run(
                  ['docker', 'exec', '-u', pg_user, container, *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )

          info = run(['pgbackrest', f'--stanza={stanza}', '--log-level-console=off', '--output=json', 'info'])
          print('pgbackrest_info_exit|' + str(info.returncode))
          if info.returncode != 0:
              for line in info.stderr.splitlines():
                  print('pgbackrest_info_error|' + line)
              raise SystemExit('pgBackRest info failed as postgres user')

          data = json.loads(info.stdout)
          if len(data) != 1:
              raise SystemExit('Expected exactly one pgBackRest stanza result')
          s = data[0]
          print('stanza|' + str(s.get('name','')) + '|' + str(s.get('status',{}).get('message','')))
          for db in s.get('db', []):
              print('db|' + '|'.join(str(db.get(k,'')) for k in ('id','system-id','version')))

          backups = s.get('backup', [])
          print('backup_count|' + str(len(backups)))
          for b in backups[-10:]:
              ts=b.get('timestamp',{})
              info_b=b.get('info',{})
              repo=b.get('repo',{})
              archive=b.get('archive',{})
              print('backup|' + '|'.join([
                  str(b.get('label','')),
                  str(b.get('type','')),
                  str(ts.get('start','')),
                  str(ts.get('stop','')),
                  str(info_b.get('size','')),
                  str(repo.get('size','')),
                  str(archive.get('start','')),
                  str(archive.get('stop','')),
                  str(b.get('error',False)),
              ]))

          complete = [b for b in backups if b.get('timestamp',{}).get('stop') and not b.get('error',False)]
          if not complete:
              raise SystemExit('No completed pgBackRest backup exists')
          latest = complete[-1]
          latest_label = str(latest.get('label',''))
          print('selected_backup|' + latest_label)

          # A prior verify is useful evidence, but perform a fresh repository
          # verification now so the gate is tied to current repository state.
          verify = run(['pgbackrest', f'--stanza={stanza}', '--log-level-console=info', 'verify'])
          print('pgbackrest_verify_exit|' + str(verify.returncode))
          safe_lines=[]
          for raw in (verify.stdout + '\n' + verify.stderr).splitlines():
              lower=raw.lower()
              if any(token in lower for token in ('verify', 'backup', 'complete', 'success', 'warn', 'error')):
                  # pgBackRest output should not contain credentials; keep this
                  # deliberately narrow to status lines only.
                  safe_lines.append(raw)
          for line in safe_lines[-30:]:
              print('verify_status|' + line)
          if verify.returncode != 0:
              raise SystemExit('Fresh pgBackRest repository verify failed')

          # Re-read metadata after verification and bind the gate to database
          # identity plus latest completed backup label.
          info2 = run(['pgbackrest', f'--stanza={stanza}', '--log-level-console=off', '--output=json', 'info'])
          if info2.returncode != 0:
              raise SystemExit('Post-verify pgBackRest info failed')
          s2=json.loads(info2.stdout)[0]
          complete2=[b for b in s2.get('backup',[]) if b.get('timestamp',{}).get('stop') and not b.get('error',False)]
          if not complete2:
              raise SystemExit('Completed backup disappeared after verification')
          print('verified_backup|' + str(complete2[-1].get('label','')))
          print('verified_backup_stop|' + str(complete2[-1].get('timestamp',{}).get('stop','')))
          print('backup_gate|PASS')
          print('db_writes_performed|false')
          print('application_data_modified|false')
          PY
