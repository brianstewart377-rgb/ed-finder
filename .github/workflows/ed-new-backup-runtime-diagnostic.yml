name: ed-new Backup Runtime Diagnostic

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-backup-runtime-diagnostic-requests/*.json'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-backup-runtime-diagnostic-requests/*.json) ;; *) exit 64 ;; esac
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Inspect backup mount and timers
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '== findmnt =='
          findmnt -T /mnt/ed-storagebox -o TARGET,SOURCE,FSTYPE,OPTIONS || true
          echo '== mountpoint =='
          mountpoint /mnt/ed-storagebox || true
          echo '== storage service =='
          systemctl is-enabled edfinder-storagebox.service || true
          systemctl is-active edfinder-storagebox.service || true
          echo '== pgbackrest unit files =='
          systemctl list-unit-files --no-pager | grep -Ei 'edfinder.*pgbackrest|pgbackrest.*edfinder' || true
          echo '== pgbackrest timers =='
          systemctl list-timers --all --no-pager | grep -Ei 'edfinder.*pgbackrest|pgbackrest.*edfinder' || true
          echo '== scripts =='
          ls -l /opt/ed-finder-v3-runtime/pgbackrest-operation.sh /opt/ed-finder-v3-runtime/mount-storagebox.sh 2>/dev/null || true
          echo 'database_writes_performed|false'
          REMOTE
