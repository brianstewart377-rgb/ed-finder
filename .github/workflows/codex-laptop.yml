name: Codex Worker
run-name: Codex Worker · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Codex CLI"
        required: true
        type: string
      mode:
        description: "Execution mode"
        required: true
        default: investigate
        type: choice
        options:
          - investigate
          - implement
      target_branch:
        description: "Existing non-protected branch to update in implement mode (optional)"
        required: false
        default: ""
        type: string
      request_id:
        description: "Stable request identifier supplied by the async dispatcher"
        required: false
        default: manual
        type: string

permissions:
  contents: read

jobs:
  codex:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.implement.outputs.branch }}
      update_existing: ${{ steps.implement.outputs.update_existing }}
      expected_remote_sha: ${{ steps.implement.outputs.expected_remote_sha }}
      base_sha: ${{ steps.implement.outputs.base_sha }}
      candidate_sha: ${{ steps.implement.outputs.candidate_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 10
          ref: main
          persist-credentials: false

      - name: Resolve request
        id: request
        shell: bash
        env:
          INPUT_TASK: ${{ inputs.task }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          task="$INPUT_TASK"
          mode="$INPUT_MODE"
          target_branch="$INPUT_TARGET_BRANCH"
          [ -n "${task//[[:space:]]/}" ] || { echo "task must be non-empty" >&2; exit 64; }
          case "$mode" in
            investigate|implement) ;;
            *) echo "unsupported mode: $mode" >&2; exit 64 ;;
          esac
          if [ -n "$target_branch" ]; then
            [ "$mode" = "implement" ] || {
              echo "target_branch is only valid for implement mode" >&2
              exit 64
            }
            git check-ref-format --branch "$target_branch" >/dev/null 2>&1 || {
              echo "target_branch is not a valid Git branch name" >&2
              exit 64
            }
            case "$target_branch" in
              main|master|codex-task-requests|chatgpt-ops-requests|chatgpt-ed-new-ops-requests)
                echo "target_branch is protected/control-plane state and cannot be updated by Codex" >&2
                exit 64
                ;;
            esac
          fi
          task_file="$RUNNER_TEMP/codex-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          umask 077
          printf '%s' "$task" > "$task_file"
          {
            echo "mode=$mode"
            echo "target_branch=$target_branch"
          } >> "$GITHUB_OUTPUT"
          echo "CODEX_REQUEST_ID=$REQUEST_ID"

      - name: Switch to main workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' --depth=10
          git checkout -B main refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          git clean -ffdx

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Prepare repository state gate
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python >/dev/null 2>&1; then
            echo "::error::Codex Worker requires Python 3.12, but the selected interpreter is unavailable."
            exit 69
          fi
          if ! python -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)'; then
            echo "::error::The selected interpreter did not report the required Python 3.12 version."
            python --version >&2 || true
            exit 69
          fi
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
          fi
          if ! .venv/bin/python -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)'; then
            echo "::error::The repository venv does not use the required Python 3.12 interpreter."
            .venv/bin/python --version >&2 || true
            exit 69
          fi
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -B scripts/dev/resolve_project_state.py --strict
          echo "CODEX_STATE_GATE=PASS"

      - name: Bootstrap pinned Python test environment
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install --requirement tests/requirements-ci.txt
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify pinned Python test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python -m pytest --version
          python -m ruff --version

      - name: Verify worker identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME"
          echo "workspace=$GITHUB_WORKSPACE"
          id
          uname -a
          if ! command -v codex >/dev/null 2>&1; then
            echo "CODEX_NOT_INSTALLED"
            exit 42
          fi
          codex --version
          [ -x /usr/bin/git ] || { echo "::error::Trusted /usr/bin/git is unavailable." >&2; exit 69; }

      - name: Run Codex investigation
        if: steps.request.outputs.mode == 'investigate'
        shell: bash
        run: |
          set -euo pipefail
          CODEX_TASK_FILE="$RUNNER_TEMP/codex-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          [ -f "$CODEX_TASK_FILE" ] || { echo "Codex task file is missing" >&2; exit 64; }
          CODEX_TASK="$(cat "$CODEX_TASK_FILE")"
          before="$(git status --porcelain=v1 --untracked-files=all)"
          [ -z "$before" ] || { echo "Workspace not clean before Codex" >&2; printf '%s\n' "$before" >&2; exit 65; }
          prompt="You are operating in the ED-Finder repository as an investigation-only worker. The wrapper has already run the repository's mandatory state-resolution gate successfully on named branch main at origin/main. Do not modify files, commit, push, deploy, access production, or use production credentials. Inspect the repository and answer the task below with concrete file paths and findings.\n\nTASK:\n$CODEX_TASK"
          codex exec --sandbox danger-full-access "$prompt"
          after="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$after" ]; then
            echo "Investigation modified the workspace; failing closed." >&2
            printf '%s\n' "$after" >&2
            git reset --hard HEAD
            git clean -ffdx
            exit 66
          fi

      - name: Run Codex implementation
        if: steps.request.outputs.mode == 'implement'
        id: implement
        shell: bash
        env:
          CODEX_TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
        run: |
          set -euo pipefail
          CODEX_TASK_FILE="$RUNNER_TEMP/codex-task-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          [ -f "$CODEX_TASK_FILE" ] || { echo "Codex task file is missing" >&2; exit 64; }
          CODEX_TASK="$(cat "$CODEX_TASK_FILE")"
          update_existing=false
          expected_remote_sha=""
          if [ -n "$CODEX_TARGET_BRANCH" ]; then
            git fetch origin "+refs/heads/$CODEX_TARGET_BRANCH:refs/remotes/origin/$CODEX_TARGET_BRANCH" --depth=20
            branch="$CODEX_TARGET_BRANCH"
            base_ref="refs/remotes/origin/$CODEX_TARGET_BRANCH"
            expected_remote_sha="$(git rev-parse "$base_ref")"
            update_existing=true
          else
            branch="codex/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            base_ref="refs/remotes/origin/main"
          fi
          base_sha="$(git rev-parse "$base_ref")"
          git checkout -B "$branch" "$base_ref"
          git config user.name "codex-worker"
          git config user.email "codex-worker@users.noreply.github.com"
          if [ "$update_existing" = true ]; then
            target_context="Update only the existing branch $branch. Preserve its current PR scope and do not reset, rebase, or rewrite unrelated history."
          else
            target_context="Work on the isolated implementation branch created by the wrapper from current origin/main."
          fi
          prompt="You are an implementation worker in the ED-Finder repository. The wrapper has already run the mandatory repository state-resolution gate successfully on named branch main at origin/main before selecting this isolated implementation target. Do not rerun that gate merely because the branch name is now different. $target_context Read CLAUDE.md and relevant repository docs first. Implement the requested task completely. Spread independent work across parallel agents where appropriate for speed. Run the focused tests/lint/typechecks needed to support your changes. Do not deploy, access production systems, or use production credentials. Do not commit or push; the wrapper will do that after inspection. End with a concise summary of files changed, tests run, and any remaining risks.\n\nTASK:\n$CODEX_TASK"
          codex exec --sandbox danger-full-access "$prompt"
          /usr/bin/git -c core.hooksPath=/dev/null diff --check
          changes="$(/usr/bin/git -c core.hooksPath=/dev/null status --porcelain=v1 --untracked-files=all)"
          if [ -z "$changes" ]; then
            echo "Codex produced no changes; refusing empty implementation branch." >&2
            exit 67
          fi
          echo "== changed files =="
          /usr/bin/git -c core.hooksPath=/dev/null status --short
          /usr/bin/git -c core.hooksPath=/dev/null add -A
          /usr/bin/git -c core.hooksPath=/dev/null -c user.name=codex-worker -c user.email=codex-worker@users.noreply.github.com commit -m "Codex implementation run ${GITHUB_RUN_ID}"
          candidate_sha="$(/usr/bin/git -c core.hooksPath=/dev/null rev-parse HEAD)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "update_existing=$update_existing" >> "$GITHUB_OUTPUT"
          echo "expected_remote_sha=$expected_remote_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "CODEX_BRANCH_LOCAL=$branch"

      - name: Seal implementation result
        if: steps.request.outputs.mode == 'implement' && steps.implement.outputs.branch != ''
        id: sealed
        shell: bash
        env:
          CODEX_BRANCH: ${{ steps.implement.outputs.branch }}
          CODEX_CANDIDATE_SHA: ${{ steps.implement.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/codex-result.bundle"
          rm -f "$bundle"
          actual_sha="$(/usr/bin/git -c core.hooksPath=/dev/null rev-parse "refs/heads/$CODEX_BRANCH")"
          [ "$actual_sha" = "$CODEX_CANDIDATE_SHA" ] || {
            echo "::error::Implementation branch changed after Codex completed; refusing to seal it."
            exit 70
          }
          /usr/bin/git -c core.hooksPath=/dev/null -c credential.helper= bundle create "$bundle" "refs/heads/$CODEX_BRANCH"
          /usr/bin/git bundle verify "$bundle" >/dev/null
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload sealed implementation result
        if: steps.request.outputs.mode == 'implement' && steps.implement.outputs.branch != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.sealed.outputs.bundle }}
          if-no-files-found: error
          retention-days: 1

  push:
    needs: codex
    if: inputs.mode == 'implement' && needs.codex.outputs.branch != ''
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download sealed implementation result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: codex-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-result

      - name: Reconstruct trusted push repository
        id: trusted
        shell: bash
        env:
          CODEX_BRANCH: ${{ needs.codex.outputs.branch }}
          CODEX_UPDATE_EXISTING: ${{ needs.codex.outputs.update_existing }}
          CODEX_EXPECTED_REMOTE_SHA: ${{ needs.codex.outputs.expected_remote_sha }}
          CODEX_BASE_SHA: ${{ needs.codex.outputs.base_sha }}
          CODEX_CANDIDATE_SHA: ${{ needs.codex.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          trusted_git=/usr/bin/git
          [ -x "$trusted_git" ] || { echo "::error::Trusted /usr/bin/git is unavailable." >&2; exit 69; }
          bundle="$RUNNER_TEMP/codex-result/codex-result.bundle"
          [ -f "$bundle" ] || { echo "::error::Sealed Codex result bundle is missing." >&2; exit 70; }

          trusted_root="$RUNNER_TEMP/codex-trusted-push-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trusted_repo="$trusted_root/repo"
          trusted_home="$trusted_root/home"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_repo" "$trusted_home"

          export HOME="$trusted_home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null
          export GIT_TERMINAL_PROMPT=0
          PATH=/usr/bin:/bin
          export PATH

          "$trusted_git" -c core.hooksPath=/dev/null init "$trusted_repo" >/dev/null
          "$trusted_git" -C "$trusted_repo" -c core.hooksPath=/dev/null -c credential.helper= remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          "$trusted_git" -C "$trusted_repo" -c core.hooksPath=/dev/null -c credential.helper= fetch --no-tags "$bundle" "refs/heads/$CODEX_BRANCH:refs/remotes/codex/result"

          imported_sha="$("$trusted_git" -C "$trusted_repo" -c core.hooksPath=/dev/null rev-parse refs/remotes/codex/result)"
          [ "$imported_sha" = "$CODEX_CANDIDATE_SHA" ] || {
            echo "::error::Sealed implementation SHA mismatch."
            exit 70
          }
          "$trusted_git" -C "$trusted_repo" -c core.hooksPath=/dev/null merge-base --is-ancestor "$CODEX_BASE_SHA" "$CODEX_CANDIDATE_SHA" || {
            echo "::error::Codex result is not descended from its recorded base; refusing history rewrite."
            exit 70
          }

          if [ "$CODEX_UPDATE_EXISTING" = true ]; then
            workflow_diff_base="$CODEX_EXPECTED_REMOTE_SHA"
          else
            workflow_diff_base="$CODEX_BASE_SHA"
          fi
          workflow_changes="$("$trusted_git" -C "$trusted_repo" -c core.hooksPath=/dev/null diff --name-only "$workflow_diff_base" "$CODEX_CANDIDATE_SHA" -- '.github/workflows/' || true)"
          requires_privileged=false
          if [ -n "$workflow_changes" ]; then
            requires_privileged=true
          fi
          echo "trusted_repo=$trusted_repo" >> "$GITHUB_OUTPUT"
          echo "trusted_home=$trusted_home" >> "$GITHUB_OUTPUT"
          echo "requires_privileged=$requires_privileged" >> "$GITHUB_OUTPUT"

      - name: Push sealed implementation with exact-head lease
        shell: bash
        env:
          CODEX_BRANCH: ${{ needs.codex.outputs.branch }}
          CODEX_UPDATE_EXISTING: ${{ needs.codex.outputs.update_existing }}
          CODEX_EXPECTED_REMOTE_SHA: ${{ needs.codex.outputs.expected_remote_sha }}
          CODEX_WORKER_GIT_TOKEN: ${{ secrets.CODEX_WORKER_GIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_REPO: ${{ steps.trusted.outputs.trusted_repo }}
          TRUSTED_HOME: ${{ steps.trusted.outputs.trusted_home }}
          REQUIRES_PRIVILEGED: ${{ steps.trusted.outputs.requires_privileged }}
        run: |
          set -euo pipefail
          trusted_git=/usr/bin/git
          PATH=/usr/bin:/bin
          export PATH
          export HOME="$TRUSTED_HOME"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null
          export GIT_TERMINAL_PROMPT=0

          if [ "$REQUIRES_PRIVILEGED" = true ] && [ -z "$CODEX_WORKER_GIT_TOKEN" ]; then
            echo "::error::Codex changed GitHub workflow files, but CODEX_WORKER_GIT_TOKEN is not configured."
            exit 68
          fi
          push_token="${CODEX_WORKER_GIT_TOKEN:-$GITHUB_TOKEN}"

          askpass="$TRUSTED_HOME/askpass"
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$CODEX_PUSH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export CODEX_PUSH_TOKEN="$push_token"
          export GIT_ASKPASS="$askpass"

          if [ "$CODEX_UPDATE_EXISTING" = true ]; then
            "$trusted_git" -C "$TRUSTED_REPO" -c core.hooksPath=/dev/null -c credential.helper= push \
              --force-with-lease="refs/heads/$CODEX_BRANCH:$CODEX_EXPECTED_REMOTE_SHA" \
              origin "refs/remotes/codex/result:refs/heads/$CODEX_BRANCH"
          else
            "$trusted_git" -C "$TRUSTED_REPO" -c core.hooksPath=/dev/null -c credential.helper= push \
              --force-with-lease="refs/heads/$CODEX_BRANCH:" \
              origin "refs/remotes/codex/result:refs/heads/$CODEX_BRANCH"
          fi
          echo "CODEX_BRANCH=$CODEX_BRANCH"
          echo "CODEX_UPDATED_EXISTING_BRANCH=$CODEX_UPDATE_EXISTING"

      - name: Implementation branch summary
        shell: bash
        env:
          CODEX_BRANCH: ${{ needs.codex.outputs.branch }}
          CODEX_UPDATE_EXISTING: ${{ needs.codex.outputs.update_existing }}
        run: |
          set -euo pipefail
          if [ "$CODEX_UPDATE_EXISTING" = true ]; then
            echo "Existing implementation branch updated: $CODEX_BRANCH"
            echo "The existing pull request will pick up the pushed commit automatically."
          else
            echo "Implementation branch pushed: $CODEX_BRANCH"
            echo "Open a PR only after review of the diff and test evidence."
          fi
