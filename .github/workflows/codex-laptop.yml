name: Codex Worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Codex CLI"
        required: true
        type: string
      mode:
        description: "Execution mode"
        required: true
        default: investigate
        type: choice
        options:
          - investigate
          - implement
  push:
    branches:
      - codex-task-requests
    paths:
      - '.github/codex-requests/*.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-worker
  cancel-in-progress: false

jobs:
  codex:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_MODE: ${{ inputs.mode }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            task="$INPUT_TASK"
            mode="$INPUT_MODE"
          elif [ "$EVENT_NAME" = "push" ]; then
            mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- '.github/codex-requests/*.json')
            [ "${#files[@]}" -eq 1 ] || { echo "Expected exactly one Codex request file" >&2; exit 64; }
            mode="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); extra=set(d)-{"task","mode"}; extra and sys.exit("unsupported request keys"); m=d.get("mode","investigate"); m in {"investigate","implement"} or sys.exit("unsupported mode"); print(m)' "${files[0]}")"
            task="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); t=d.get("task"); isinstance(t,str) and t.strip() or sys.exit("task must be non-empty"); print(t.replace("\n"," "))' "${files[0]}")"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 64
          fi
          {
            echo "mode=$mode"
            echo "task<<EOF"
            echo "$task"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Switch to main workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' --depth=10
          git checkout -B main refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          git clean -ffdx

      - name: Prepare repository state gate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -B scripts/dev/resolve_project_state.py --strict
          echo "CODEX_STATE_GATE=PASS"

      - name: Verify worker identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME"
          echo "workspace=$GITHUB_WORKSPACE"
          id
          uname -a
          if ! command -v codex >/dev/null 2>&1; then
            echo "CODEX_NOT_INSTALLED"
            exit 42
          fi
          codex --version

      - name: Run Codex investigation
        if: steps.request.outputs.mode == 'investigate'
        shell: bash
        env:
          CODEX_TASK: ${{ steps.request.outputs.task }}
        run: |
          set -euo pipefail
          before="$(git status --porcelain=v1 --untracked-files=all)"
          [ -z "$before" ] || { echo "Workspace not clean before Codex" >&2; printf '%s\n' "$before" >&2; exit 65; }
          prompt="You are operating in the ED-Finder repository as an investigation-only worker. The wrapper has already run the repository's mandatory state-resolution gate successfully on named branch main at origin/main. Do not modify files, commit, push, deploy, access production, or use production credentials. Inspect the repository and answer the task below with concrete file paths and findings.\n\nTASK:\n$CODEX_TASK"
          codex exec --sandbox danger-full-access "$prompt"
          after="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$after" ]; then
            echo "Investigation modified the workspace; failing closed." >&2
            printf '%s\n' "$after" >&2
            git reset --hard HEAD
            git clean -ffdx
            exit 66
          fi

      - name: Run Codex implementation
        if: steps.request.outputs.mode == 'implement'
        id: implement
        shell: bash
        env:
          CODEX_TASK: ${{ steps.request.outputs.task }}
        run: |
          set -euo pipefail
          branch="codex/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -B "$branch" refs/remotes/origin/main
          git config user.name "codex-worker"
          git config user.email "codex-worker@users.noreply.github.com"
          prompt="You are an implementation worker in the ED-Finder repository. The wrapper has already run the mandatory repository state-resolution gate successfully on named branch main at origin/main before creating this isolated implementation branch; do not rerun that gate merely because the branch name is now different. Read CLAUDE.md and relevant repository docs first. Implement the requested task completely. Spread independent work across parallel agents where appropriate for speed. Run the focused tests/lint/typechecks needed to support your changes. Do not deploy, access production systems, or use production credentials. Do not commit or push; the wrapper will do that after inspection. End with a concise summary of files changed, tests run, and any remaining risks.\n\nTASK:\n$CODEX_TASK"
          codex exec --sandbox danger-full-access "$prompt"
          git diff --check
          changes="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -z "$changes" ]; then
            echo "Codex produced no changes; refusing empty implementation branch." >&2
            exit 67
          fi
          echo "== changed files =="
          git status --short
          git add -A
          git commit -m "Codex implementation run ${GITHUB_RUN_ID}"
          git push --force-with-lease origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "CODEX_BRANCH=$branch"

      - name: Implementation branch summary
        if: steps.request.outputs.mode == 'implement' && steps.implement.outputs.branch != ''
        shell: bash
        env:
          CODEX_BRANCH: ${{ steps.implement.outputs.branch }}
        run: |
          set -euo pipefail
          echo "Implementation branch pushed: $CODEX_BRANCH"
          echo "Open a PR only after review of the diff and test evidence."
