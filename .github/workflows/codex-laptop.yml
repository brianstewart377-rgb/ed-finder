name: Codex Worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Codex CLI"
        required: true
        type: string
      mode:
        description: "Execution mode"
        required: true
        default: investigate
        type: choice
        options:
          - investigate
          - implement
  push:
    branches:
      - codex-task-requests
    paths:
      - '.github/codex-requests/*.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-worker
  cancel-in-progress: false

jobs:
  codex:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_MODE: ${{ inputs.mode }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            task="$INPUT_TASK"
            mode="$INPUT_MODE"
          elif [ "$EVENT_NAME" = "push" ]; then
            mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- '.github/codex-requests/*.json')
            [ "${#files[@]}" -eq 1 ] || { echo "Expected exactly one Codex request file" >&2; exit 64; }
            mode="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); extra=set(d)-{"task","mode"}; extra and sys.exit("unsupported request keys"); m=d.get("mode","investigate"); m in {"investigate","implement"} or sys.exit("unsupported mode"); print(m)' "${files[0]}")"
            task="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); t=d.get("task"); isinstance(t,str) and t.strip() or sys.exit("task must be non-empty"); print(t.replace("\n"," "))' "${files[0]}")"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 64
          fi
          {
            echo "mode=$mode"
            echo "task<<EOF"
            echo "$task"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Switch to main workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=2
          git checkout --detach origin/main
          git reset --hard origin/main
          git clean -ffdx

      - name: Verify worker identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME"
          echo "workspace=$GITHUB_WORKSPACE"
          id
          uname -a
          if ! command -v codex >/dev/null 2>&1; then
            echo "CODEX_NOT_INSTALLED"
            exit 42
          fi
          codex --version

      - name: Run Codex investigation
        if: steps.request.outputs.mode == 'investigate'
        shell: bash
        env:
          CODEX_TASK: ${{ steps.request.outputs.task }}
        run: |
          set -euo pipefail
          before="$(git status --porcelain=v1 --untracked-files=all)"
          [ -z "$before" ] || { echo "Workspace not clean before Codex" >&2; printf '%s\n' "$before" >&2; exit 65; }
          prompt="You are operating in the ED-Finder repository as an investigation-only worker. Do not modify files, commit, push, deploy, access production, or use production credentials. Inspect the repository and answer the task below with concrete file paths and findings.\n\nTASK:\n$CODEX_TASK"
          # Ubuntu 24.04 on this dedicated, credential-free dev worker blocks Codex's
          # bwrap user/network namespace setup. Use Codex's no-sandbox execution only
          # for investigation jobs, then fail closed if the workspace changed at all.
          codex exec --sandbox danger-full-access "$prompt"
          after="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$after" ]; then
            echo "Investigation modified the workspace; failing closed." >&2
            printf '%s\n' "$after" >&2
            git reset --hard HEAD
            git clean -ffdx
            exit 66
          fi

      - name: Implement mode safety stop
        if: steps.request.outputs.mode == 'implement'
        shell: bash
        run: |
          echo 'Implement mode is intentionally disabled until the investigation-only worker is proven end-to-end.' >&2
          exit 64
