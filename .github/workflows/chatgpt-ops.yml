name: ChatGPT Ops Control Plane
run-name: ChatGPT Ops · ${{ inputs.request_id || github.run_id }} · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted operation"
        required: true
        type: choice
        options:
          - production-status
          - db-readonly-health
          - latest-artifacts
          - latest-artifact-summary
          - octopus-qdrant-healthcheck-repair
      artifact_stage:
        description: "Artifact stage for artifact operations"
        required: false
        default: "stage-18j"
        type: string
      request_id:
        description: "Dispatcher receipt identifier (optional for manual runs)"
        required: false
        type: string
      request_file:
        description: "Validated request path (dispatcher use)"
        required: false
        type: string
      request_sha:
        description: "Validated request revision (dispatcher use)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  queue:
    name: Wait for earlier trusted executor runs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Enter durable FIFO
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: chatgpt-ops.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          run_id = int(os.environ["RUN_ID"])
          base = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/{os.environ['WORKFLOW_FILE']}/runs"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          while True:
              older = []
              for status in ("queued", "in_progress", "waiting", "pending", "requested"):
                  page = 1
                  while True:
                      query = urllib.parse.urlencode({"event": "workflow_dispatch", "status": status, "per_page": 100, "page": page})
                      request = urllib.request.Request(f"{base}?{query}", headers=headers)
                      with urllib.request.urlopen(request, timeout=30) as response:
                          runs = json.load(response).get("workflow_runs", [])
                      older.extend(run["id"] for run in runs if int(run["id"]) < run_id)
                      if len(runs) < 100:
                          break
                      page += 1
              if not older:
                  print(f"FIFO acquired by workflow run {run_id}")
                  break
              print(f"Waiting behind {len(set(older))} earlier active executor run(s)", flush=True)
              time.sleep(15)
          PY

  execute:
    name: Run allowlisted production operation
    if: github.ref == 'refs/heads/main'
    needs: queue
    runs-on: ubuntu-latest
    environment: hetzner-operator
    timeout-minutes: 10
    steps:
      - name: Checkout trusted operator implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Validate request inputs
        id: request
        shell: bash
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_ARTIFACT_STAGE: ${{ inputs.artifact_stage }}
        run: |
          set -euo pipefail

          operation="$INPUT_OPERATION"
          artifact_stage="${INPUT_ARTIFACT_STAGE:-stage-18j}"

          case "$operation" in
            production-status) stage=context ;;
            db-readonly-health) stage=db-readonly-health ;;
            latest-artifacts) stage=latest-artifacts ;;
            latest-artifact-summary) stage=latest-artifact-summary ;;
            octopus-qdrant-healthcheck-repair) stage=octopus-qdrant-healthcheck-repair ;;
            *) echo "Unsupported operation: $operation" >&2; exit 64 ;;
          esac

          case "$artifact_stage" in
            stage-[A-Za-z0-9]*) ;;
            *) echo "Unsupported artifact_stage: $artifact_stage" >&2; exit 64 ;;
          esac
          if printf '%s' "$artifact_stage" | grep -q '[^A-Za-z0-9_-]'; then
            echo "artifact_stage contains invalid characters" >&2
            exit 64
          fi

          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "artifact_stage=$artifact_stage" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing HETZNER_OPERATOR_SSH_KEY" >&2; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing HETZNER_OPERATOR_HOST" >&2; exit 1; }
          test -n "$SSH_PORT" || { echo "Missing HETZNER_OPERATOR_PORT" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hetzner_operator_key
          chmod 600 ~/.ssh/hetzner_operator_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run existing fail-closed operator dispatcher
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.HETZNER_OPERATOR_USER }}
          STAGE: ${{ steps.request.outputs.stage }}
          ARTIFACT_STAGE: ${{ steps.request.outputs.artifact_stage }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing HETZNER_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/hetzner_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "cd /opt/ed-finder && git fetch origin main && git checkout main && git pull --ff-only origin main && bash scripts/operator/actions/dispatch.sh '$STAGE' '$ARTIFACT_STAGE'"
