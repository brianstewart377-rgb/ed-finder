name: Review Lab

# Validation lane authority:
# - This workflow owns the isolated deterministic Review Lab only.
# - It is separate from normal V3 Product E2E / Visual Acceptance.
# - Cypress inside Review Lab is a controlled browser driver/collector, not the
#   owner of normal product E2E or approved visual-regression baselines.
# - The collector targets apps/web + Babylon against isolated synthetic data.
# See docs/development/v3-browser-validation-lanes.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-lab:
    name: Review Lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up Node 24 for V3 Review Lab collector
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Create repo virtualenv and install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r apps/api/requirements.txt
          ./.venv/bin/pip install pytest pytest-asyncio httpx anyio

      - name: Install apps/web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Verify Review Lab Cypress browser driver
        working-directory: apps/web
        run: pnpm exec cypress verify

      - name: Confirm Docker Compose support
        run: docker compose version

      - name: Run focused Review Lab contract tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 ./.venv/bin/python -B -m pytest \
            tests/test_review_lab_v3.py \
            tests/test_review_lab_timeouts.py \
            tests/test_db_isolation_guardrails.py \
            -p no:cacheprovider

      - name: Run Review Lab preflight
        run: |
          PYTHONDONTWRITEBYTECODE=1 ./.venv/bin/python -B \
            scripts/dev/review_environment.py preflight

      - name: Run Review Lab full verification
        run: |
          PYTHONDONTWRITEBYTECODE=1 ./.venv/bin/python -B \
            scripts/dev/review_environment.py verify \
            --mode full \
            --scenario all \
            --confirm-local-review-environment

      - name: Invoke safe Review Lab teardown through wrapper
        if: always()
        run: |
          PYTHONDONTWRITEBYTECODE=1 ./.venv/bin/python -B \
            scripts/dev/review_environment.py down \
            --confirm-local-review-environment

      - name: Assert no Review Lab resources remain
        if: always()
        run: |
          mapfile -t review_containers < <(docker ps -a --filter "label=com.docker.compose.project=edfinder-review" --format '{{.Names}}')
          mapfile -t review_volumes < <(docker volume ls --filter "label=com.docker.compose.project=edfinder-review" --format '{{.Name}}')
          mapfile -t review_networks < <(docker network ls --filter "label=com.docker.compose.project=edfinder-review" --format '{{.Name}}')
          if (( ${#review_containers[@]} > 0 )); then
            printf '::error::Review Lab containers remained after teardown: %s\n' "${review_containers[*]}"
            exit 1
          fi
          if (( ${#review_volumes[@]} > 0 )); then
            printf '::error::Review Lab volumes remained after teardown: %s\n' "${review_volumes[*]}"
            exit 1
          fi
          if (( ${#review_networks[@]} > 0 )); then
            printf '::error::Review Lab networks remained after teardown: %s\n' "${review_networks[*]}"
            exit 1
          fi

      - name: Write Review Lab job summary
        if: always()
        run: |
          ./.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path('/tmp/edfinder-local-review/latest-report.json')
          lines = ['## Review Lab']
          if summary_path.is_file():
              pointer = json.loads(summary_path.read_text(encoding='utf-8'))
              report_path = Path(pointer['report_file'])
              report = json.loads(report_path.read_text(encoding='utf-8'))
              duration_ms = report.get('verify_duration_ms')
              duration_text = f"{duration_ms / 1000:.2f}s" if isinstance(duration_ms, int) else 'unavailable'
              teardown = report.get('phase_results', {}).get('teardown', {})
              remaining = teardown.get('safe_diagnostics', {}).get('remaining_review_resources', {})
              remaining_absent = not remaining.get('containers') and not remaining.get('volumes') and not remaining.get('networks')
              lines.extend([
                  f"- Review Lab full verification: {'passed' if report.get('ok') else 'failed'}",
                  f"- Full duration: {duration_text}",
                  "- Frontend/runtime: apps/web + Babylon",
                  f"- Synthetic scenarios: {', '.join(report.get('selected_scenarios', [])) or 'none'}",
                  f"- Unexpected console errors: {report.get('unexpected_console_errors') or 'none'}",
                  f"- Unexpected API errors: {report.get('unexpected_api_errors') or 'none'}",
                  f"- Docker baseline restored: {report.get('docker_baseline_restored')}",
                  f"- Review-owned resources absent: {remaining_absent}",
              ])
          else:
              lines.append('- Review Lab full verification: no sanitised report written')
          github_summary = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          github_summary.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload sanitised Review Lab report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-lab-report
          path: |
            /tmp/edfinder-local-review/latest-report.json
            /tmp/edfinder-local-review/*/report.json
            /tmp/edfinder-local-review/*/browser-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload isolated Review Lab Cypress diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-lab-cypress-failure
          path: |
            apps/web/cypress/artifacts/review-lab
          if-no-files-found: warn
          retention-days: 7
