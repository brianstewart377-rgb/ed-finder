name: One-shot V2 Archive Status

on:
  push:
    branches:
      - chatgpt-ops-requests
    paths:
      - '.github/workflows/one-shot-v2-archive-status.yml'

permissions:
  contents: read

jobs:
  status:
    name: Verify final V2 archive completion
    runs-on: ubuntu-latest
    environment: hetzner-operator
    timeout-minutes: 15
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read archive and offsite verification status
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.HETZNER_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s --' <<'REMOTE'
          set -euo pipefail
          root=/data/backups/hetzner-retirement-20260830
          state="$root/database/STATE.txt"
          unit=edfinder-hetzner-final-db-preservation-20260830.service

          echo '===== LOCAL STATE ====='
          [ -f "$state" ] && cat "$state" || echo state_missing=true
          systemctl is-active "$unit" 2>/dev/null || true
          systemctl is-failed "$unit" 2>/dev/null || true
          systemctl --no-pager status "$unit" 2>/dev/null | sed -n '1,35p' || true
          [ -f "$root/database/final-logical-snapshot.log" ] && tail -80 "$root/database/final-logical-snapshot.log" || true
          find "$root/database" -maxdepth 2 -type f -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TSZ\t%p\n' 2>/dev/null | sort -nr | head -40

          echo '===== LOCAL INTEGRITY ====='
          [ -f "$root/reference/SHA256SUMS" ]
          (cd "$root/reference" && sha256sum -c SHA256SUMS)
          if [ -d "$root/database/edfinder-pg16-directory" ]; then
            pg_restore --list "$root/database/edfinder-pg16-directory" >/dev/null
            echo local_database_catalog_valid=true
          else
            echo local_database_catalog_valid=false
          fi

          echo '===== OFFSITE STATE ====='
          docker exec ed-maintenance bash -lc '
            set -euo pipefail
            remote="$BACKUP_OFFSITE_REMOTE/hetzner-retirement-20260830"
            rclone lsf "$remote/reference" --files-only --format "sp" | sort
            echo --database-metadata--
            rclone lsf "$remote/database" --max-depth 1 --files-only --format "sp" | sort || true
            echo --remote-state--
            rclone cat "$remote/database/STATE.txt" 2>/dev/null || echo remote_state_missing=true
            echo --reference-check--
            rclone check /data/backups/hetzner-retirement-20260830/reference "$remote/reference" --one-way --checkers 12
            if [ -d /data/backups/hetzner-retirement-20260830/database/edfinder-pg16-directory ]; then
              echo --database-check--
              rclone check /data/backups/hetzner-retirement-20260830/database/edfinder-pg16-directory "$remote/database/edfinder-pg16-directory" --one-way --checkers 24
            fi
          '

          if [ -f "$state" ] && grep -q '^status=complete$' "$state"; then
            echo archive_complete=true
          else
            echo archive_complete=false
          fi
          echo code_changes=false
          echo v3_changes=false
          echo routing_changes=false
          REMOTE
