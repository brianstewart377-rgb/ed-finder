name: Container image parity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/container-image-parity.yml'
      - 'apps/api/Dockerfile'
      - 'apps/api/Dockerfile.release'
      - 'apps/api/pyproject.toml'
      - 'apps/api/uv.lock'
      - 'apps/eddn/Dockerfile'
      - 'apps/importer/Dockerfile'
      - 'apps/api/requirements.txt'
      - 'apps/eddn/requirements.txt'
      - 'apps/importer/requirements.txt'
      - 'apps/api/src/**'
      - 'apps/eddn/src/**'
      - 'apps/importer/src/**'
      - 'apps/web/**'
      - 'packages/api-client/**'
      - 'packages/planner-core/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.review.yml'
      - 'env.example'
      - 'shared_contracts/**'
      - 'tests/test_container_image_parity.py'
      - 'tests/test_v3_web_release_image.py'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-api-python314:
    name: Release API CPython 3.14 build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.14 for image validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build locked CPython 3.14 release image
        run: |
          docker build \
            --file apps/api/Dockerfile.release \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            --tag ed-finder-release-api:python314 \
            .

      - name: Prove release interpreter and real lifespan startup
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network_name="ed-finder-release-${suffix}"
          postgres_name="ed-finder-release-postgres-${suffix}"
          api_name="ed-finder-release-api-${suffix}"
          cleanup() {
            docker rm --force "${api_name}" "${postgres_name}" >/dev/null 2>&1 || true
            docker network rm "${network_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "${network_name}"
          docker run --detach --name "${postgres_name}" \
            --network "${network_name}" --network-alias postgres \
            --env POSTGRES_USER=edfinder \
            --env POSTGRES_PASSWORD=edfinder \
            --env POSTGRES_DB=edfinder \
            postgres:18-alpine
          for attempt in $(seq 1 30); do
            if docker exec "${postgres_name}" pg_isready -U edfinder -d edfinder >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${postgres_name}"
              exit 1
            fi
            sleep 1
          done

          # Do not override the image command: this must exercise the same
          # uvicorn invocation and real FastAPI lifespan used in production.
          docker run --detach --name "${api_name}" \
            --network "${network_name}" \
            --publish 127.0.0.1:18000:8000 \
            --env DATABASE_URL=postgresql://edfinder:edfinder@postgres:5432/edfinder \
            --env REDIS_URL=redis://127.0.0.1:1/0 \
            --env CORS_ORIGINS=http://127.0.0.1 \
            --env EDDN_SIMULATION_INGEST_ENABLED=false \
            ed-finder-release-api:python314
          for attempt in $(seq 1 30); do
            if health="$(curl --fail --silent http://127.0.0.1:18000/api/health)"; then
              HEALTH_JSON="${health}" EXPECTED_BUILD_SHA="${GITHUB_SHA}" python3 - <<'PY'
          import json
          import os

          health = json.loads(os.environ["HEALTH_JSON"])
          assert health["status"] == "ok", health
          assert health["database"] == "connected", health
          assert health["build_sha"] == os.environ["EXPECTED_BUILD_SHA"], health
          print("Release API health/lifespan proof:", health)
          PY
              docker exec "${api_name}" /proc/1/exe -c \
                "import platform, sys; print('Release server runtime:', platform.python_implementation(), platform.python_version()); assert platform.python_implementation() == 'CPython'; assert sys.version_info[:2] == (3, 14)"
              exit 0
            fi
            sleep 1
          done
          docker logs "${api_name}"
          docker logs "${postgres_name}"
          exit 1

  parity:
    name: Built image parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.14 for image parity
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install parity test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build deployable Svelte web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ed-finder-release-web:container-parity

      - name: Verify web image provenance and static output
        run: |
          test "$(docker image inspect ed-finder-release-web:container-parity \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          docker run --rm --entrypoint sh ed-finder-release-web:container-parity -c \
            'test -f /usr/share/nginx/html/index.html && test -f /usr/share/nginx/html/200.html'
          for page in index.html 200.html; do
            docker run --rm --entrypoint cat ed-finder-release-web:container-parity \
              "/usr/share/nginx/html/$page" | grep -F "<meta name=\"edfinder-build-sha\" content=\"${GITHUB_SHA}\">" >/dev/null
          done

      - name: Prepare Compose environment
        run: cp env.example .env

      - name: Run static container parity contracts
        run: python -m pytest tests/test_container_image_parity.py -q

      - name: Run Svelte release image contracts
        run: python -m pytest tests/test_v3_web_release_image.py -q

      - name: Run built image parity smoke
        env:
          EDFINDER_RUN_CONTAINER_PARITY: 'yes'
        run: |
          python -m pytest tests/test_container_image_parity.py \
            -k built_api_eddn_and_importer_images_pass_runtime_import_parity \
            -q
