name: Container image parity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/container-image-parity.yml'
      - 'apps/api/Dockerfile'
      - 'apps/eddn/Dockerfile'
      - 'apps/importer/Dockerfile'
      - 'apps/postgres/Dockerfile'
      - 'apps/api/requirements.txt'
      - 'apps/eddn/requirements.txt'
      - 'apps/importer/requirements.txt'
      - 'apps/api/src/**'
      - 'apps/eddn/src/**'
      - 'apps/importer/src/**'
      - 'docker-compose.yml'
      - 'docker-compose.review.yml'
      - 'env.example'
      - 'shared_contracts/**'
      - 'tests/test_container_image_parity.py'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: container-image-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Built image parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install parity test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare Compose environment
        run: cp env.example .env

      - name: Run static container parity contracts
        run: python -m pytest tests/test_container_image_parity.py -q

      - name: Run built image parity smoke
        env:
          EDFINDER_RUN_CONTAINER_PARITY: 'yes'
        run: |
          python -m pytest tests/test_container_image_parity.py \
            -k built_api_eddn_and_importer_images_pass_runtime_import_parity \
            -q
