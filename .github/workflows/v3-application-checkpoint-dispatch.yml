name: V3 application checkpoint dispatcher

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Canonical workflow to dispatch
        required: true
        type: choice
        options:
          - release
          - deploy
      source_sha:
        description: Release only - exact current main SHA
        required: false
        type: string
      schema_compatibility:
        description: Release only - reviewed schema compatibility
        required: false
        default: unknown
        type: choice
        options:
          - unknown
          - exact
          - backward-compatible
          - incompatible
      compatibility_evidence:
        description: Release only - non-secret reviewed evidence identifier
        required: false
        type: string
      reviewed_compatible_migration_sets:
        description: Release only - reviewed sha256 identities, one per line
        required: false
        type: string
      rollback_eligible:
        description: Release only - application-only rollback eligibility
        required: false
        default: false
        type: boolean
      deployment_mode:
        description: Deploy only - bootstrap or upgrade
        required: false
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - upgrade
      release_run_id:
        description: Deploy only - successful canonical release workflow run ID
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: v3-application-checkpoint-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch one canonical V3 application boundary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up CPython 3.14 for request validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate and seal exact canonical inputs
        id: request
        shell: bash
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_SCHEMA_COMPATIBILITY: ${{ inputs.schema_compatibility }}
          INPUT_COMPATIBILITY_EVIDENCE: ${{ inputs.compatibility_evidence }}
          INPUT_REVIEWED_MIGRATION_SETS: ${{ inputs.reviewed_compatible_migration_sets }}
          INPUT_ROLLBACK_ELIGIBLE: ${{ inputs.rollback_eligible }}
          INPUT_DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          SEALED_PAYLOAD: ${{ runner.temp }}/canonical-dispatch.json
        run: |
          set -euo pipefail
          python - "$SEALED_PAYLOAD" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          output_path = sys.argv[1]
          raw = {
              "operation": os.environ.get("INPUT_OPERATION", ""),
              "source_sha": os.environ.get("INPUT_SOURCE_SHA", ""),
              "schema_compatibility": os.environ.get("INPUT_SCHEMA_COMPATIBILITY", ""),
              "compatibility_evidence": os.environ.get("INPUT_COMPATIBILITY_EVIDENCE", ""),
              "reviewed_compatible_migration_sets": os.environ.get("INPUT_REVIEWED_MIGRATION_SETS", ""),
              "rollback_eligible": os.environ.get("INPUT_ROLLBACK_ELIGIBLE", "false") == "true",
              "deployment_mode": os.environ.get("INPUT_DEPLOYMENT_MODE", ""),
              "release_run_id": os.environ.get("INPUT_RELEASE_RUN_ID", ""),
          }
          if not isinstance(raw, dict):
              raise SystemExit("request must be an object")
          operation = raw.get("operation")
          if operation not in {"release", "deploy"}:
              raise SystemExit("Unsupported operation: expected release or deploy")

          if operation == "release":
              source_sha = raw.get("source_sha")
              compatibility = raw.get("schema_compatibility", "unknown")
              evidence = raw.get("compatibility_evidence", "")
              reviewed = raw.get("reviewed_compatible_migration_sets", "")
              rollback = raw.get("rollback_eligible", False)
              if not isinstance(source_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
                  raise SystemExit("source_sha must be 40 lowercase hex")
              if compatibility not in {"unknown", "exact", "backward-compatible", "incompatible"}:
                  raise SystemExit("unsupported schema compatibility")
              if not isinstance(evidence, str) or len(evidence) > 256 or "\n" in evidence or "\r" in evidence:
                  raise SystemExit("compatibility evidence must be one bounded string")
              if re.search(r"(?i)(password|token|secret|credential|[a-z][a-z0-9+.-]*://[^/@\s:]+:[^/@\s]+@)", evidence):
                  raise SystemExit("compatibility evidence contains secret-like material")
              if not isinstance(reviewed, str) or len(reviewed.encode()) > 8192:
                  raise SystemExit("reviewed migration identities are invalid")
              identities = [line.strip() for line in reviewed.splitlines() if line.strip()]
              if any(not re.fullmatch(r"sha256:[0-9a-f]{64}", item) for item in identities):
                  raise SystemExit("reviewed migration identities are invalid")
              if len(identities) != len(set(identities)):
                  raise SystemExit("reviewed migration identities repeat")
              if compatibility != "backward-compatible" and identities:
                  raise SystemExit("reviewed migration identities require backward-compatible mode")
              if type(rollback) is not bool:
                  raise SystemExit("rollback_eligible must be boolean")
              workflow = "v3-application-release.yml"
              inputs = {
                  "source_sha": source_sha,
                  "schema_compatibility": compatibility,
                  "compatibility_evidence": evidence,
                  "reviewed_compatible_migration_sets": "\n".join(identities),
                  "rollback_eligible": rollback,
              }
          else:
              mode = raw.get("deployment_mode")
              run_id = raw.get("release_run_id")
              if mode not in {"bootstrap", "upgrade"}:
                  raise SystemExit("deployment_mode must be bootstrap or upgrade")
              if not isinstance(run_id, str) or not re.fullmatch(r"[1-9][0-9]{0,19}", run_id):
                  raise SystemExit("release_run_id is invalid")
              workflow = "v3-application-live-checkpoint-preflight.yml"
              inputs = {"deployment_mode": mode, "release_run_id": run_id}

          Path(output_path).write_text(
              json.dumps({"ref": "main", "inputs": inputs}, separators=(",", ":")),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"workflow={workflow}\n")
          PY

      - name: Invoke canonical workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ steps.request.outputs.workflow }}
          SEALED_PAYLOAD: ${{ runner.temp }}/canonical-dispatch.json
        run: |
          set -euo pipefail
          response="$(mktemp)"
          http_code="$(curl --silent --show-error --location \
            --output "$response" --write-out '%{http_code}' --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/$WORKFLOW/dispatches" \
            --data-binary "@$SEALED_PAYLOAD")"
          [ "$http_code" = 204 ] || { echo "Canonical workflow dispatch failed with HTTP $http_code" >&2; exit 68; }
          echo "Dispatched $WORKFLOW from exact validated inputs on main"
