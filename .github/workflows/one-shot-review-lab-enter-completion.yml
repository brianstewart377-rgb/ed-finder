name: One-shot Review Lab Enter Completion Fix

on:
  push:
    branches:
      - chatgpt-ops-requests
    paths:
      - '.github/workflows/one-shot-review-lab-enter-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    name: Patch Cypress native Enter completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/run-33282588037-1
          fetch-depth: 0

      - name: Apply two-phase Enter default-action guard
        shell: bash
        run: |
          set -euo pipefail
          expected_head='65914d9f1760dc3bfd5844145bf1b5dc2124a454'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git config user.name 'review-lab-patch-bot'
          git config user.email 'review-lab-patch-bot@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          spec_path = Path('frontend/cypress/e2e/review-environment.cy.js')
          source = spec_path.read_text(encoding='utf-8')

          start = source.index('function armFocusedButtonEnterDefaultAction(control, label) {')
          end = source.index('function startPlannerFromSystemDetail', start)
          replacement = """function armFocusedButtonEnterDefaultAction(control, label) {
            expect(control.tagName, `${label} native element`).to.equal('BUTTON');
            expect(control.disabled, `${label} enabled`).to.equal(false);

            let clickObserved = false;
            let enterEvent = null;
            const observeClick = () => {
              clickObserved = true;
            };
            const observeKeydown = (event) => {
              if (event.key === 'Enter' || event.keyCode === 13) {
                enterEvent = event;
              }
            };
            control.addEventListener('click', observeClick);
            control.addEventListener('keydown', observeKeydown);

            return {
              complete() {
                control.removeEventListener('click', observeClick);
                control.removeEventListener('keydown', observeKeydown);
                expect(enterEvent, `${label} Enter keydown`).not.to.equal(null);

                const stillFocused = control.ownerDocument.activeElement === control;
                if (
                  !enterEvent.defaultPrevented
                  && !clickObserved
                  && stillFocused
                  && control.isConnected
                  && !control.disabled
                ) {
                  control.click();
                }
              },
            };
          }

          function activateControl(testId, keyboard) {
            cy.getByTestId(testId)
              .scrollIntoView({ block: 'center' })
              .should('be.visible');
            if (keyboard) {
              return cy.getByTestId(testId)
                .focus()
                .should('have.focus')
                .then(($control) => {
                  const activation = armFocusedButtonEnterDefaultAction($control[0], testId);
                  return cy.wrap($control, { log: false })
                    .type('{enter}', { force: true })
                    .then(() => activation.complete());
                });
            }
            return cy.getByTestId(testId).click();
          }

          """
          source = source[:start] + replacement + source[end:]

          start = source.index('function ensureTelemetryToggleKeyboardWorks(checks) {')
          end = source.index('function telemetryToggleCanReceiveFocus', start)
          replacement = """function ensureTelemetryToggleKeyboardWorks(checks) {
            assertTelemetryToggleRendered()
              .focus()
              .should('have.focus')
              .then(($toggle) => {
                const activation = armFocusedButtonEnterDefaultAction(
                  $toggle[0],
                  'planner telemetry toggle',
                );
                return cy.wrap($toggle, { log: false })
                  .type('{enter}', { force: true })
                  .then(() => activation.complete());
              });
            telemetryToggle().should('have.attr', 'aria-expanded', 'true');

            assertTelemetryToggleRendered()
              .focus()
              .should('have.focus')
              .then(($toggle) => {
                const activation = armFocusedButtonEnterDefaultAction(
                  $toggle[0],
                  'planner telemetry toggle',
                );
                return cy.wrap($toggle, { log: false })
                  .type('{enter}', { force: true })
                  .then(() => activation.complete());
              });
            telemetryToggle().should('have.attr', 'aria-expanded', 'false').then(() => {
              checks.telemetryToggleKeyboardWorks = true;
              summary.accessibility.plannerDesktopTelemetryToggleKeyboardWorks = true;
            });
          }

          """
          source = source[:start] + replacement + source[end:]
          spec_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_local_review_test_environment.py')
          tests = test_path.read_text(encoding='utf-8')
          start = tests.index('@pytest.mark.unit\ndef test_cypress_keyboard_helpers_requery_controls_and_avoid_pointer_actionability():')
          end = tests.index('\n\n@pytest.mark.unit\ndef test_browser_finder_helper_performs_explicit_search_before_asserting_results():', start)
          replacement = """@pytest.mark.unit
          def test_cypress_keyboard_helpers_requery_controls_and_avoid_pointer_actionability():
              source = _read(FRONTEND_REVIEW_CYPRESS_SPEC)
              enter_default_helper = source[
                  source.index('function armFocusedButtonEnterDefaultAction'):
                  source.index('function activateControl')
              ]
              activation_helper = source[source.index('function activateControl'):source.index('function startPlannerFromSystemDetail')]
              telemetry_helper = source[source.index('function telemetryToggle'):source.index('function collectOverflowMetrics')]

              assert \"control.addEventListener('keydown', observeKeydown)\" in enter_default_helper
              assert \"event.key === 'Enter' || event.keyCode === 13\" in enter_default_helper
              assert 'let enterEvent = null' in enter_default_helper
              assert 'return {' in enter_default_helper
              assert 'complete() {' in enter_default_helper
              assert 'enterEvent.defaultPrevented' in enter_default_helper
              assert 'control.ownerDocument.activeElement === control' in enter_default_helper
              assert '!clickObserved' in enter_default_helper
              assert 'control.click();' in enter_default_helper
              assert 'const activation = armFocusedButtonEnterDefaultAction($control[0], testId);' in activation_helper
              assert \"cy.wrap($control, { log: false })\" in activation_helper
              assert \".type('{enter}', { force: true })\" in activation_helper
              assert '.then(() => activation.complete());' in activation_helper
              assert ":visible" not in telemetry_helper
              assert 'scrollIntoView' not in telemetry_helper
              assert \"getComputedStyle(toggle)\" in telemetry_helper
              assert \"getBoundingClientRect()\" in telemetry_helper
              assert \"rect.width\" in telemetry_helper
              assert \"rect.height\" in telemetry_helper
              assert telemetry_helper.count(\".type('{enter}', { force: true })\") == 2
              assert telemetry_helper.count('.then(() => activation.complete());') == 2
              assert telemetry_helper.count("'planner telemetry toggle'") == 2
              assert \"cy.getByTestId('summary-rail-collapse-toggle').should('be.visible')\" not in source
              assert \"assertRenderedControl('summary-rail-collapse-toggle', 'summary rail collapse toggle')\" in source
              assert telemetry_helper.index(\"aria-expanded', 'true'\") < telemetry_helper.index(\"aria-expanded', 'false'\")
              assert telemetry_helper.index(\"aria-expanded', 'false'\") < telemetry_helper.index(
                  'checks.telemetryToggleKeyboardWorks = true'
              )
              assert telemetry_helper.index(\"aria-expanded', 'false'\") < telemetry_helper.index(
                  'summary.accessibility.plannerDesktopTelemetryToggleKeyboardWorks = true'
              )
          """
          tests = tests[:start] + replacement + tests[end:]
          test_path.write_text(tests, encoding='utf-8')
          PY

          node --check frontend/cypress/e2e/review-environment.cy.js
          python3 -m py_compile tests/test_local_review_test_environment.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path('frontend/cypress/e2e/review-environment.cy.js').read_text(encoding='utf-8')
          assert source.count('.then(() => activation.complete());') == 3
          assert source.count("'planner telemetry toggle'") == 2
          assert 'win.queueMicrotask' not in source
          PY

          git add frontend/cypress/e2e/review-environment.cy.js tests/test_local_review_test_environment.py
          git commit -m 'test: complete missing native Enter action after Cypress type'
          git push origin HEAD:refs/heads/codex/run-33282588037-1
