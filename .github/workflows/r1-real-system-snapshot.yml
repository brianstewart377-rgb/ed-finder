name: R1 Real-System Snapshot

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/r1-real-snapshot-requests/*.json'

permissions:
  contents: read

concurrency:
  group: r1-real-system-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Bounded read-only R1 canonical snapshot
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 20
    steps:
      - name: Checkout request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          [ "${#changed[@]}" -eq 1 ] || { echo 'Expected exactly one R1 snapshot request file' >&2; exit 64; }
          case "${changed[0]}" in
            .github/r1-real-snapshot-requests/*.json) ;;
            *) echo 'Changed path is outside R1 snapshot request allowlist' >&2; exit 64 ;;
          esac
          request_path="${changed[0]}"
          python3 - "$request_path" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding='utf-8'))
          if set(data) != {'operation', 'selectors'}:
              raise SystemExit('Request keys must be exactly operation and selectors')
          if data.get('operation') != 'r1-real-system-snapshot':
              raise SystemExit('Unsupported R1 snapshot operation')
          selectors = data.get('selectors')
          if not isinstance(selectors, list) or not (1 <= len(selectors) <= 20):
              raise SystemExit('selectors must contain 1-20 strings')
          clean = []
          for value in selectors:
              if not isinstance(value, str):
                  raise SystemExit('every selector must be a string')
              value = value.strip()
              if not value:
                  raise SystemExit('selectors may not be empty')
              if len(value) > 128:
                  raise SystemExit('selector exceeds 128 characters')
              clean.append(value)
          if len(clean) != len(set(clean)):
              raise SystemExit('selectors must be unique after trimming')
          path.write_text(json.dumps({'operation':'r1-real-system-snapshot','selectors':clean}, separators=(',',':')), encoding='utf-8')
          print(f'validated_selectors={len(clean)}')
          PY
          echo "path=$request_path" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable reviewed snapshot implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6d1cb6a13f6c118f5f61fde550c6dde09e19690b
          path: trusted-snapshot
          persist-credentials: false

      - name: Install pinned snapshot dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet psycopg2-binary==2.9.12

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing ED_NEW_OPERATOR_SSH_KEY' >&2; exit 1; }
          test -n "$SSH_HOST" || { echo 'Missing ED_NEW_OPERATOR_HOST' >&2; exit 1; }
          test -n "$SSH_PORT" || { echo 'Missing ED_NEW_OPERATOR_PORT' >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing pinned ed-new known-hosts secret' >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key
          chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo 'Pinned known-host trust does not cover configured ed-new host/port' >&2
            exit 1
          }

      - name: Discover retained ED-Finder PostgreSQL database
        id: discover
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo 'Missing ED_NEW_OPERATOR_USER' >&2; exit 1; }
          umask 077
          meta="$RUNNER_TEMP/r1-retained-pg18.json"
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' > "$meta" <<'PY'
          import json
          import subprocess

          container = 'edfinder-v3-phase4c-full-20260827_r5-postgres'
          inspect = json.loads(subprocess.check_output(['docker', 'inspect', container], text=True))[0]
          env = {}
          for item in inspect.get('Config', {}).get('Env', []):
              if '=' in item:
                  key, value = item.split('=', 1)
                  env[key] = value
          user = env.get('POSTGRES_USER') or 'postgres'
          password = env.get('POSTGRES_PASSWORD') or ''
          docker_base = ['docker', 'exec']
          if password:
              docker_base += ['-e', f'PGPASSWORD={password}']
          docker_base += [container, 'psql', '-h', '127.0.0.1', '-U', user, '-At']
          db_names = subprocess.check_output(
              docker_base + ['-d', 'postgres', '-c', 'SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate ORDER BY datname'],
              text=True,
          ).splitlines()
          rows = []
          for db in db_names:
              q = "SELECT to_regclass('public.systems') IS NOT NULL, to_regclass('public.bodies') IS NOT NULL, to_regclass('public.body_rings') IS NOT NULL, to_regclass('public.ratings') IS NOT NULL"
              raw = subprocess.check_output(docker_base + ['-d', db, '-F', '|', '-c', q], text=True).strip()
              systems, bodies, rings, ratings = raw.split('|')
              rows.append({
                  'database': db,
                  'systems': systems == 't',
                  'bodies': bodies == 't',
                  'body_rings': rings == 't',
                  'ratings': ratings == 't',
              })
          matches = [r for r in rows if r['systems'] and r['bodies'] and r['body_rings']]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one retained ED-Finder DB with systems+bodies+body_rings, found {len(matches)}')
          ports = (inspect.get('NetworkSettings', {}).get('Ports', {}) or {}).get('5432/tcp') or []
          if ports and ports[0].get('HostPort'):
              target_host = '127.0.0.1'
              target_port = int(ports[0]['HostPort'])
          else:
              networks = inspect.get('NetworkSettings', {}).get('Networks', {}) or {}
              target_host = next((v.get('IPAddress') for v in networks.values() if v.get('IPAddress')), '')
              target_port = 5432
          if not target_host:
              raise SystemExit('retained PostgreSQL container has no reachable address')
          print(json.dumps({
              'container': container,
              'database': matches[0]['database'],
              'ratings_present': matches[0]['ratings'],
              'user': user,
              'password': password,
              'target_host': target_host,
              'target_port': target_port,
          }))
          PY
          python3 - "$meta" <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print('retained_database:', d['database'])
          print('ratings_table_present:', str(d['ratings_present']).lower())
          print('snapshot_tables_present: true')
          PY
          echo "meta=$meta" >> "$GITHUB_OUTPUT"

      - name: Execute bounded snapshot through SSH tunnel
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          META: ${{ steps.discover.outputs.meta }}
          REQUEST_PATH: ${{ steps.request.outputs.path }}
        run: |
          set -euo pipefail
          local_port="$(python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()
          PY
          )"
          mapfile -t target < <(python3 - "$META" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(d['target_host'])
          print(d['target_port'])
          PY
          )
          target_host="${target[0]}"
          target_port="${target[1]}"
          ssh -N -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -L "127.0.0.1:${local_port}:${target_host}:${target_port}" \
            "$SSH_USER@$SSH_HOST" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT
          python3 - "$local_port" <<'PY'
          import socket, sys, time
          port=int(sys.argv[1])
          for _ in range(60):
              try:
                  with socket.create_connection(('127.0.0.1', port), timeout=.2):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(.1)
          raise SystemExit('SSH PostgreSQL tunnel did not become ready')
          PY
          python3 - "$META" "$REQUEST_PATH" "$local_port" <<'PY'
          import json, os, pathlib, subprocess, sys, urllib.parse
          meta=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          request=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          port=int(sys.argv[3])
          user=urllib.parse.quote(str(meta['user']), safe='')
          password=urllib.parse.quote(str(meta['password']), safe='')
          database=urllib.parse.quote(str(meta['database']), safe='')
          auth=user if not password else f'{user}:{password}'
          dsn=f'postgresql://{auth}@127.0.0.1:{port}/{database}'
          print(f'::add-mask::{dsn}')
          if meta.get('password'):
              print(f"::add-mask::{meta['password']}")
          env=dict(os.environ)
          env['R1_READONLY_DATABASE_URL']=dsn
          script=pathlib.Path('trusted-snapshot/scripts/operator/actions/r1-real-system-snapshot.py').resolve()
          with open('r1-real-system-snapshot.json','w',encoding='utf-8') as out:
              proc=subprocess.run([sys.executable,str(script),*request['selectors']],cwd='trusted-snapshot',env=env,text=True,stdout=out)
          raise SystemExit(proc.returncode)
          PY
          test -s r1-real-system-snapshot.json

      - name: Validate snapshot and print bounded summary
        shell: bash
        env:
          REQUEST_PATH: ${{ steps.request.outputs.path }}
          META: ${{ steps.discover.outputs.meta }}
        run: |
          set -euo pipefail
          python3 - "$REQUEST_PATH" "$META" r1-real-system-snapshot.json <<'PY'
          import json, pathlib, sys
          request=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          meta=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          artifact_path=pathlib.Path(sys.argv[3])
          raw=artifact_path.read_text(encoding='utf-8')
          payload=json.loads(raw)
          if payload.get('transaction_read_only') != 'on':
              raise SystemExit('snapshot did not prove transaction_read_only=on')
          safety=payload.get('safety') or {}
          expected={'db_access_performed':True,'db_read_only_confirmed':True,'db_writes_performed':False,'migrations_performed':False}
          for key,value in expected.items():
              if safety.get(key) is not value:
                  raise SystemExit(f'invalid safety flag {key}: {safety.get(key)!r}')
          snapshots=payload.get('snapshots')
          if not isinstance(snapshots,list) or len(snapshots)>20:
              raise SystemExit('snapshot result is not a bounded list')
          password=str(meta.get('password') or '')
          if password and password in raw:
              raise SystemExit('snapshot artifact contains PostgreSQL password')
          requested=request['selectors']
          returned_keys=set()
          print(f'requested_systems: {len(requested)}')
          print(f'returned_systems: {len(snapshots)}')
          for row in snapshots:
              name=str(row.get('system_name'))
              id64=str(row.get('system_id64'))
              returned_keys.update((name,id64,f'id:{id64}'))
              digest=str(row.get('snapshot_digest') or '')
              print(
                  f"- {name} [{id64}] bodies={row.get('projected_body_rows')}/{row.get('declared_body_count')} "
                  f"completeness={row.get('body_data_completeness')} "
                  f"extraction={row.get('extraction_satisfied')}/{row.get('extraction_disposition')} "
                  f"refinery={row.get('refinery_satisfied')}/{row.get('refinery_disposition')} "
                  f"surface_slots_known={row.get('known_surface_slot_predictions')} "
                  f"surface_slots_unknown={row.get('unknown_surface_slot_predictions')} "
                  f"digest={digest[:20]}"
              )
          not_found=[s for s in requested if s not in returned_keys]
          print('not_found:',json.dumps(not_found,ensure_ascii=True))
          print('db_read_only_confirmed: true')
          print('db_writes_performed: false')
          print('migrations_performed: false')
          PY

      - name: Upload R1 snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r1-real-system-snapshot-${{ github.run_id }}
          path: r1-real-system-snapshot.json
          if-no-files-found: error
          retention-days: 30
