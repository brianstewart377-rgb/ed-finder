name: Frontier Live Credential Inspect

on:
  push:
    branches:
      - chatgpt-ops-requests
    paths:
      - '.github/frontier-live-credential-inspect-requests/*.json'

permissions:
  contents: read

jobs:
  inspect-old:
    name: Compare Hetzner live API and dotenv credentials
    runs-on: ubuntu-latest
    environment: hetzner-operator
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/frontier-live-credential-inspect-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json,pathlib,sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {"operation":"inspect-frontier-live-credentials"}:
              raise SystemExit(64)
          PY
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
      - name: Compare sources without printing values
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.HETZNER_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import hashlib,json,pathlib,subprocess

          keys=['FRONTIER_CLIENT_ID','FRONTIER_CLIENT_SECRET','ADMIN_TOKEN','FRONTIER_REDIRECT_URI']
          placeholder_fragments=('client id shown by frontier','your frontier client id','replace me','changeme','example')

          def parse_env_lines(lines):
              out={}
              for raw in lines:
                  line=raw.strip()
                  if not line or line.startswith('#') or '=' not in line: continue
                  k,v=line.split('=',1); k=k.strip(); v=v.strip()
                  if len(v)>=2 and v[0]==v[-1] and v[0] in ('"',"'"):
                      v=v[1:-1]
                  if k in keys: out[k]=v
              return out

          p=pathlib.Path('/opt/ed-finder/.env')
          dotenv=parse_env_lines(p.read_text(encoding='utf-8').splitlines()) if p.is_file() else {}
          raw=json.loads(subprocess.check_output(['docker','inspect','ed-api'],text=True))[0]
          live=parse_env_lines(raw.get('Config',{}).get('Env',[]))

          def placeholder(v):
              n=' '.join((v or '').lower().replace('+',' ').split())
              return any(f in n for f in placeholder_fragments)
          def same(k):
              return bool(dotenv.get(k)) and bool(live.get(k)) and hashlib.sha256(dotenv[k].encode()).digest()==hashlib.sha256(live[k].encode()).digest()

          print('hetzner_live_client_id_present|'+str(bool(live.get('FRONTIER_CLIENT_ID'))).lower())
          print('hetzner_live_client_id_placeholder|'+str(placeholder(live.get('FRONTIER_CLIENT_ID',''))).lower())
          print('hetzner_dotenv_client_id_present|'+str(bool(dotenv.get('FRONTIER_CLIENT_ID'))).lower())
          print('hetzner_dotenv_client_id_placeholder|'+str(placeholder(dotenv.get('FRONTIER_CLIENT_ID',''))).lower())
          print('client_id_live_matches_dotenv|'+str(same('FRONTIER_CLIENT_ID')).lower())
          print('hetzner_live_client_secret_present|'+str(bool(live.get('FRONTIER_CLIENT_SECRET'))).lower())
          print('hetzner_dotenv_client_secret_present|'+str(bool(dotenv.get('FRONTIER_CLIENT_SECRET'))).lower())
          print('client_secret_live_matches_dotenv|'+str(same('FRONTIER_CLIENT_SECRET')).lower())
          print('hetzner_live_admin_token_present|'+str(bool(live.get('ADMIN_TOKEN'))).lower())
          print('admin_token_live_matches_dotenv|'+str(same('ADMIN_TOKEN')).lower())
          print('values_printed|false')
          print('mutations_performed|false')
          PY

  inspect-new:
    name: Inspect ed-new live API credential shape
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Inspect without printing values
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json,subprocess
          placeholder_fragments=('client id shown by frontier','your frontier client id','replace me','changeme','example')
          raw=json.loads(subprocess.check_output(['docker','inspect','edfinder-v3-api'],text=True))[0]
          env={}
          for line in raw.get('Config',{}).get('Env',[]):
              if '=' in line:
                  k,v=line.split('=',1); env[k]=v
          v=env.get('FRONTIER_CLIENT_ID','')
          n=' '.join(v.lower().replace('+',' ').split())
          print('ed_new_client_id_present|'+str(bool(v)).lower())
          print('ed_new_client_id_placeholder|'+str(any(f in n for f in placeholder_fragments)).lower())
          print('ed_new_client_secret_present|'+str(bool(env.get('FRONTIER_CLIENT_SECRET'))).lower())
          print('values_printed|false')
          print('mutations_performed|false')
          PY
