name: ed-new V3 OAuth Init Smoke

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-v3-oauth-init-smoke-requests/*.json'

permissions:
  contents: read

jobs:
  smoke:
    name: Exercise private Frontier OAuth initiation
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-v3-oauth-init-smoke-requests/*.json) ;; *) exit 64 ;; esac
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Run controlled OAuth initiation and clean test state
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import http.client, json, subprocess, urllib.parse
          c='edfinder-v3-phase4c-full-20260827_r5-postgres'
          db='edfinder_v3_phase4c_full_20260827_r5'
          def sql(q):
              return subprocess.check_output(['docker','exec','-u','postgres',c,'psql','-d',db,'-At','-c',q],text=True).strip()
          before_states=set(filter(None,sql('SELECT state_hash FROM oauth_login_states ORDER BY state_hash').splitlines()))
          before_users=int(sql('SELECT count(*) FROM app_users') or '0')
          before_sessions=int(sql('SELECT count(*) FROM web_sessions') or '0')
          conn=http.client.HTTPConnection('127.0.0.1',58080,timeout=10)
          conn.request('GET','/api/v1/auth/frontier/login?return_to=/oauth-smoke',headers={'Host':'ed-finder.app','User-Agent':'edfinder-v3-oauth-smoke/1'})
          resp=conn.getresponse()
          body=resp.read()
          location=resp.getheader('Location') or ''
          cookie=resp.getheader('Set-Cookie') or ''
          conn.close()
          if resp.status!=302:
              raise SystemExit(f'expected OAuth initiation 302, got {resp.status}')
          u=urllib.parse.urlsplit(location)
          q=urllib.parse.parse_qs(u.query,keep_blank_values=True)
          if u.scheme!='https' or u.hostname!='auth.frontierstore.net' or u.path!='/auth':
              raise SystemExit('OAuth redirect target is not Frontier /auth over HTTPS')
          required={'response_type','client_id','redirect_uri','scope','state','code_challenge','code_challenge_method'}
          if not required.issubset(q):
              raise SystemExit('OAuth redirect is missing required query parameters')
          if q.get('response_type')!=['code'] or q.get('code_challenge_method')!=['S256']:
              raise SystemExit('OAuth redirect does not use Authorization Code + S256 PKCE')
          redirect_uri=(q.get('redirect_uri') or [''])[0]
          redirect=urllib.parse.urlsplit(redirect_uri)
          if redirect.scheme!='https' or redirect.netloc!='ed-finder.app':
              raise SystemExit('Frontier redirect URI is not HTTPS ed-finder.app')
          if redirect.path not in {'/api/v1/auth/frontier/callback','/api/auth/frontier/callback'}:
              raise SystemExit('Frontier redirect URI has an unexpected callback path')
          live_callback='/api/v1/auth/frontier/callback'
          callback_matches_live = redirect.path==live_callback
          low_cookie=cookie.lower()
          for flag in ('httponly','secure','samesite=lax'):
              if flag not in low_cookie:
                  raise SystemExit(f'OAuth state cookie missing {flag}')
          after_states=set(filter(None,sql('SELECT state_hash FROM oauth_login_states ORDER BY state_hash').splitlines()))
          new_states=after_states-before_states
          if len(new_states)!=1:
              raise SystemExit(f'expected exactly one new oauth_login_states row, found {len(new_states)}')
          new_hash=next(iter(new_states))
          row=sql("SELECT return_to || '|' || (expires_at > created_at)::text || '|' || (length(code_verifier) >= 43)::text FROM oauth_login_states WHERE state_hash='"+new_hash.replace("'","''")+"'")
          if row!='/oauth-smoke|t|t':
              raise SystemExit('inserted OAuth state row failed semantic checks')
          after_users=int(sql('SELECT count(*) FROM app_users') or '0')
          after_sessions=int(sql('SELECT count(*) FROM web_sessions') or '0')
          if after_users!=before_users or after_sessions!=before_sessions:
              raise SystemExit('OAuth initiation unexpectedly changed users or sessions')
          # Clean only the exact smoke-test state row after proving it was inserted correctly.
          subprocess.run(['docker','exec','-u','postgres',c,'psql','-d',db,'-v','ON_ERROR_STOP=1','-c',"DELETE FROM oauth_login_states WHERE state_hash='"+new_hash.replace("'","''")+"';"],check=True,stdout=subprocess.DEVNULL)
          final_states=set(filter(None,sql('SELECT state_hash FROM oauth_login_states ORDER BY state_hash').splitlines()))
          if final_states!=before_states:
              raise SystemExit('OAuth smoke cleanup did not restore the original state set')
          print('oauth_init_smoke|PASS')
          print('http_status|302')
          print('frontier_authorize_target|PASS')
          print('pkce_s256|PASS')
          print('secure_state_cookie|PASS')
          print('oauth_state_insert|exactly_one')
          print('oauth_state_cleanup|PASS')
          print('app_users_changed|false')
          print('web_sessions_changed|false')
          print('configured_callback_path|'+redirect.path)
          print('live_callback_path|'+live_callback)
          print('callback_matches_live_route|'+str(callback_matches_live).lower())
          PY
