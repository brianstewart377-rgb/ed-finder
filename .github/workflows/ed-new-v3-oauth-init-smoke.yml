name: ed-new V3 OAuth Init Smoke

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-v3-oauth-init-smoke-requests/*.json'

permissions:
  contents: read

jobs:
  smoke:
    name: Exercise private Frontier OAuth initiation
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-v3-oauth-init-smoke-requests/*.json) ;; *) exit 64 ;; esac
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Run controlled OAuth initiation and inspect safe metadata
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import hashlib, http.client, subprocess, urllib.parse
          c='edfinder-v3-phase4c-full-20260827_r5-postgres'
          db='edfinder_v3_phase4c_full_20260827_r5'
          state_table='v3_identity.oauth_login_state'
          account_table='v3_identity.account'
          session_table='v3_identity.session'

          def sql(q):
              cmd='PGPASSWORD="$POSTGRES_PASSWORD" exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d '+db+' -At -F "|" -c "$1"'
              return subprocess.check_output(['docker','exec','-u','postgres',c,'sh','-lc',cmd,'sh',q],text=True).strip()

          before_accounts=int(sql(f'SELECT count(*) FROM {account_table}') or '0')
          before_sessions=int(sql(f'SELECT count(*) FROM {session_table}') or '0')
          expected_hex=None
          inserted=False
          try:
              conn=http.client.HTTPConnection('127.0.0.1',58080,timeout=10)
              conn.request('GET','/api/v1/auth/frontier/login?return_to=/oauth-smoke',headers={'Host':'ed-finder.app','User-Agent':'edfinder-v3-oauth-smoke/1'})
              resp=conn.getresponse()
              resp.read()
              location=resp.getheader('Location') or ''
              cookie=resp.getheader('Set-Cookie') or ''
              conn.close()
              if resp.status!=302:
                  raise SystemExit(f'expected OAuth initiation 302, got {resp.status}')

              u=urllib.parse.urlsplit(location)
              q=urllib.parse.parse_qs(u.query,keep_blank_values=True)
              if u.scheme!='https' or u.hostname!='auth.frontierstore.net' or u.path!='/auth':
                  raise SystemExit('OAuth redirect target is not Frontier /auth over HTTPS')
              if q.get('response_type')!=['code'] or q.get('code_challenge_method')!=['S256']:
                  raise SystemExit('OAuth redirect does not use Authorization Code + S256 PKCE')
              raw_state=(q.get('state') or [''])[0]
              if not raw_state:
                  raise SystemExit('OAuth redirect state is empty')
              expected_hex=hashlib.sha256(raw_state.encode('utf-8')).hexdigest()

              redirect=urllib.parse.urlsplit((q.get('redirect_uri') or [''])[0])
              if redirect.scheme!='https' or redirect.netloc!='ed-finder.app':
                  raise SystemExit('Frontier redirect URI is not HTTPS ed-finder.app')
              if redirect.path not in {'/api/v1/auth/frontier/callback','/api/auth/frontier/callback'}:
                  raise SystemExit('Frontier redirect URI has an unexpected callback path')

              low_cookie=cookie.lower()
              for flag in ('httponly','secure','samesite=lax','path=/api'):
                  if flag not in low_cookie:
                      raise SystemExit(f'OAuth state cookie missing {flag}')

              esc=expected_hex.replace("'","''")
              row=sql(f"SELECT return_to,intent,(account_id IS NULL)::text,(expires_at > NOW())::text,length(code_verifier),octet_length(state_sha256),(created_at <= NOW())::text FROM {state_table} WHERE encode(state_sha256,'hex')='{esc}'")
              if not row:
                  raise SystemExit('OAuth initiation did not create the expected SHA-256 state row')
              inserted=True
              parts=row.split('|')
              if len(parts)!=7:
                  raise SystemExit('unexpected safe OAuth state metadata shape')
              stored_return, intent, account_null, future_expiry, verifier_len, digest_len, created_ok=parts
              print('oauth_init_reached_state_insert|PASS')
              print('http_status|302')
              print('frontier_authorize_target|PASS')
              print('pkce_s256|PASS')
              print('secure_state_cookie|PASS')
              print('configured_callback_path|'+redirect.path)
              print('stored_return_to|'+stored_return)
              print('stored_intent|'+intent)
              print('account_id_is_null|'+account_null)
              print('expires_future|'+future_expiry)
              print('verifier_length|'+verifier_len)
              print('state_digest_bytes|'+digest_len)
              print('created_not_future|'+created_ok)

              after_accounts=int(sql(f'SELECT count(*) FROM {account_table}') or '0')
              after_sessions=int(sql(f'SELECT count(*) FROM {session_table}') or '0')
              print('accounts_changed|'+str(after_accounts!=before_accounts).lower())
              print('sessions_changed|'+str(after_sessions!=before_sessions).lower())
              if after_accounts!=before_accounts or after_sessions!=before_sessions:
                  raise SystemExit('OAuth initiation unexpectedly changed accounts or sessions')
          finally:
              if expected_hex:
                  esc=expected_hex.replace("'","''")
                  sql(f"DELETE FROM {state_table} WHERE encode(state_sha256,'hex')='{esc}'")
                  remains=sql(f"SELECT count(*) FROM {state_table} WHERE encode(state_sha256,'hex')='{esc}'")
                  if remains!='0':
                      raise SystemExit('OAuth smoke cleanup failed')
                  if inserted:
                      print('oauth_state_cleanup|PASS')
          PY
