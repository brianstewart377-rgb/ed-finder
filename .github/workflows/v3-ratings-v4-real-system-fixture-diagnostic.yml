name: V3 Ratings V4 real-system fixture diagnostic

on:
  push:
    branches: [feat/ratings-v4-scorer-harness]
    paths: ['.github/workflows/v3-ratings-v4-real-system-fixture-diagnostic.yml']
  pull_request:
    branches: [decision/v3-search-spatial-derived-data]
    paths: ['.github/workflows/v3-ratings-v4-real-system-fixture-diagnostic.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Fetch 12 Spansh system dumps
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/spansh-v4"
          mkdir -p "$out"
          for id64 in \
            7780836610810 \
            5076786292249 \
            10477373803 \
            164098653 \
            1109989017963 \
            8216113749 \
            5070611621289 \
            158872029 \
            1457973727914 \
            3754967435947 \
            31639717276 \
            2037701937507
          do
            curl --fail --silent --show-error --location --retry 3 --max-time 30 \
              "https://spansh.co.uk/api/dump/${id64}" \
              --output "$out/${id64}.json"
          done
          python3 - <<'PY' "$out"
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = sorted(root.glob('*.json'))
          assert len(files) == 12
          for path in files:
              payload = json.loads(path.read_text())
              assert isinstance(payload, dict)
          print(f'fetched {len(files)} Spansh system dumps')
          PY

      - name: Upload Spansh fixtures
        uses: actions/upload-artifact@v4
        with:
          name: ratings-v4-spansh-system-dumps
          path: ${{ runner.temp }}/spansh-v4/*.json
          if-no-files-found: error
          retention-days: 1
