name: V3 Ratings V4 real-system fixture diagnostic

on:
  push:
    branches: [feat/ratings-v4-scorer-harness]
    paths: ['.github/workflows/v3-ratings-v4-real-system-fixture-diagnostic.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: ed-new-operator
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          lookup="$SSH_HOST"; [ "$SSH_PORT" = "22" ] || lookup="[$SSH_HOST]:$SSH_PORT"
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null

      - name: Export 12-system V4 fixture facts read-only
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json, socket, subprocess

          PG='edfinder-v3-phase4c-full-20260827_r5-postgres'
          DB='edfinder_v3_phase4c_full_20260827_r5'
          USER='edfinder_v3'
          E={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','LANG':'C','LC_ALL':'C'}
          fqdn=subprocess.run(['hostname','-f'],text=True,capture_output=True,env=E,check=False,timeout=5).stdout.strip()
          assert socket.gethostname().split('.')[0]=='ed-finder-prod' and fqdn=='nb79a3d.mevnode.com'

          names = [
            'Wregoe ZN-X c28-28',
            'Praea Euq WV-W b2-2',
            'Sol',
            'Achenar',
            'Alioth',
            'Maia',
            'Borann',
            'HD 38179',
            'Col 285 Sector BW-U c3-5',
            'Smojoo ZE-R d4-109',
            'Thaile HW-V e2-7',
            'Deriv-Dar',
          ]
          names_sql = ','.join("'%s'" % n.replace("'", "''") for n in names)

          def psql(sql):
              argv=['docker','--context','default','exec',PG,'psql','-X','--no-password','--tuples-only','--no-align','--quiet','--set','ON_ERROR_STOP=1','--username',USER,'--dbname',DB,'--command',sql]
              p=subprocess.run(argv,text=True,capture_output=True,env=E,check=True,timeout=60)
              return [line.strip() for line in p.stdout.splitlines() if line.strip()]

          schema_rows = psql("""BEGIN READ ONLY; SET LOCAL statement_timeout='10000ms';
            SELECT cg.relation_schema
            FROM v3_meta.current_canonical_generation ccg
            JOIN v3_meta.canonical_generation cg USING (generation_id)
            WHERE ccg.singleton IS TRUE; COMMIT;""")
          assert len(schema_rows)==1
          schema=schema_rows[0]
          assert schema.startswith('v3_gen_')

          systems_sql=f"""BEGIN READ ONLY; SET LOCAL statement_timeout='15000ms';
            SELECT json_build_object('kind','systems','rows',COALESCE(json_agg(to_jsonb(s) ORDER BY s.name),'[]'::json))::text
            FROM {schema}.systems s WHERE s.name IN ({names_sql}); COMMIT;"""
          systems=json.loads(next(line for line in psql(systems_sql) if line.startswith('{')))
          ids=[str(row['id64']) for row in systems['rows']]
          assert ids, 'none of the 12 systems found'
          ids_sql=','.join(ids)

          bodies_sql=f"""BEGIN READ ONLY; SET LOCAL statement_timeout='20000ms';
            SELECT json_build_object('kind','bodies','rows',COALESCE(json_agg(to_jsonb(b) ORDER BY b.system_id64,b.body_pk),'[]'::json))::text
            FROM {schema}.bodies b WHERE b.system_id64 IN ({ids_sql}); COMMIT;"""
          bodies=json.loads(next(line for line in psql(bodies_sql) if line.startswith('{')))

          relation_sql=f"""BEGIN READ ONLY; SET LOCAL statement_timeout='10000ms';
            SELECT json_build_object('kind','relations','rows',COALESCE(json_agg(json_build_object('schema',n.nspname,'relation',c.relname) ORDER BY n.nspname,c.relname),'[]'::json))::text
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE c.relkind IN ('r','v','m') AND (
              (n.nspname='{schema}' AND (c.relname ILIKE '%body%' OR c.relname ILIKE '%ring%' OR c.relname ILIKE '%signal%' OR c.relname ILIKE '%reserve%'))
              OR (n.nspname='v3_vocab' AND (c.relname ILIKE '%body%' OR c.relname ILIKE '%volcan%' OR c.relname ILIKE '%terraform%' OR c.relname ILIKE '%reserve%'))
            ); COMMIT;"""
          relations=json.loads(next(line for line in psql(relation_sql) if line.startswith('{')))

          # Export small vocab relations completely and generation relations only when they expose system/body keys.
          extras=[]
          for item in relations['rows']:
              sch=item['schema']; rel=item['relation']
              qrel='"%s"."%s"' % (sch.replace('"','""'), rel.replace('"','""'))
              cols_sql=f"""BEGIN READ ONLY; SET LOCAL statement_timeout='5000ms';
                SELECT column_name FROM information_schema.columns WHERE table_schema='{sch}' AND table_name='{rel}' ORDER BY ordinal_position; COMMIT;"""
              cols=psql(cols_sql)
              try:
                  if sch=='v3_vocab':
                      rows_sql=f"""BEGIN READ ONLY; SET LOCAL statement_timeout='8000ms';
                        SELECT json_build_object('schema','{sch}','relation','{rel}','rows',COALESCE(json_agg(to_jsonb(x)),'[]'::json))::text FROM {qrel} x; COMMIT;"""
                  elif 'system_id64' in cols:
                      rows_sql=f"""BEGIN READ ONLY; SET LOCAL statement_timeout='12000ms';
                        SELECT json_build_object('schema','{sch}','relation','{rel}','rows',COALESCE(json_agg(to_jsonb(x)),'[]'::json))::text FROM {qrel} x WHERE x.system_id64 IN ({ids_sql}); COMMIT;"""
                  elif 'body_pk' in cols:
                      body_pks=[str(row['body_pk']) for row in bodies['rows']]
                      if not body_pks:
                          continue
                      rows_sql=f"""BEGIN READ ONLY; SET LOCAL statement_timeout='12000ms';
                        SELECT json_build_object('schema','{sch}','relation','{rel}','rows',COALESCE(json_agg(to_jsonb(x)),'[]'::json))::text FROM {qrel} x WHERE x.body_pk IN ({','.join(body_pks)}); COMMIT;"""
                  else:
                      continue
                  payload=next((line for line in psql(rows_sql) if line.startswith('{')),None)
                  if payload:
                      extras.append(json.loads(payload))
              except Exception as exc:
                  extras.append({'schema':sch,'relation':rel,'export_error':type(exc).__name__})

          result={
            'status':'success','read_only':True,'db_writes_performed':False,'migrations_performed':False,'service_changes_performed':False,
            'canonical_schema':schema,'requested_systems':names,'systems':systems['rows'],'bodies':bodies['rows'],'relations':relations['rows'],'extras':extras,
          }
          print(json.dumps(result,sort_keys=True,separators=(',',':')))
          PY
