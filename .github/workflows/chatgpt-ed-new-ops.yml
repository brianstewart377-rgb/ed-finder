name: ChatGPT ed-new Ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted ed-new operation"
        required: true
        type: choice
        options:
          - host-status
          - octopus-edge-status
          - recover-v3-runtime-contract
          - octopus-qdrant-healthcheck-repair
          - v3-app-status
          - ratings-v4-generation-start
          - ratings-v4-generation-status
          - v3-system-search-f1-start
          - v3-system-search-f1-status
          - v3-system-search-f1-finalize
          - v3-system-archetype-start
          - v3-system-archetype-status
          - v3-system-archetype-finalize
          - v3-spatial-status
          - v3-derived-lifecycle-status
          - v3-derived-purge-plan
          - v3-derived-purge-status
          - v3-disk-inventory
          - v3-host-storage-detail
          - v3-host-cleanup
          - v3-backup-wrapper-install
          - v3-system-search-validate-constraints-start
          - v3-system-search-validate-constraints-status
          - v3-archetype-calibration-probe
          - v3-archetype-calibration-complete-start
          - v3-archetype-calibration-complete-status
          - v3-finder-capacity-gate
          - v3-archetype-plan-probe
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-ops-requests/*.json'

permissions:
  contents: read

concurrency:
  group: chatgpt-ed-new-ops
  cancel-in-progress: false

jobs:
  execute:
    name: Run allowlisted ed-new operation
    runs-on: ubuntu-latest
    environment: ed-new-operator
    # Archetype build finalization runs validation (bounded at 120 minutes) and
    # then the receipted VACUUM (ANALYZE) (bounded at 120 minutes) in sequence;
    # its step allows 250 minutes, and this job keeps a margin around that.
    timeout-minutes: 270
    steps:
      - name: Checkout request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Set up CPython 3.14 for operator request validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          INPUT_OPERATION: ${{ inputs.operation }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            operation="$INPUT_OPERATION"
          elif [ "$EVENT_NAME" = "push" ]; then
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
            [ "${#changed_files[@]}" -eq 1 ] || { echo "Expected exactly one changed ed-new request file" >&2; exit 64; }
            case "${changed_files[0]}" in
              .github/ed-new-ops-requests/*.json) ;;
              *) echo "Push changed a path outside the request allowlist" >&2; exit 64 ;;
            esac
            request_files=("${changed_files[0]}")
            operation="$(python -c 'import json,pathlib,sys; d=json.loads(pathlib.Path(sys.argv[1]).read_text()); extra=set(d)-{"operation"}; extra and sys.exit(f"Unsupported request keys: {sorted(extra)}"); op=d.get("operation"); (isinstance(op,str) and op) or sys.exit("operation must be a non-empty string"); print(op)' "${request_files[0]}")"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 64
          fi
          case "$operation" in
            host-status|octopus-edge-status|recover-v3-runtime-contract|octopus-qdrant-healthcheck-repair|v3-app-status|ratings-v4-generation-start|ratings-v4-generation-status|v3-system-search-f1-start|v3-system-search-f1-status|v3-system-search-f1-finalize|v3-system-archetype-start|v3-system-archetype-status|v3-system-archetype-finalize|v3-spatial-status|v3-system-search-validate-constraints-start|v3-system-search-validate-constraints-status|v3-archetype-calibration-probe|v3-archetype-calibration-complete-start|v3-archetype-calibration-complete-status|v3-finder-capacity-gate|v3-archetype-plan-probe|v3-derived-lifecycle-status) ;;
            v3-derived-purge-plan|v3-derived-purge-status) ;;
            v3-disk-inventory) ;;
            v3-host-storage-detail) ;;
            v3-host-cleanup)
              [ "$EVENT_NAME" = workflow_dispatch ] && [ "$CURRENT_REF" = refs/heads/main ] || {
                echo "V3 host clean-up requires a manual dispatch on main" >&2; exit 64;
              }
              ;;
            v3-backup-wrapper-install) ;;
            *) echo "Unsupported operation: $operation" >&2; exit 64 ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted operator implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted-main
          persist-credentials: false

      - name: Prepare trusted purge-fenced streamed actions
        if: contains(fromJSON('["v3-backup-wrapper-install", "octopus-qdrant-healthcheck-repair", "v3-system-search-validate-constraints-start"]'), steps.request.outputs.operation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-purge-fenced-actions"
          for action in v3-backup-wrapper-install octopus-qdrant-healthcheck-repair v3-system-search-validate-constraints; do
            {
              printf "v3_purge_state_check() {\n python3.14 -I -S - <<'V3_PURGE_PYTHON'\n"
              cat trusted-main/scripts/operator/lib/v3_purge_state.py
              printf '\nV3_PURGE_PYTHON\n}\n'
              cat trusted-main/scripts/operator/lib/v3-purge-state.sh
              cat "trusted-main/scripts/operator/actions/$action.sh"
            } > "$RUNNER_TEMP/v3-purge-fenced-actions/$action.sh"
          done

      - name: Read accepted F2d operator-code attestation
        id: f2d-identity
        if: contains(fromJSON('["v3-archetype-calibration-complete-start", "v3-archetype-calibration-complete-status", "v3-finder-capacity-gate", "v3-archetype-plan-probe", "v3-system-search-f1-start", "v3-system-search-f1-status", "v3-system-search-f1-finalize", "v3-system-archetype-start", "v3-system-archetype-status", "v3-system-archetype-finalize"]'), steps.request.outputs.operation)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os, pathlib, re
          authority = json.loads(pathlib.Path("trusted-main/deploy/v3-production/target-authority.json").read_text())
          compatibility = authority.get("accepted_release_schema_compatibility", {})
          identity = compatibility.get("f2d_operator_code_sha256") if isinstance(compatibility, dict) else None
          if not isinstance(identity, str) or not re.fullmatch(r"[0-9a-f]{64}", identity):
              raise SystemExit("Accepted release has no valid F2d operator-code attestation")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("f2d_operator_code_sha256_attested=" + identity, file=output)
          PYTHON

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing ED_NEW_OPERATOR_SSH_KEY" >&2; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing ED_NEW_OPERATOR_HOST" >&2; exit 1; }
          test -n "$SSH_PORT" || { echo "Missing ED_NEW_OPERATOR_PORT" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing pinned ed-new known-hosts secret" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key
          chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Foreground actions (the calibration probe, the plan probe) stream
          # nothing until their final receipt. A ~300 s NAT/proxy idle timeout
          # reaps a silent channel (probe run 39151827257: exit 255 after
          # 5m32s with an empty receipt; same failure as the spatial pyramid
          # build). Keep every operator channel warm; ~10 min of silence from
          # a busy host is tolerated before the peer is declared dead.
          printf '%s\n' 'Host *' '  ServerAliveInterval 30' '  ServerAliveCountMax 20' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          if [ "$SSH_PORT" = "22" ]; then
            known_host_lookup="$SSH_HOST"
          else
            known_host_lookup="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host_lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo "Pinned known-host trust does not cover the configured host and port" >&2
            exit 1
          }

      - name: Run bounded ed-new bootstrap status
        if: steps.request.outputs.operation == 'host-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'set -eu; echo "== ed-new bootstrap status =="; printf "hostname: "; hostname; printf "fqdn: "; hostname -f 2>/dev/null || true; printf "kernel: "; uname -sr; echo "== filesystem =="; df -hT /; echo "== docker =="; if command -v docker >/dev/null 2>&1; then docker ps --format "{{.Names}}\t{{.Status}}\t{{.Image}}" | head -50; else echo "docker: not installed"; fi; echo "== repo candidates =="; for p in /opt/ed-finder /root/ed-finder /srv/ed-finder; do [ -d "$p" ] && echo "$p"; done; echo "== safety =="; echo "db_access_performed: false"; echo "db_writes_performed: false"; echo "migrations_performed: false"; echo "canonical_apply_performed: false"'

      - name: Inspect V3 app status
        if: steps.request.outputs.operation == 'v3-app-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/v3-app-status.sh

      - name: Inspect V3 spatial status
        if: steps.request.outputs.operation == 'v3-spatial-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/v3-spatial-status.sh

      - name: Inspect V3 derived lifecycle status
        if: steps.request.outputs.operation == 'v3-derived-lifecycle-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/v3-derived-lifecycle-status.sh \
            | tee "$RUNNER_TEMP/v3-derived-lifecycle-status.json"

      - name: Annotate V3 derived lifecycle status
        if: always() && steps.request.outputs.operation == 'v3-derived-lifecycle-status'
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/v3-derived-lifecycle-status.json
        run: |
          python3 -I -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import re

          PREFIX = "::notice title=Derived lifecycle status::"

          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def text(value):
              # Only operational identifiers/timestamps, never nested objects,
              # URLs, environment assignments or free-form diagnostic text.
              if not isinstance(value, str):
                  return "unknown"
              if (not re.fullmatch(r"[A-Za-z0-9_.:%+ \r\n-]+", value)
                      or re.search(r"password|secret|token|credential|dsn|gh[pousr]_|github_pat_|AKIA|sk-", value, re.I)):
                  return "[redacted]"
              return value[:180] + ("[field truncated]" if len(value) > 180 else "")

          def flag(value):
              return json.dumps(value) if isinstance(value, bool) else "unknown"

          def number(value):
              return str(value) if type(value) is int and -(2 ** 63) <= value < 2 ** 63 else "unknown"

          def mapping(value):
              return value if isinstance(value, dict) else {}

          def rows(value):
              return value if isinstance(value, list) else []

          def emit(label, entries, pages=1):
              # The fixed page budgets below total eight. Pack escaped rows;
              # reserve room for a truthful omission disclosure on the last page.
              entries = list(entries) or ["(none or unavailable)"]
              index = 0
              for page in range(pages):
                  message = f"{label} ({page + 1}):"
                  while index < len(entries):
                      candidate = message + "\n" + entries[index]
                      if len(PREFIX) + len(escape(candidate)) > 3700:
                          break
                      message = candidate
                      index += 1
                  if index < len(entries) and page == pages - 1:
                      message += f"\n[truncated: {len(entries) - index} more entries; full receipt in artifact]"
                  print(PREFIX + escape(message))
                  if index == len(entries):
                      break

          try:
              receipt = json.loads(Path(os.environ["RECEIPT"]).read_text())
              if not isinstance(receipt, dict):
                  raise ValueError("invalid receipt")
          except (OSError, ValueError, RecursionError):
              emit("Result", ["status=stopped", "failures=receipt unavailable or invalid"])
              raise SystemExit(0)

          failures = rows(receipt.get("failures"))
          emit("Result", [
              "status=" + text(receipt.get("status")),
              "all_named_workers_stopped=" + flag(receipt.get("all_named_workers_stopped")),
              "failures=" + ("[]" if not failures else ""),
              *(text(value) for value in failures[:8]),
              *([f"[truncated: {len(failures) - 8} more failures]"] if len(failures) > 8 else []),
          ])
          emit("Workers", (
              "name=" + text(worker.get("name")) + "; " + "; ".join(
                  key + "=" + formatter(worker.get(key))
                  for key, formatter in (("running", flag), ("exists", flag), ("status", text), ("exit_code", number))
              )
              for worker in rows(receipt.get("workers")) if isinstance(worker, dict)
          ))
          preconditions = mapping(receipt.get("migration_apply_preconditions"))
          migrations = mapping(receipt.get("finder_migrations_applied"))
          products = mapping(receipt.get("finder_products_on_published_generation"))
          emit("Migration and Finder gates", [
              "migration_apply_preconditions: " + "; ".join(
                  key + "=" + flag(preconditions.get(key)) for key in (
                      "all_named_workers_stopped", "current_pointers_recorded", "inspection_complete", "ready_for_governed_plan"
                  )
              ),
              "finder_migrations_applied:",
              *(text(key) + "=" + flag(value) for key, value in migrations.items()),
              "finder_products_on_published_generation: " + "; ".join(
                  key + "=" + text(products.get(key)) for key in ("system_search", "system_archetype")
              ),
          ])
          emit("Derived generations", (
              "generation_key=" + text(row.get("generation_key")) + "; lifecycle_state=" + text(row.get("lifecycle_state"))
              for row in rows(receipt.get("derived_generations")) if isinstance(row, dict)
          ), pages=2)
          emit("derived_products", (
              "; ".join(key + "=" + text(row.get(key)) for key in ("generation_key", "product_code", "lifecycle_state"))
              for row in rows(receipt.get("derived_products")) if isinstance(row, dict)
          ), pages=2)
          disk = mapping(mapping(receipt.get("footprint")).get("host_disk"))
          wal = mapping(mapping(receipt.get("postgres")).get("wal"))
          disk_rows = []
          for key in ("avail_bytes", "size_bytes"):
              value = disk.get(key)
              size = number(value)
              if size != "unknown" and value >= 0:
                  size += f" ({value / (1024 ** 3):.2f} GiB)"
              disk_rows.append("footprint.host_disk." + key + "=" + size)
          emit("Disk and WAL", disk_rows + [
              "postgres.wal." + key + "=" + formatter(wal.get(key))
              for key, formatter in (("archive_mode", text), ("failed_count", number), ("last_archived_time", text), ("last_failed_time", text))
          ])
          PYTHON

      - name: Upload V3 derived lifecycle status receipt
        if: always() && steps.request.outputs.operation == 'v3-derived-lifecycle-status'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v3-derived-lifecycle-status-receipt
          path: ${{ runner.temp }}/v3-derived-lifecycle-status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up fixed V3 host leftovers
        if: steps.request.outputs.operation == 'v3-host-cleanup'
        timeout-minutes: 31
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECEIPT: ${{ runner.temp }}/v3-host-cleanup-receipt.json
        run: |
          set -euo pipefail
          # ED_NEW_OPERATOR_HOST may hold the production FQDN or one of the
          # addresses that FQDN currently resolves to; pinned known-host trust
          # and the action's own hostname/FQDN check still identify the host.
          if [ "$SSH_HOST" != nb79a3d.mevnode.com ] && ! {
              [[ "$SSH_HOST" =~ ^[0-9A-Fa-f:.]{2,45}$ ]] &&
              getent ahosts nb79a3d.mevnode.com | awk '{print $1}' | grep -Fxq -- "$SSH_HOST"
            }; then
            echo "ED_NEW_OPERATOR_HOST is neither the production FQDN nor one of its current addresses" >&2
            exit 64
          fi
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535)) || { echo "ED_NEW_OPERATOR_PORT is not a valid port" >&2; exit 64; }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "ED_NEW_OPERATOR_USER is not a valid user name" >&2; exit 64; }
          # Only reviewed main supplies authority; no request can supply a path.
          authority_b64="$(base64 -w0 trusted-main/deploy/v3-production/target-authority.json)"
          [[ "$authority_b64" =~ ^[A-Za-z0-9+/=]+$ ]] || exit 64
          remote="if [ \"\$(id -u)\" -eq 0 ]; then exec bash -s -- '$authority_b64'; elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then exec sudo -n bash -s -- '$authority_b64'; else echo 'V3 host clean-up requires root or passwordless sudo' >&2; exit 64; fi"
          # Keep SSH attached so the chatgpt-ed-new-ops fence (shared with the
          # derived purge job) stays held until the remote action exits.
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=30 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" "$remote" \
            < trusted-main/scripts/operator/actions/v3-host-cleanup.sh > "$RECEIPT"

      - name: Annotate V3 host clean-up receipt
        if: always() && steps.request.outputs.operation == 'v3-host-cleanup'
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/v3-host-cleanup-receipt.json
        run: |
          python -I -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          def summary_notice(receipt):
              parts = ["status=" + str(receipt.get("status", "stopped"))]
              for item in receipt.get("paths", []):
                  part = str(item.get("path", "unknown")) + ": " + str(item.get("outcome", "refused"))
                  if item.get("reason"):
                      part += " (" + str(item["reason"]) + ")"
                  part += "; estimated bytes removed=" + str(item.get("bytes_removed_estimate"))
                  parts.append(part)
              if not receipt.get("paths") and receipt.get("failures"):
                  parts.append("failures=" + ",".join(str(reason) for reason in receipt["failures"]))
              parts.append("filesystem space reclaimed=" + str(receipt.get("filesystem_bytes_reclaimed")))
              text = " | ".join(parts)
              # Escape GitHub command data and bound the entire annotation below
              # 4000 characters. Escape before truncating to avoid expansion over it.
              escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              prefix = "::notice title=Host clean-up::"
              return prefix + escaped[:3900]

          try:
              receipt = json.loads(Path(os.environ["RECEIPT"]).read_text())
              if not isinstance(receipt, dict) or not isinstance(receipt.get("paths"), list):
                  raise ValueError("invalid receipt")
          except (OSError, ValueError):
              receipt = {"status": "stopped; receipt unavailable or invalid", "paths": [], "filesystem_bytes_reclaimed": None}
          print(summary_notice(receipt))
          PYTHON

      - name: Upload V3 host clean-up receipt
        if: always() && steps.request.outputs.operation == 'v3-host-cleanup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v3-host-cleanup-receipt
          path: ${{ runner.temp }}/v3-host-cleanup-receipt.json
          if-no-files-found: error
          retention-days: 180

      - name: Inspect V3 disk inventory
        if: steps.request.outputs.operation == 'v3-disk-inventory'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECEIPT: ${{ runner.temp }}/v3-disk-inventory-receipt.json
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          # The inventory scans the whole filesystem that holds PGDATA, which includes
          # root-owned mode-0700 paths such as /var/lib/ed-finder/v3-production/receipts.
          # As the non-root operator account, `du` returns nonzero on those and the
          # action fails closed on permission errors by design -- so without the same
          # root/passwordless-sudo handoff the other privileged steps use, the governed
          # inventory could never produce a receipt. Elevation is the right fix rather
          # than tolerating the errors: a scan that silently skips part of the tree
          # would report totals it had not measured.
