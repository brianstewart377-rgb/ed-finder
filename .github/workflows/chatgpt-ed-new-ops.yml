      - name: Annotate V3 Search constraint validation
        if: always() && (steps.request.outputs.operation == 'v3-system-search-validate-constraints-start' || steps.request.outputs.operation == 'v3-system-search-validate-constraints-status')
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/v3-system-search-validate-constraints-operation.txt
        run: |
          python3 -I -B - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          PREFIX = "::notice title=Search constraint validation::"

          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def text(value):
              # Identifiers, states and durations only; never SQL, paths or free text.
              if isinstance(value, bool) or value is None:
                  return json.dumps(value)
              if type(value) is int:
                  return str(value)
              if not isinstance(value, str) or not re.fullmatch(r"[A-Za-z0-9_.:+ -]{1,120}", value):
                  return "[redacted]"
              return value

          receipt = None
          try:
              lines = [line for line in Path(os.environ["RECEIPT"]).read_text().splitlines() if line.strip()]
              receipt = json.loads(lines[-1]) if lines else None
          except (OSError, ValueError, RecursionError):
              receipt = None
          if not isinstance(receipt, dict):
              print(PREFIX + escape("status=stopped; receipt unavailable or invalid"))
              raise SystemExit(0)
          parts = ["status=" + text(receipt.get("status"))]
          failures = receipt.get("failures") if isinstance(receipt.get("failures"), list) else []
          parts.append("failures=" + (",".join(text(f) for f in failures[:10]) or "[]"))
          # Start and status receipts carry different fields; report each as named.
          for key in ("operation", "result", "migration_010_verified", "migration_010_in_ledger",
