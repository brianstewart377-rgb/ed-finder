name: ChatGPT ed-new Ops
run-name: ed-new ${{ inputs.operation }} · ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [host-status, recover-v3-runtime-contract]
      request_id:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: chatgpt-ed-new-ops
  cancel-in-progress: false

jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in SSH_KEY SSH_HOST SSH_PORT SSH_KNOWN_HOSTS; do [ -n "${!value}" ] || { echo "Missing $value" >&2; exit 1; }; done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key && chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null || { echo "Pinned known-host trust mismatch" >&2; exit 1; }
      - name: Run bounded host status
        if: inputs.operation == 'host-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'set -eu; echo "== ed-new bootstrap status =="; hostname; hostname -f 2>/dev/null || true; uname -sr; df -hT /; if command -v docker >/dev/null 2>&1; then out=$(docker ps --format "{{.Names}}\t{{.Status}}\t{{.Image}}") || exit; printf "%s\n" "$out" | head -50; else echo "docker: not installed"; fi; echo "db_access_performed: false"; echo "host_mutation_performed: false"'
      - name: Recover retained V3 runtime contract
        if: inputs.operation == 'recover-v3-runtime-contract'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECOVERY_DIR: ${{ runner.temp }}/edfinder-v3-runtime-recovery
          TRUSTED_COMMIT: ${{ github.sha }}
          TRUSTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" && mkdir -p "$RECOVERY_DIR"
          archive="$RECOVERY_DIR/edfinder-v3-phase4c-r5-runtime-contract.tar.gz"
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            "python3 - --container edfinder-v3-phase4c-full-20260827_r5-postgres --target-host-identity '$SSH_HOST' --trusted-commit '$TRUSTED_COMMIT' --trusted-ref '$TRUSTED_REF'" \
            < scripts/operator/recover_v3_runtime_contract.py > "$archive"
          test -s "$archive"
          (cd "$RECOVERY_DIR" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          python3 - "$archive" <<'PY'
          import pathlib, shutil, sys, tarfile
          archive = pathlib.Path(sys.argv[1])
          with tarfile.open(archive, "r:gz") as bundle:
              members = {m.name: m for m in bundle.getmembers()}
              for name in ("recovery-manifest.json", "recovery-receipt.json"):
                  member = members.get(name)
                  if member is None or not member.isfile(): raise SystemExit(f"Missing metadata: {name}")
                  source = bundle.extractfile(member)
                  if source is None: raise SystemExit(f"Unreadable metadata: {name}")
                  with source, (archive.parent / name).open("wb") as target: shutil.copyfileobj(source, target)
          PY
      - name: Upload retained V3 runtime recovery
        if: inputs.operation == 'recover-v3-runtime-contract'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edfinder-v3-phase4c-r5-runtime-contract
          path: |
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz.sha256
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/recovery-manifest.json
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/recovery-receipt.json
          if-no-files-found: error
          retention-days: 14
