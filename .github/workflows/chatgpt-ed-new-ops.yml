name: ChatGPT ed-new Ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted ed-new operation"
        required: true
        type: choice
        options:
          - host-status
          - octopus-edge-status
          - recover-v3-runtime-contract
          - octopus-qdrant-healthcheck-repair
          - v3-app-status
          - ratings-v4-generation-start
          - ratings-v4-generation-status
          - v3-system-search-f1-start
          - v3-system-search-f1-status
          - v3-system-search-f1-finalize
          - v3-system-archetype-start
          - v3-system-archetype-status
          - v3-system-archetype-finalize
          - v3-spatial-status
          - v3-derived-lifecycle-status
          - v3-disk-inventory
          - v3-system-search-validate-constraints-start
          - v3-system-search-validate-constraints-status
          - v3-archetype-calibration-probe
          - v3-archetype-calibration-complete-start
          - v3-archetype-calibration-complete-status
          - v3-finder-capacity-gate
          - v3-archetype-plan-probe
      f2d_operator_code_sha256_attested:
        description: "Attested F2d operator-code SHA-256 (F2d governed actions only)"
        required: false
        type: string
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-ops-requests/*.json'

permissions:
  contents: read

concurrency:
  group: chatgpt-ed-new-ops
  cancel-in-progress: false

jobs:
  execute:
    name: Run allowlisted ed-new operation
    runs-on: ubuntu-latest
    environment: ed-new-operator
    # Build finalization permits the receipted VACUUM (ANALYZE) up to 120 minutes.
    timeout-minutes: 150
    steps:
      - name: Checkout request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Set up CPython 3.14 for operator request validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_F2D_OPERATOR_CODE_SHA256_ATTESTED: ${{ inputs.f2d_operator_code_sha256_attested }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            operation="$INPUT_OPERATION"
          elif [ "$EVENT_NAME" = "push" ]; then
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
            [ "${#changed_files[@]}" -eq 1 ] || { echo "Expected exactly one changed ed-new request file" >&2; exit 64; }
            case "${changed_files[0]}" in
              .github/ed-new-ops-requests/*.json) ;;
              *) echo "Push changed a path outside the request allowlist" >&2; exit 64 ;;
            esac
            request_files=("${changed_files[0]}")
            operation="$(python -c 'import json,pathlib,sys; d=json.loads(pathlib.Path(sys.argv[1]).read_text()); extra=set(d)-{"operation"}; extra and sys.exit(f"Unsupported request keys: {sorted(extra)}"); op=d.get("operation"); (isinstance(op,str) and op) or sys.exit("operation must be a non-empty string"); print(op)' "${request_files[0]}")"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 64
          fi
          case "$operation" in
            host-status|octopus-edge-status|recover-v3-runtime-contract|octopus-qdrant-healthcheck-repair|v3-app-status|ratings-v4-generation-start|ratings-v4-generation-status|v3-system-search-f1-start|v3-system-search-f1-status|v3-system-search-f1-finalize|v3-system-archetype-start|v3-system-archetype-status|v3-system-archetype-finalize|v3-spatial-status|v3-system-search-validate-constraints-start|v3-system-search-validate-constraints-status|v3-archetype-calibration-probe|v3-archetype-calibration-complete-start|v3-archetype-calibration-complete-status|v3-finder-capacity-gate|v3-archetype-plan-probe|v3-derived-lifecycle-status) ;;
            v3-disk-inventory) ;;
            *) echo "Unsupported operation: $operation" >&2; exit 64 ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          case "$operation" in
            v3-finder-capacity-gate|v3-archetype-plan-probe|v3-system-search-f1-start|v3-system-search-f1-status|v3-system-search-f1-finalize|v3-system-archetype-start|v3-system-archetype-status|v3-system-archetype-finalize)
              [[ "$INPUT_F2D_OPERATOR_CODE_SHA256_ATTESTED" =~ ^[0-9a-f]{64}$ ]] || {
                echo "F2d operator-code attestation must be exactly 64 lowercase hexadecimal characters" >&2
                exit 64
              }
              echo "f2d_operator_code_sha256_attested=$INPUT_F2D_OPERATOR_CODE_SHA256_ATTESTED" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ -n "$INPUT_F2D_OPERATOR_CODE_SHA256_ATTESTED" ]; then
                echo "F2d operator-code attestation input is accepted only for F2d governed actions" >&2
                exit 64
              fi
              ;;
          esac

      - name: Checkout trusted operator implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted-main
          persist-credentials: false

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing ED_NEW_OPERATOR_SSH_KEY" >&2; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing ED_NEW_OPERATOR_HOST" >&2; exit 1; }
          test -n "$SSH_PORT" || { echo "Missing ED_NEW_OPERATOR_PORT" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing pinned ed-new known-hosts secret" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key
          chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = "22" ]; then
            known_host_lookup="$SSH_HOST"
          else
            known_host_lookup="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host_lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo "Pinned known-host trust does not cover the configured host and port" >&2
            exit 1
          }

      - name: Run bounded ed-new bootstrap status
        if: steps.request.outputs.operation == 'host-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'set -eu; echo "== ed-new bootstrap status =="; printf "hostname: "; hostname; printf "fqdn: "; hostname -f 2>/dev/null || true; printf "kernel: "; uname -sr; echo "== filesystem =="; df -hT /; echo "== docker =="; if command -v docker >/dev/null 2>&1; then docker ps --format "{{.Names}}\t{{.Status}}\t{{.Image}}" | head -50; else echo "docker: not installed"; fi; echo "== repo candidates =="; for p in /opt/ed-finder /root/ed-finder /srv/ed-finder; do [ -d "$p" ] && echo "$p"; done; echo "== safety =="; echo "db_access_performed: false"; echo "db_writes_performed: false"; echo "migrations_performed: false"; echo "canonical_apply_performed: false"'

      - name: Inspect V3 app status
        if: steps.request.outputs.operation == 'v3-app-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/v3-app-status.sh

      - name: Inspect V3 spatial status
        if: steps.request.outputs.operation == 'v3-spatial-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/v3-spatial-status.sh

      - name: Inspect V3 derived lifecycle status
        if: steps.request.outputs.operation == 'v3-derived-lifecycle-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/v3-derived-lifecycle-status.sh

      - name: Inspect V3 disk inventory
        if: steps.request.outputs.operation == 'v3-disk-inventory'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECEIPT: ${{ runner.temp }}/v3-disk-inventory-receipt.json
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          # The inventory scans the whole filesystem that holds PGDATA, which includes
          # root-owned mode-0700 paths such as /var/lib/ed-finder/v3-production/receipts.
          # As the non-root operator account, `du` returns nonzero on those and the
          # action fails closed on permission errors by design -- so without the same
          # root/passwordless-sudo handoff the other privileged steps use, the governed
          # inventory could never produce a receipt. Elevation is the right fix rather
          # than tolerating the errors: a scan that silently skips part of the tree
          # would report totals it had not measured.
          remote="if [ \"\$(id -u)\" -eq 0 ]; then exec bash -s; elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then exec sudo -n bash -s; else echo 'V3 disk inventory requires root or passwordless sudo to scan the whole filesystem that holds PGDATA' >&2; exit 64; fi"
          # The receipt is one JSON line that can run to hundreds of kilobytes (index
          # definitions alone allow ~400 KB), and the runner can take minutes to process a
          # line that long -- long enough to push the job past its timeout after the
          # action's own deadline check. So the full receipt goes to a file that is
          # uploaded below, and the log carries only its first 4 KB.
          status=0
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            "cd /opt/ed-finder && $remote" < trusted-main/scripts/operator/actions/v3-disk-inventory.sh > "$RECEIPT" || status=$?
          head -c 4096 "$RECEIPT"
          printf '\n[receipt: %s bytes in the v3-disk-inventory-receipt artifact]\n' "$(wc -c < "$RECEIPT")"
          exit "$status"

      - name: Upload V3 disk inventory receipt
        if: always() && steps.request.outputs.operation == 'v3-disk-inventory'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-disk-inventory-receipt
          path: ${{ runner.temp }}/v3-disk-inventory-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Launch V3 Search constraint validation
        if: steps.request.outputs.operation == 'v3-system-search-validate-constraints-start'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECEIPT: ${{ runner.temp }}/v3-system-search-validate-constraints-operation.txt
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s -- start' < trusted-main/scripts/operator/actions/v3-system-search-validate-constraints.sh | tee "$RECEIPT"

      - name: Inspect V3 Search constraint validation status
        if: steps.request.outputs.operation == 'v3-system-search-validate-constraints-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECEIPT: ${{ runner.temp }}/v3-system-search-validate-constraints-operation.txt
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s -- status' < trusted-main/scripts/operator/actions/v3-system-search-validate-constraints.sh | tee "$RECEIPT"

      - name: Upload V3 Search constraint validation receipt
        if: always() && (steps.request.outputs.operation == 'v3-system-search-validate-constraints-start' || steps.request.outputs.operation == 'v3-system-search-validate-constraints-status')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-system-search-validate-constraints-operation
          path: ${{ runner.temp }}/v3-system-search-validate-constraints-operation.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Repair Octopus Qdrant healthcheck and boot web
        if: steps.request.outputs.operation == 'octopus-qdrant-healthcheck-repair'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/octopus-qdrant-healthcheck-repair.sh

      - name: Inspect Octopus edge status
        if: steps.request.outputs.operation == 'octopus-edge-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'cd /opt/ed-finder && bash -s' < trusted-main/scripts/operator/actions/octopus-edge-status.sh

      - name: Recover retained V3 runtime contract
        if: steps.request.outputs.operation == 'recover-v3-runtime-contract'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECOVERY_DIR: ${{ runner.temp }}/edfinder-v3-runtime-recovery
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          mkdir -p "$RECOVERY_DIR"
          archive="$RECOVERY_DIR/edfinder-v3-phase4c-r5-runtime-contract.tar.gz"
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'python3.14 - --container edfinder-v3-phase4c-full-20260827_r5-postgres' \
            < trusted-main/scripts/operator/recover_v3_runtime_contract.py > "$archive"
          test -s "$archive"
          (cd "$RECOVERY_DIR" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          python3 - "$archive" <<'PY'
          import pathlib
          import shutil
          import sys
          import tarfile
          archive = pathlib.Path(sys.argv[1])
          output = archive.parent
          expected = ("recovery-manifest.json", "recovery-receipt.json")
          with tarfile.open(archive, "r:gz") as bundle:
              members = {member.name: member for member in bundle.getmembers()}
              for name in expected:
                  member = members.get(name)
                  if member is None or not member.isfile():
                      raise SystemExit(f"Missing required recovery metadata member: {name}")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Unable to read recovery metadata member: {name}")
                  with source, (output / name).open("wb") as target:
                      shutil.copyfileobj(source, target)
          PY
        working-directory: ${{ github.workspace }}

      - name: Upload retained V3 runtime recovery
        if: steps.request.outputs.operation == 'recover-v3-runtime-contract'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edfinder-v3-phase4c-r5-runtime-contract
          path: |
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz.sha256
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/recovery-manifest.json
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/recovery-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare offline Ratings V4 generation bundle
        if: steps.request.outputs.operation == 'ratings-v4-generation-start'
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C trusted-main rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 64
          printf '%s\n' "$source_sha" > trusted-main/.ratings-v4-source-sha
          rm -rf trusted-main/.ratings-v4-wheelhouse
          mkdir -p trusted-main/.ratings-v4-wheelhouse
          python -m pip download --disable-pip-version-check --only-binary=:all: --dest trusted-main/.ratings-v4-wheelhouse \
            'psycopg[binary]==3.3.4' 'ijson==3.5.1'

      - name: Stage trusted main and launch Ratings V4 generation
        if: steps.request.outputs.operation == 'ratings-v4-generation-start'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECEIPT: ${{ runner.temp }}/ratings-v4-generation-operation.txt
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          source_sha="$(git -C trusted-main rev-parse HEAD)"
          stage="/var/tmp/edfinder-ratings-v4-${source_sha}"
          tar -C trusted-main --exclude=.git -cf - . | ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            "set -eu; umask 077; rm -rf '$stage'; mkdir -p '$stage'; tar --no-same-owner --no-same-permissions -C '$stage' -xf -"
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            "bash -s -- start '$stage' '$source_sha'" \
            < trusted-main/scripts/operator/actions/ratings-v4-generation.sh | tee "$RECEIPT"

      - name: Inspect Ratings V4 generation status
        if: steps.request.outputs.operation == 'ratings-v4-generation-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECEIPT: ${{ runner.temp }}/ratings-v4-generation-operation.txt
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'bash -s -- status' < trusted-main/scripts/operator/actions/ratings-v4-generation.sh | tee "$RECEIPT"

      - name: Upload Ratings V4 generation operation receipt
        if: always() && (steps.request.outputs.operation == 'ratings-v4-generation-start' || steps.request.outputs.operation == 'ratings-v4-generation-status')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ratings-v4-generation-operation
          path: ${{ runner.temp }}/ratings-v4-generation-operation.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare trusted V3 Search bundle marker and dependencies
        if: steps.request.outputs.operation == 'v3-system-search-f1-start' || steps.request.outputs.operation == 'v3-system-search-f1-status' || steps.request.outputs.operation == 'v3-system-search-f1-finalize'
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C trusted-main rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 64
          printf '%s\n' "$source_sha" > trusted-main/.v3-search-source-sha
          rm -rf trusted-main/.v3-search-wheelhouse trusted-main/.v3-probe-wheelhouse
          mkdir -p trusted-main/.v3-search-wheelhouse trusted-main/.v3-probe-wheelhouse
          python -m pip download --disable-pip-version-check --only-binary=:all: \
