              if key in receipt:
                  parts.append(key + "=" + text(receipt.get(key)))
          queued = receipt.get("constraints_queued")
          if isinstance(queued, list):
              parts.append("constraints_queued=" + str(len(queued)) + ": " + (",".join(text(q) for q in queued[:20]) or "none"))
          constraints = receipt.get("constraints") if isinstance(receipt.get("constraints"), list) else []
          if constraints:
              parts.append("constraints_total=" + str(len(constraints)))
              pending = [text(c.get("name")) for c in constraints if isinstance(c, dict) and c.get("validated") is not True]
              parts.append("not_yet_validated=" + (",".join(pending[:20]) or "none"))
          active = receipt.get("active_validations") if isinstance(receipt.get("active_validations"), list) else []
          for item in active[:4]:
              if isinstance(item, dict):
                  parts.append("active: state=" + text(item.get("state")) + " running_for=" + text(item.get("running_for")))
          message = " | ".join(parts)
          print(PREFIX + escape(message)[:3800])
          PYTHON

