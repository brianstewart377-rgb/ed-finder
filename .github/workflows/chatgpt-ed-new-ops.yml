      - name: Annotate V3 host storage detail
        if: always() && steps.request.outputs.operation == 'v3-host-storage-detail'
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/v3-host-storage-detail-receipt.json
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import pathlib

          PREFIX = "::notice title=Host storage detail::"

          def escape(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def short(value, limit=180):
              text = str(value)
              return text if len(text) <= limit else text[:limit] + "[field truncated]"

          def size(value):
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  return f"{value / (1024 ** 3):.2f} GiB ({value:.0f} B)"
              return "unknown"

          def emit(label, rows, pages=1):
              # Reserve space for the omission disclosure after packing escaped rows.
              rows = list(rows) or ["(none or unavailable)"]
              index = 0
              for page in range(pages):
                  text = f"{label} ({page + 1}):"
                  while index < len(rows):
                      candidate = text + "\n" + rows[index]
                      if len(PREFIX) + len(escape(candidate)) > 3700:
                          break
                      text = candidate
                      index += 1
                  if index < len(rows) and page == pages - 1:
                      text += f"\n[truncated: {len(rows) - index} more entries; full receipt in artifact]"
                  print(PREFIX + escape(text))
                  if index == len(rows):
                      break

          try:
              receipt = json.loads(pathlib.Path(os.environ["RECEIPT"]).read_text())
              if not isinstance(receipt, dict):
                  raise ValueError("receipt is not an object")
          except (OSError, ValueError) as error:
              emit("Receipt unavailable", [short(error, 500)])
              raise SystemExit(0)

          failures = receipt.get("failures", [])
          emit("Result", [
              "status=" + short(receipt.get("status", "unknown")),
              "failures=" + short(json.dumps(failures, ensure_ascii=True), 700),
              "read_only=" + short(receipt.get("read_only", "unknown")),
              "content_writes_performed=" + short(receipt.get("content_writes_performed", "unknown")),
              "directory_atime_metadata_writes_possible=" + short(receipt.get("directory_atime_metadata_writes_possible", "unknown")),
              "var_lib_scan_refused=" + short(receipt.get("var_lib_scan_refused", False)),
          ])
          volumes = sorted(receipt.get("volumes", []), key=lambda row: row.get("size_bytes") or -1, reverse=True)
          emit("Docker volumes by size", (
              f"{short(row.get('name', '?'))}: {size(row.get('size_bytes'))}; "
              f"measured={row.get('measured', 'unknown')}; reason={short(row.get('reason', ''))}; "
              f"in_use={row.get('in_use', 'unknown')}; containers=" + short(
                  ", ".join(f"{item.get('name', '?')} ({item.get('state', '?')})" for item in (row.get("containers") or [])), 260
              )
              for row in volumes
          ), pages=2)
          images = sorted(receipt.get("images", []), key=lambda row: row.get("size_bytes") or -1, reverse=True)
          emit("Docker images by size", (
              f"{short(row.get('repository_tag', '?'))} [{short(row.get('id', '?'), 80)}]: "
              f"{size(row.get('size_bytes'))}; in_use={row.get('in_use', 'unknown')}"
              for row in images
          ), pages=2)
          entries = sorted(receipt.get("var_lib_top", []), key=lambda row: row.get("size_bytes") or -1, reverse=True)
          emit("/var/lib top entries (production pgdata excluded)", (
              f"{short(row.get('path', '?'), 350)}: {size(row.get('size_bytes'))}"
              for row in entries
          ), pages=2)
          PYTHON

