      - name: Annotate V3 backup wrapper install receipt
        if: always() && steps.request.outputs.operation == 'v3-backup-wrapper-install'
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/v3-backup-wrapper-install-receipt.json
        run: |
          python -I -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import re

          PREFIX = "::notice title=Backup wrapper install::"

          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def flag(value):
              return str(value).lower() if isinstance(value, bool) else "unknown"

          def digest(value):
              return value[:12] if isinstance(value, str) and re.fullmatch(r"[0-9a-fA-F]{64}", value) else "unknown"

          def failure(value):
              # Receipts carry failure codes, never arbitrary exception or host text.
              if (isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9_%\r\n.-]{1,160}", value)
                      and not re.search(r"password|passwd|secret|token|credential|dsn|gh[pousr]_|github_pat_|AKIA|sk-", value, re.I)):
                  return value
              return "[invalid failure code]"

          def emit(rows):
              index = 0
              for page in range(8):
                  text = ""
                  while index < len(rows):
                      candidate = text + (" | " if text else "") + rows[index]
                      if len(PREFIX) + len(escape(candidate)) > 3700:
                          break
                      text = candidate
                      index += 1
                  if index < len(rows) and page == 7:
                      text += " | [truncated: more fields in receipt artifact]"
                  print(PREFIX + escape(text))
                  if index == len(rows):
                      break

          try:
              receipt = json.loads(Path(os.environ["RECEIPT"]).read_text())
              if not isinstance(receipt, dict):
                  raise ValueError("invalid receipt")
          except (OSError, ValueError):
              receipt = {"status": "stopped", "failures": ["receipt_unavailable_or_invalid"]}

          status = receipt.get("status")
          rows = ["status=" + (status if status in ("passed", "stopped") else "unknown")]
          failures = receipt.get("failures", [])
          if isinstance(failures, list):
              codes = [failure(value) for value in failures[:12]]
              if len(failures) > 12:
                  codes.append("[more failure codes omitted]")
              text = ",".join(codes) if codes else "[]"
              if len(text) > 700:
                  text = text[:700] + "[failure codes truncated]"
              rows.append("failures=" + text)
          else:
              rows.append("failures=[invalid failure codes]")
          for name in ("source_sha256", "installed_sha256"):
              rows.append(name + "=" + digest(receipt.get(name)))
          for name in ("wrapper_temp_written", "wrapper_installed", "installed_hash_verified"):
              rows.append(name + "=" + flag(receipt.get(name)))
          # Only boolean mutation flags are included; no other receipt fields,
          # environment values, paths, or subprocess diagnostics are serialized.
          names = {"db_writes_performed", "filesystem_writes_performed", "service_changes_performed",
                   "timer_changes_performed", "unit_changes_performed"}
          names.update(name for name in receipt
                       if re.fullmatch(r"[a-z][a-z0-9_]{0,64}_(?:writes|changes)_performed", name)
                       and not re.search(r"password|passwd|secret|token|credential|dsn|gh[pousr]_|github_pat_|AKIA", name, re.I))
          rows.extend(name + "=" + flag(receipt.get(name)) for name in sorted(names))
          emit(rows)
          PYTHON

