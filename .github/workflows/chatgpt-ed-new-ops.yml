          remote="$remote $quoted_script -- '$mode' '$source_sha' '$RUN_ID'; elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then exec sudo -n bash -c $quoted_script -- '$mode' '$source_sha' '$RUN_ID'; else echo 'Derived purge read-only inspection requires root or passwordless sudo' >&2; exit 64; fi"
          tar -C "$bundle" -cf - . | ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" "$remote" | tee "$RECEIPT"

      - name: Upload read-only derived purge receipt
        if: always() && contains(fromJSON('["v3-derived-purge-plan", "v3-derived-purge-status"]'), steps.request.outputs.operation)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v3-derived-purge-read-only
          path: ${{ runner.temp }}/v3-derived-purge-read-only.json
          if-no-files-found: error
          retention-days: 180
