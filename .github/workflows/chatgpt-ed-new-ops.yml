name: ChatGPT ed-new Ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted ed-new operation"
        required: true
        type: choice
        options:
          - host-status
          - recover-v3-runtime-contract
          - production-candidate-readiness
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-ops-requests/*.json'

permissions:
  contents: read

concurrency:
  group: chatgpt-ed-new-ops
  cancel-in-progress: false

jobs:
  execute:
    name: Run allowlisted ed-new operation
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 15
    steps:
      - name: Checkout request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            operation="$INPUT_OPERATION"
          elif [ "$EVENT_NAME" = "push" ]; then
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
            [ "${#changed_files[@]}" -eq 1 ] || { echo "Expected exactly one changed ed-new request file" >&2; exit 64; }
            case "${changed_files[0]}" in
              .github/ed-new-ops-requests/*.json) ;;
              *) echo "Push changed a path outside the request allowlist" >&2; exit 64 ;;
            esac
            operation="$(python -c 'import json,pathlib,sys; d=json.loads(pathlib.Path(sys.argv[1]).read_text()); extra=set(d)-{"operation"}; extra and sys.exit(f"Unsupported request keys: {sorted(extra)}"); op=d.get("operation"); (isinstance(op,str) and op) or sys.exit("operation must be a non-empty string"); print(op)' "${changed_files[0]}")"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 64
          fi
          case "$operation" in
            host-status|recover-v3-runtime-contract|production-candidate-readiness) ;;
            *) echo "Unsupported operation: $operation" >&2; exit 64 ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted recovery implementation
        if: steps.request.outputs.operation == 'recover-v3-runtime-contract'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted-main
          persist-credentials: false

      - name: Checkout reviewed candidate audit
        if: steps.request.outputs.operation == 'production-candidate-readiness'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2e79945d28ba3922573dd100598223037fa51b9f
          path: trusted-audit
          persist-credentials: false

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing ED_NEW_OPERATOR_SSH_KEY" >&2; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing ED_NEW_OPERATOR_HOST" >&2; exit 1; }
          test -n "$SSH_PORT" || { echo "Missing ED_NEW_OPERATOR_PORT" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing pinned ed-new known-hosts secret" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key
          chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = "22" ]; then
            known_host_lookup="$SSH_HOST"
          else
            known_host_lookup="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host_lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo "Pinned known-host trust does not cover the configured host and port" >&2
            exit 1
          }

      - name: Run bounded ed-new bootstrap status
        if: steps.request.outputs.operation == 'host-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'set -eu; echo "== ed-new bootstrap status =="; printf "hostname: "; hostname; printf "fqdn: "; hostname -f 2>/dev/null || true; printf "kernel: "; uname -sr; echo "== filesystem =="; df -hT /; echo "== docker =="; if command -v docker >/dev/null 2>&1; then docker ps --format "{{.Names}}\t{{.Status}}\t{{.Image}}" | head -50; else echo "docker: not installed"; fi; echo "== safety =="; echo "db_access_performed: false"; echo "db_writes_performed: false"; echo "migrations_performed: false"'

      - name: Recover retained V3 runtime contract
        if: steps.request.outputs.operation == 'recover-v3-runtime-contract'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECOVERY_DIR: ${{ runner.temp }}/edfinder-v3-runtime-recovery
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          mkdir -p "$RECOVERY_DIR"
          archive="$RECOVERY_DIR/edfinder-v3-phase4c-r5-runtime-contract.tar.gz"
          ssh -i ~/.ssh/ed_new_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'python3 - --container edfinder-v3-phase4c-full-20260827_r5-postgres' \
              < trusted-main/scripts/operator/recover_v3_runtime_contract.py \
              > "$archive"
          test -s "$archive"
          (cd "$RECOVERY_DIR" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Upload retained V3 runtime recovery
        if: steps.request.outputs.operation == 'recover-v3-runtime-contract'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edfinder-v3-phase4c-r5-runtime-contract
          path: |
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Run read-only production-candidate readiness audit
        id: candidate_audit
        if: steps.request.outputs.operation == 'production-candidate-readiness'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          CANDIDATE_DATABASE_URL: ${{ secrets.ED_NEW_CANDIDATE_DATABASE_URL }}
          REVIEWED_REVISION: 2e79945d28ba3922573dd100598223037fa51b9f
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          test -n "$CANDIDATE_DATABASE_URL" || { echo "Missing ED_NEW_CANDIDATE_DATABASE_URL" >&2; exit 1; }
          echo "::add-mask::$CANDIDATE_DATABASE_URL"
          audit_bundle="$(mktemp)"
          trap 'rm -f "$audit_bundle"' EXIT
          tar -czf "$audit_bundle" -C trusted-audit scripts/operator/audit_production_candidate.py sql
          scp -q -i ~/.ssh/ed_new_operator_key \
              -P "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o StrictHostKeyChecking=yes \
              "$audit_bundle" "$SSH_USER@$SSH_HOST:/tmp/ed-finder-candidate-audit-$GITHUB_RUN_ID.tar.gz"
          set +e
          printf '%s\n' "$CANDIDATE_DATABASE_URL" | ssh \
              -i ~/.ssh/ed_new_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "set -eu; bundle=/tmp/ed-finder-candidate-audit-$GITHUB_RUN_ID.tar.gz; workdir=\"\$(mktemp -d)\"; receipt=\"\$(mktemp)\"; trap 'rm -rf \"\$workdir\"; rm -f \"\$receipt\" \"\$bundle\"' EXIT; tar -xzf \"\$bundle\" -C \"\$workdir\"; IFS= read -r DATABASE_URL; test -n \"\$DATABASE_URL\"; export DATABASE_URL; cd \"\$workdir\"; set +e; python3 scripts/operator/audit_production_candidate.py --reviewed-revision '$REVIEWED_REVISION' --json-output \"\$receipt\" >&2; status=\$?; set -e; test -s \"\$receipt\" && cat \"\$receipt\"; exit \"\$status\"" \
              > production-candidate-readiness.json
          audit_status=$?
          set -e
          echo "audit_status=$audit_status" >> "$GITHUB_OUTPUT"

      - name: Validate readiness receipt
        id: validate_candidate_receipt
        if: steps.request.outputs.operation == 'production-candidate-readiness' && always()
        shell: bash
        env:
          CANDIDATE_DATABASE_URL: ${{ secrets.ED_NEW_CANDIDATE_DATABASE_URL }}
          REVIEWED_REVISION: 2e79945d28ba3922573dd100598223037fa51b9f
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = Path('production-candidate-readiness.json')
          raw = receipt.read_text(encoding='utf-8')
          payload = json.loads(raw)
          if payload.get('reviewed_revision') != os.environ['REVIEWED_REVISION']:
              raise SystemExit('Readiness receipt is not bound to the reviewed revision')
          secret = os.environ.get('CANDIDATE_DATABASE_URL', '')
          if secret and secret in raw:
              raise SystemExit('Readiness receipt contains the candidate database URL')
          PY

      - name: Retain production-candidate readiness receipt
        if: steps.request.outputs.operation == 'production-candidate-readiness' && always() && steps.validate_candidate_receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-candidate-readiness-${{ github.run_id }}
          path: production-candidate-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce production-candidate readiness result
        if: steps.request.outputs.operation == 'production-candidate-readiness' && always()
        shell: bash
        env:
          AUDIT_STATUS: ${{ steps.candidate_audit.outputs.audit_status }}
        run: |
          set -euo pipefail
          case "$AUDIT_STATUS" in
            0) echo "Production-candidate readiness audit passed." ;;
            1) echo "Production candidate has readiness blockers; inspect the JSON receipt." >&2; exit 1 ;;
            2) echo "Production-candidate audit failed closed; inspect the run." >&2; exit 2 ;;
            *) echo "Production-candidate audit did not produce a valid result." >&2; exit 2 ;;
          esac
