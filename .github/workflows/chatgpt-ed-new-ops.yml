name: ChatGPT ed-new Ops
run-name: ChatGPT ed-new Ops · ${{ inputs.request_id || github.run_id }} · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted ed-new operation"
        required: true
        type: choice
        options:
          - host-status
          - octopus-edge-status
          - recover-v3-runtime-contract
          - octopus-qdrant-healthcheck-repair
      request_id:
        description: "Dispatcher receipt identifier (optional for manual runs)"
        required: false
        type: string
      request_file:
        description: "Validated request path (dispatcher use)"
        required: false
        type: string
      request_sha:
        description: "Validated request revision (dispatcher use)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  queue:
    name: Wait for earlier trusted executor runs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Enter durable FIFO
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: chatgpt-ed-new-ops.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          run_id = int(os.environ["RUN_ID"])
          base = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/{os.environ['WORKFLOW_FILE']}/runs"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          while True:
              older = []
              for status in ("queued", "in_progress", "waiting", "pending", "requested"):
                  page = 1
                  while True:
                      query = urllib.parse.urlencode({"event": "workflow_dispatch", "status": status, "per_page": 100, "page": page})
                      request = urllib.request.Request(f"{base}?{query}", headers=headers)
                      with urllib.request.urlopen(request, timeout=30) as response:
                          runs = json.load(response).get("workflow_runs", [])
                      older.extend(run["id"] for run in runs if int(run["id"]) < run_id)
                      if len(runs) < 100:
                          break
                      page += 1
              if not older:
                  print(f"FIFO acquired by workflow run {run_id}")
                  break
              print(f"Waiting behind {len(set(older))} earlier active executor run(s)", flush=True)
              time.sleep(15)
          PY

  execute:
    name: Run allowlisted ed-new operation
    if: github.ref == 'refs/heads/main'
    needs: queue
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Validate request input
        id: request
        shell: bash
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          operation="$INPUT_OPERATION"
          case "$operation" in
            host-status|octopus-edge-status|recover-v3-runtime-contract|octopus-qdrant-healthcheck-repair) ;;
            *) echo "Unsupported operation: $operation" >&2; exit 64 ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted operator implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted-main
          persist-credentials: false

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing ED_NEW_OPERATOR_SSH_KEY" >&2; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing ED_NEW_OPERATOR_HOST" >&2; exit 1; }
          test -n "$SSH_PORT" || { echo "Missing ED_NEW_OPERATOR_PORT" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing pinned ed-new known-hosts secret" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key
          chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = "22" ]; then
            known_host_lookup="$SSH_HOST"
          else
            known_host_lookup="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host_lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo "Pinned known-host trust does not cover the configured host and port" >&2
            exit 1
          }

      - name: Run bounded ed-new bootstrap status
        if: steps.request.outputs.operation == 'host-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$SSH_USER@$SSH_HOST" \
              'set -eu; echo "== ed-new bootstrap status =="; printf "hostname: "; hostname; printf "fqdn: "; hostname -f 2>/dev/null || true; printf "kernel: "; uname -sr; echo "== filesystem =="; df -hT /; echo "== docker =="; if command -v docker >/dev/null 2>&1; then docker ps --format "{{.Names}}\t{{.Status}}\t{{.Image}}" | head -50; else echo "docker: not installed"; fi; echo "== repo candidates =="; for p in /opt/ed-finder /root/ed-finder /srv/ed-finder; do [ -d "$p" ] && echo "$p"; done; echo "== safety =="; echo "db_access_performed: false"; echo "db_writes_performed: false"; echo "migrations_performed: false"; echo "canonical_apply_performed: false"'

      - name: Repair Octopus Qdrant healthcheck and boot web
        if: steps.request.outputs.operation == 'octopus-qdrant-healthcheck-repair'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$SSH_USER@$SSH_HOST" \
              'cd /opt/ed-finder && bash -s' \
              < trusted-main/scripts/operator/actions/octopus-qdrant-healthcheck-repair.sh

      - name: Inspect Octopus edge status
        if: steps.request.outputs.operation == 'octopus-edge-status'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          ssh -i ~/.ssh/ed_new_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$SSH_USER@$SSH_HOST" \
              'cd /opt/ed-finder && bash -s' \
              < trusted-main/scripts/operator/actions/octopus-edge-status.sh

      - name: Recover retained V3 runtime contract
        if: steps.request.outputs.operation == 'recover-v3-runtime-contract'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RECOVERY_DIR: ${{ runner.temp }}/edfinder-v3-runtime-recovery
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing ED_NEW_OPERATOR_USER" >&2; exit 1; }
          mkdir -p "$RECOVERY_DIR"
          archive="$RECOVERY_DIR/edfinder-v3-phase4c-r5-runtime-contract.tar.gz"
          ssh -i ~/.ssh/ed_new_operator_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$SSH_USER@$SSH_HOST" \
              'python3 - --container edfinder-v3-phase4c-full-20260827_r5-postgres' \
              < trusted-main/scripts/operator/recover_v3_runtime_contract.py \
              > "$archive"
          test -s "$archive"
          (cd "$RECOVERY_DIR" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          python3 - "$archive" <<'PY'
          import pathlib
          import shutil
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          output = archive.parent
          expected = ("recovery-manifest.json", "recovery-receipt.json")
          with tarfile.open(archive, "r:gz") as bundle:
              members = {member.name: member for member in bundle.getmembers()}
              for name in expected:
                  member = members.get(name)
                  if member is None or not member.isfile():
                      raise SystemExit(f"Missing required recovery metadata member: {name}")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Unable to read recovery metadata member: {name}")
                  with source, (output / name).open("wb") as target:
                      shutil.copyfileobj(source, target)
          PY
        working-directory: ${{ github.workspace }}

      - name: Upload retained V3 runtime recovery
        if: steps.request.outputs.operation == 'recover-v3-runtime-contract'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edfinder-v3-phase4c-r5-runtime-contract
          path: |
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/edfinder-v3-phase4c-r5-runtime-contract.tar.gz.sha256
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/recovery-manifest.json
            ${{ runner.temp }}/edfinder-v3-runtime-recovery/recovery-receipt.json
          if-no-files-found: error
          retention-days: 14
