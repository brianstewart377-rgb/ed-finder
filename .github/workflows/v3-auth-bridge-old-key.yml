name: V3 Auth Bridge Old Key

on:
  push:
    branches:
      - chatgpt-ops-requests
    paths:
      - '.github/v3-auth-bridge-old-key-requests/*.json'

permissions:
  contents: read

jobs:
  key:
    name: Prepare old-host tunnel keys
    runs-on: ubuntu-latest
    environment: hetzner-operator
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/v3-auth-bridge-old-key-requests/*.json) ;; *) exit 64 ;; esac
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
      - name: Generate persistent tunnel key and one-time metadata key
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.HETZNER_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          d=/opt/ed-finder/.v3-auth-bridge
          mkdir -p "$d"; chmod 700 "$d"
          if [ ! -s "$d/id_ed25519" ]; then
            ssh-keygen -q -t ed25519 -N '' -f "$d/id_ed25519"
          fi
          chmod 600 "$d/id_ed25519"; chmod 644 "$d/id_ed25519.pub"
          rm -f "$d/metadata_rsa.pem" "$d/metadata_rsa.pub.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$d/metadata_rsa.pem" >/dev/null 2>&1
          openssl pkey -in "$d/metadata_rsa.pem" -pubout -out "$d/metadata_rsa.pub.pem" >/dev/null 2>&1
          chmod 600 "$d/metadata_rsa.pem" "$d/metadata_rsa.pub.pem"
          echo "tunnel_pub_b64|$(base64 -w0 "$d/id_ed25519.pub")"
          echo "metadata_pub_b64|$(base64 -w0 "$d/metadata_rsa.pub.pem")"
          echo 'old_bridge_keys|PASS'
          REMOTE
