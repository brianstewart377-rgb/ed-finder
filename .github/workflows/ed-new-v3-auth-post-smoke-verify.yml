name: ed-new V3 Auth Post-Smoke Verify

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-v3-auth-post-smoke-verify-requests/*.json'

permissions:
  contents: read

jobs:
  verify:
    name: Verify public auth smoke left clean V3 identity state
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 5
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-v3-auth-post-smoke-verify-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json,pathlib,sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {"operation":"verify-v3-auth-clean-state"}:
              raise SystemExit(64)
          PY
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Verify identity state and durable edge
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          c='edfinder-v3-phase4c-full-20260827_r5-postgres'
          result="$(docker exec -u postgres "$c" sh -lc \
            'PGPASSWORD="$POSTGRES_PASSWORD" exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d edfinder_v3_phase4c_full_20260827_r5 -At -F "|" -c "SELECT (SELECT count(*) FROM v3_identity.account),(SELECT count(*) FROM v3_identity.session),(SELECT count(*) FROM v3_identity.oauth_login_state);"')"
          IFS='|' read -r accounts sessions states <<EOF
          $result
          EOF
          [ "$accounts" = '0' ]
          [ "$sessions" = '0' ]
          [ "$states" = '0' ]
          systemctl is-enabled --quiet edfinder-v3-public-auth-edge.service
          systemctl is-active --quiet edfinder-v3-public-auth-edge.service
          systemctl is-enabled --quiet edfinder-v3-public-auth-edge-health.timer
          systemctl is-active --quiet edfinder-v3-public-auth-edge-health.timer
          curl -fsS --max-time 3 -H 'Host: ed-finder.app' http://127.0.0.1/healthz >/dev/null
          curl -fsS --max-time 5 -H 'Host: ed-finder.app' http://127.0.0.1/api/auth/session >/dev/null
          echo 'accounts|0'
          echo 'sessions|0'
          echo 'oauth_login_state_rows|0'
          echo 'durable_public_auth_edge|PASS'
          echo 'post_smoke_clean_state|PASS'
          REMOTE
