name: V3 Auth Bridge New Target

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/v3-auth-bridge-new-target-requests/*.json'

permissions:
  contents: read

jobs:
  install:
    name: Install restricted tunnel target and encrypt metadata
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/v3-auth-bridge-new-target-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import base64,json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if set(d)!={'operation','tunnel_pub_b64','metadata_pub_b64'} or d['operation']!='install-new-tunnel-target':
              raise SystemExit('invalid request')
          pub=base64.b64decode(d['tunnel_pub_b64'],validate=True)
          meta=base64.b64decode(d['metadata_pub_b64'],validate=True)
          if not pub.startswith(b'ssh-ed25519 ') or b'BEGIN PUBLIC KEY' not in meta:
              raise SystemExit('invalid public key material')
          pathlib.Path('/tmp/tunnel.pub').write_bytes(pub)
          pathlib.Path('/tmp/meta.pub.pem').write_bytes(meta)
          PY
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Install restricted tunnel account
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          scp -q -i ~/.ssh/key -P "$SSH_PORT" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            /tmp/tunnel.pub "$SSH_USER@$SSH_HOST:/tmp/v3-tunnel.pub"
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          user=edfinder-v3-tunnel
          tunnel_pub="$(cat /tmp/v3-tunnel.pub)"
          rm -f /tmp/v3-tunnel.pub
          if ! id "$user" >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash "$user"
            passwd -l "$user" >/dev/null 2>&1 || true
          fi
          home="$(getent passwd "$user" | cut -d: -f6)"
          mkdir -p "$home/.ssh"; chmod 700 "$home/.ssh"
          printf '%s %s\n' 'no-agent-forwarding,no-X11-forwarding,no-pty,no-user-rc,permitopen="127.0.0.1:58080"' "$tunnel_pub" > "$home/.ssh/authorized_keys"
          chmod 600 "$home/.ssh/authorized_keys"
          chown -R "$user:$user" "$home/.ssh"
          forwarding="$(sshd -T -C user="$user",host=localhost,addr=127.0.0.1 | awk '$1=="allowtcpforwarding"{print $2; exit}')"
          case "$forwarding" in yes|local|all) ;; *) echo "SSH local forwarding disabled: $forwarding" >&2; exit 1 ;; esac
          curl -fsS --max-time 5 http://127.0.0.1:58080/api/health >/dev/null
          echo 'new_tunnel_target|PASS'
          REMOTE
      - name: Encrypt pinned connection metadata for old host
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts | awk '!/^#/ {print; exit}' > /tmp/pinned-host-key
          test -s /tmp/pinned-host-key || { echo 'No pinned known_hosts key found for target' >&2; exit 1; }
          fingerprint="$(ssh-keygen -lf /tmp/pinned-host-key -E sha256 | awk '{print $2}')"
          case "$fingerprint" in SHA256:*) ;; *) echo 'Invalid pinned host-key fingerprint' >&2; exit 1 ;; esac
          TARGET_HOST="$SSH_HOST" TARGET_PORT="$SSH_PORT" FINGERPRINT="$fingerprint" python3 - <<'PY'
          import json,os,pathlib
          d={
              'host':os.environ['TARGET_HOST'],
              'port':int(os.environ['TARGET_PORT']),
              'user':'edfinder-v3-tunnel',
              'host_key_sha256':os.environ['FINGERPRINT'],
          }
          pathlib.Path('/tmp/metadata.json').write_text(json.dumps(d,separators=(',',':')))
          PY
          openssl pkeyutl -encrypt -pubin -inkey /tmp/meta.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/metadata.json -out /tmp/metadata.enc
          echo "encrypted_metadata_b64|$(base64 -w0 /tmp/metadata.enc)"
          echo 'encrypted_metadata|PASS'
          rm -f /tmp/tunnel.pub /tmp/meta.pub.pem /tmp/metadata.json /tmp/metadata.enc /tmp/pinned-host-key
