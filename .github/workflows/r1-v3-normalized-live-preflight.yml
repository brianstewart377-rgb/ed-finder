name: R1 V3 Normalized Live Structural Preflight

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/r1-v3-normalized-live-preflight-requests/*.json'

permissions:
  contents: read

concurrency:
  group: r1-v3-normalized-live-structural
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate request and pinned migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || { echo 'Expected exactly one normalized-V3 preflight request' >&2; exit 64; }
          case "${changed[0]}" in
            .github/r1-v3-normalized-live-preflight-requests/*.json) ;;
            *) echo 'Changed path outside normalized-V3 preflight allowlist' >&2; exit 64 ;;
          esac
          python3 - "${changed[0]}" <<'PY'
          import json, pathlib, sys
          expected={
            'operation':'r1-v3-normalized-live-structural-preflight',
            'migration_commit':'3978b071d7f98b320c146e58a20b66c7f2845f86',
            'migration_blob_sha':'26d1ef3d4ae343159ba62281102f2143ccff7fb8',
          }
          data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if data != expected:
              raise SystemExit(f'Unsupported normalized-V3 preflight request: {data!r}')
          PY
          git cat-file -e '3978b071d7f98b320c146e58a20b66c7f2845f86^{commit}'
          actual="$(git show '3978b071d7f98b320c146e58a20b66c7f2845f86:sql/r1_v3/001_structural_shell.sql' | git hash-object --stdin)"
          [ "$actual" = '26d1ef3d4ae343159ba62281102f2143ccff7fb8' ] || { echo "Migration blob mismatch: $actual" >&2; exit 1; }
          echo "migration_blob_verified: $actual"

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"; test -n "$SSH_HOST"; test -n "$SSH_PORT"; test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key; chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null || { echo 'Pinned host trust mismatch' >&2; exit 1; }

      - name: Read-only retained normalized V3 preflight
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json, subprocess

          container='edfinder-v3-phase4c-full-20260827_r5-postgres'
          database='edfinder_v3_phase4c_full_20260827_r5'
          inspect=json.loads(subprocess.check_output(['docker','inspect',container],text=True))[0]
          state=inspect.get('State',{})
          if not state.get('Running'):
              raise SystemExit('STOP: normalized V3 container is not running')
          env={}
          for item in inspect.get('Config',{}).get('Env',[]):
              if '=' in item:
                  k,v=item.split('=',1); env[k]=v
          user=env.get('POSTGRES_USER') or 'postgres'
          password=env.get('POSTGRES_PASSWORD') or ''
          base=['docker','exec']
          if password: base += ['-e',f'PGPASSWORD={password}']
          base += [container,'psql','-h','127.0.0.1','-U',user,'-d',database,'-v','ON_ERROR_STOP=1','-At','-F','|']

          def psql(sql):
              wrapped='BEGIN READ ONLY; '+sql+'; COMMIT;'
              return subprocess.check_output(base+['-c',wrapped],text=True,stderr=subprocess.STDOUT).splitlines()

          def payload(sql):
              return [x for x in psql(sql) if x not in ('BEGIN','COMMIT')]

          ident=payload("SELECT current_database(), current_user, pg_size_pretty(pg_database_size(current_database())), pg_is_in_recovery()")
          print('target_identity:', ident)

          required=payload("SELECT to_regclass('v3_meta.canonical_generation')::text, to_regclass('v3_identity.account')::text, to_regclass('v3_meta.schema_migration')::text")
          print('required_relations:', required)
          if required != ['v3_meta.canonical_generation|v3_identity.account|v3_meta.schema_migration']:
              raise SystemExit('STOP: normalized V3 authority relations are not exactly present')

          types=payload("""
            SELECT n.nspname,c.relname,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull
            FROM pg_attribute a JOIN pg_class c ON c.oid=a.attrelid JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE a.attnum>0 AND NOT a.attisdropped AND (
              (n.nspname='v3_identity' AND c.relname='account' AND a.attname='account_id') OR
              (n.nspname='v3_meta' AND c.relname='canonical_generation' AND a.attname='generation_id'))
            ORDER BY n.nspname,c.relname,a.attname
          """)
          print('authority_types:', types)
          expected_types={
            'v3_identity|account|account_id|uuid|t',
            'v3_meta|canonical_generation|generation_id|uuid|t',
          }
          if set(types) != expected_types:
              raise SystemExit('STOP: authority FK types differ from reviewed contract')

          r1=payload("SELECT nspname FROM pg_namespace WHERE nspname IN ('r1_meta','r1_cache','r1_plan') ORDER BY nspname")
          print('existing_r1_schemas:', r1)
          if r1:
              raise SystemExit('STOP: one or more R1 schemas already exist')

          ledger_cols=payload("""
            SELECT a.attnum,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull,
                   COALESCE(pg_get_expr(ad.adbin,ad.adrelid),'')
            FROM pg_attribute a
            JOIN pg_class c ON c.oid=a.attrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            LEFT JOIN pg_attrdef ad ON ad.adrelid=a.attrelid AND ad.adnum=a.attnum
            WHERE n.nspname='v3_meta' AND c.relname='schema_migration'
              AND a.attnum>0 AND NOT a.attisdropped
            ORDER BY a.attnum
          """)
          print('schema_migration_columns:')
          for row in ledger_cols: print(row)

          ledger_constraints=payload("""
            SELECT conname,contype,pg_get_constraintdef(oid)
            FROM pg_constraint
            WHERE conrelid='v3_meta.schema_migration'::regclass
            ORDER BY conname
          """)
          print('schema_migration_constraints:')
          for row in ledger_constraints: print(row)

          ledger_count=payload("SELECT count(*) FROM v3_meta.schema_migration")
          print('schema_migration_row_count:', ledger_count)
          print('preflight_result: passed_read_only')
          print('db_writes_performed: false')
          PY
