name: Hetzner TLS Certificate Inspect

on:
  push:
    branches:
      - chatgpt-ops-requests
    paths:
      - '.github/hetzner-tls-cert-inspect-requests/*.json'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect transferable ed-finder TLS certificate
    runs-on: ubuntu-latest
    environment: hetzner-operator
    timeout-minutes: 5
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/hetzner-tls-cert-inspect-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json,pathlib,sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {"operation":"inspect-ed-finder-tls"}:
              raise SystemExit(64)
          PY
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
      - name: Inspect certificate metadata only
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.HETZNER_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cert='/etc/letsencrypt/live/ed-finder.app/fullchain.pem'
          key='/etc/letsencrypt/live/ed-finder.app/privkey.pem'
          test -r "$cert"
          test -r "$key"
          openssl x509 -in "$cert" -noout -subject -issuer -dates -serial -fingerprint -sha256
          san="$(openssl x509 -in "$cert" -noout -ext subjectAltName 2>/dev/null || true)"
          printf '%s\n' "$san" | grep -E 'DNS:ed-finder\.app' >/dev/null
          printf '%s\n' "$san" | grep -E 'DNS:www\.ed-finder\.app' >/dev/null
          openssl x509 -in "$cert" -checkend 172800 -noout >/dev/null
          cert_pub="$(openssl x509 -in "$cert" -pubkey -noout | openssl pkey -pubin -outform der 2>/dev/null | sha256sum | awk '{print $1}')"
          key_pub="$(openssl pkey -in "$key" -pubout -outform der 2>/dev/null | sha256sum | awk '{print $1}')"
          [ "$cert_pub" = "$key_pub" ]
          echo 'san_ed_finder_app|PASS'
          echo 'san_www_ed_finder_app|PASS'
          echo 'valid_beyond_48h|PASS'
          echo 'private_key_matches_certificate|PASS'
          echo 'private_key_contents_printed|false'
          REMOTE
