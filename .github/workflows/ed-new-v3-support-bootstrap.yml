name: ed-new V3 Support Bootstrap

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-v3-support-requests/*.json'

permissions:
  contents: read

concurrency:
  group: ed-new-v3-support-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bring up retained V3 support plane
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 20
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || { echo 'Expected exactly one V3 support request file' >&2; exit 64; }
          case "${changed[0]}" in .github/ed-new-v3-support-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json, pathlib, sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {"operation":"bootstrap-v3-support-plane"}:
              raise SystemExit(64)
          PY

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key; chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null

      - name: Bootstrap private support services
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          pg='edfinder-v3-phase4c-full-20260827_r5-postgres'
          net='edfinder-v3-runtime'
          redis='edfinder-v3-support-redis'
          nats='edfinder-v3-support-nats'
          nats_vol='edfinder-v3-support-natsdata'

          docker inspect "$pg" >/dev/null
          health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$pg")"
          [ "$health" = healthy ] || { echo "PostgreSQL container is not healthy: $health" >&2; exit 1; }

          if ! docker network inspect "$net" >/dev/null 2>&1; then
            docker network create --label com.edfinder.v3.runtime=true "$net" >/dev/null
          fi

          if ! docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$pg" | grep -Fxq "$net"; then
            docker network connect --alias postgres "$net" "$pg"
          fi
          docker update --restart unless-stopped "$pg" >/dev/null

          if ! docker volume inspect "$nats_vol" >/dev/null 2>&1; then
            docker volume create --label com.edfinder.v3.runtime=true "$nats_vol" >/dev/null
          fi

          if docker inspect "$redis" >/dev/null 2>&1; then
            docker update --restart unless-stopped "$redis" >/dev/null
            if ! docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$redis" | grep -Fxq "$net"; then
              docker network connect --alias redis "$net" "$redis"
            fi
            [ "$(docker inspect -f '{{.State.Running}}' "$redis")" = true ] || docker start "$redis" >/dev/null
          else
            docker run -d \
              --name "$redis" \
              --restart unless-stopped \
              --network "$net" \
              --network-alias redis \
              --label com.edfinder.v3.runtime=true \
              redis:8.2.2-alpine \
              redis-server --save '' --appendonly no >/dev/null
          fi

          if docker inspect "$nats" >/dev/null 2>&1; then
            docker update --restart unless-stopped "$nats" >/dev/null
            if ! docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$nats" | grep -Fxq "$net"; then
              docker network connect --alias nats "$net" "$nats"
            fi
            [ "$(docker inspect -f '{{.State.Running}}' "$nats")" = true ] || docker start "$nats" >/dev/null
          else
            docker run -d \
              --name "$nats" \
              --restart unless-stopped \
              --network "$net" \
              --network-alias nats \
              --label com.edfinder.v3.runtime=true \
              -v "$nats_vol:/data" \
              nats:2.12.4-alpine \
              --jetstream --store_dir=/data --name=edfinder-v3-support-nats >/dev/null
          fi

          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$redis")" = true ] && docker exec "$redis" redis-cli ping 2>/dev/null | grep -qx PONG; then
              break
            fi
            sleep 1
          done
          docker exec "$redis" redis-cli ping | grep -qx PONG

          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$nats")" = true ]; then
              break
            fi
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Running}}' "$nats")" = true ]

          echo 'support_plane|PASS'
          echo "postgres_restart_policy|$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$pg")"
          echo "redis|$(docker inspect -f '{{.State.Status}}|{{.HostConfig.RestartPolicy.Name}}' "$redis")"
          echo "nats|$(docker inspect -f '{{.State.Status}}|{{.HostConfig.RestartPolicy.Name}}' "$nats")"
          echo "runtime_network|$net"
          echo 'public_ports_exposed|false'
          echo 'db_writes_performed|false'
          echo 'api_started|false'
          REMOTE
