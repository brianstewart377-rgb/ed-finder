name: ed-new V3 Verify Progress

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-v3-verify-progress-requests/*.json'

permissions:
  contents: read

jobs:
  progress:
    name: Inspect pgBackRest verify process
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-v3-verify-progress-requests/*.json) ;; *) exit 64 ;; esac
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Inspect verify process only
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          c='edfinder-v3-phase4c-full-20260827_r5-postgres'
          echo 'verify_processes:'
          docker top "$c" -eo pid,etimes,pcpu,pmem,args | awk 'NR==1 || tolower($0) ~ /pgbackrest.*verify/'
          count="$(docker top "$c" -eo pid,args | awk 'tolower($0) ~ /pgbackrest.*verify/ {n++} END {print n+0}')"
          echo "verify_process_count|$count"
          [ "$count" -ge 1 ] || { echo 'No active pgBackRest verify process found' >&2; exit 1; }
          echo 'db_writes_performed|false'
          REMOTE
