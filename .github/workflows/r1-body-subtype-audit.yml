name: R1 Body Subtype Read-Only Audit

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/r1-body-subtype-audit-requests/*.json'

permissions:
  contents: read

concurrency:
  group: r1-body-subtype-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || { echo 'Expected one subtype-audit request' >&2; exit 64; }
          case "${changed[0]}" in .github/r1-body-subtype-audit-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json,pathlib,sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {'operation':'r1-body-subtype-readonly-audit'}:
              raise SystemExit('unsupported request')
          PY
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"; test -n "$SSH_HOST"; test -n "$SSH_PORT"; test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key; chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Inspect normalized V3 catalogs only
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json, subprocess
          container='edfinder-v3-phase4c-full-20260827_r5-postgres'
          database='edfinder_v3_phase4c_full_20260827_r5'
          inspect=json.loads(subprocess.check_output(['docker','inspect',container],text=True))[0]
          env={}
          for item in inspect.get('Config',{}).get('Env',[]):
              if '=' in item:
                  k,v=item.split('=',1); env[k]=v
          user=env.get('POSTGRES_USER') or 'postgres'; password=env.get('POSTGRES_PASSWORD') or ''
          base=['docker','exec']
          if password: base += ['-e',f'PGPASSWORD={password}']
          base += [container,'psql','-X','-h','127.0.0.1','-U',user,'-d',database,'-v','ON_ERROR_STOP=1','-At','-F','|']
          def q(sql):
              wrapped='BEGIN READ ONLY; '+sql.rstrip().rstrip(';')+'; COMMIT;'
              rows=subprocess.check_output(base+['-c',wrapped],text=True,stderr=subprocess.STDOUT).splitlines()
              return [r for r in rows if r not in ('BEGIN','COMMIT')]

          print('target:', q("SELECT current_database(),current_user,pg_size_pretty(pg_database_size(current_database()))"))
          print('canonical_generations:')
          for row in q("SELECT generation_id::text,generation_key,relation_schema,lifecycle_state FROM v3_meta.canonical_generation ORDER BY created_at"):
              print(row)
          published=q("SELECT relation_schema FROM v3_meta.canonical_generation WHERE lifecycle_state='published' ORDER BY published_at DESC NULLS LAST LIMIT 1")
          if len(published)!=1: raise SystemExit(f'STOP: expected one published generation, got {published}')
          schema=published[0]
          print('published_schema:', schema)
          print('body_columns:')
          sql=f"""
          SELECT a.attnum,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull
          FROM pg_attribute a JOIN pg_class c ON c.oid=a.attrelid JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='{schema}' AND c.relname='bodies' AND a.attnum>0 AND NOT a.attisdropped
          ORDER BY a.attnum
          """
          for row in q(sql): print(row)
          print('vocab_relations:')
          for row in q("SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='v3_vocab' AND c.relkind='r' ORDER BY c.relname"):
              print(row)
          for vocab in ['body_type','star_spectral_class','star_luminosity_class','terraforming_state','volcanism_type','atmosphere_type','ring_type','reserve_level','signal_type']:
              exists=q(f"SELECT to_regclass('v3_vocab.{vocab}')::text")
              if exists and exists[0]:
                  print(f'vocab:{vocab}:')
                  for row in q(f'SELECT row_to_json(t)::text FROM v3_vocab.{vocab} t ORDER BY 1 LIMIT 200'):
                      print(row)
          print('db_writes_performed: false')
          PY
