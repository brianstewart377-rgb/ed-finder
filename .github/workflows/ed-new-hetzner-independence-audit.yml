name: ed-new Hetzner Independence Audit

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-hetzner-independence-audit-requests/*.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-hetzner-independence-audit-requests/*.json) ;; *) exit 64 ;; esac
      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Audit surviving ed-new path
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          /opt/ed-finder-v3-runtime/health-check.sh
          echo 'runtime_health|PASS'

          for unit in edfinder-v3-runtime.service edfinder-v3-public-auth-edge.service edfinder-v3-health.timer edfinder-v3-public-auth-edge-health.timer edfinder-storagebox.service; do
            systemctl is-enabled "$unit" >/dev/null
            echo "$unit|enabled"
          done

          systemctl is-active edfinder-v3-public-auth-edge.service >/dev/null
          systemctl is-active edfinder-v3-health.timer >/dev/null
          systemctl is-active edfinder-v3-public-auth-edge-health.timer >/dev/null
          echo 'survival_services_active|PASS'

          for c in edfinder-v3-api edfinder-v3-proxy edfinder-v3-support-nats edfinder-v3-support-redis edfinder-v3-phase4c-full-20260827_r5-postgres edfinder-v3-public-auth-edge; do
            [ "$(docker inspect -f '{{.State.Running}}' "$c")" = true ]
            echo "$c|running"
          done

          cfg=/etc/edfinder-v3/public-auth-edge/nginx.conf
          boot=/usr/local/sbin/edfinder-v3-public-auth-edge-bootstrap
          test -f "$cfg" && test -x "$boot"
          if grep -R -n -E '95\.216\.33\.156|2a01:4f9:2a:21f1::2|edfinder-v3-auth-tunnel|18080' \
              /etc/edfinder-v3 /opt/ed-finder-v3-runtime /usr/local/sbin/edfinder-v3-* 2>/dev/null; then
            echo 'old_hetzner_reference_found|true' >&2
            exit 1
          fi
          echo 'old_hetzner_reference_found|false'

          if systemctl list-unit-files --no-legend 2>/dev/null | awk '{print $1}' | grep -qx 'edfinder-v3-auth-tunnel.service'; then
            state="$(systemctl is-active edfinder-v3-auth-tunnel.service 2>/dev/null || true)"
            [ "$state" != active ] || { echo 'unexpected active Hetzner tunnel' >&2; exit 1; }
          fi
          echo 'active_hetzner_tunnel|false'

          mountpoint -q /mnt/ed-storagebox
          systemctl is-enabled edfinder-v3-pgbackrest@diff.timer >/dev/null
          systemctl is-enabled edfinder-v3-pgbackrest@full.timer >/dev/null
          systemctl is-enabled edfinder-v3-pgbackrest@verify.timer >/dev/null
          echo 'backup_mount_and_timers|PASS'

          echo 'hetzner_independent_survival_path|PASS'
          echo 'database_writes_performed|false'
          REMOTE
