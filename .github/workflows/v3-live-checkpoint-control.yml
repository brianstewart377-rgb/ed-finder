name: V3 live-checkpoint control
run-name: V3 checkpoint control · issue #${{ github.event.issue.number }} · comment ${{ github.event.comment.id }}

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'brianstewart377-rgb/ed-finder' &&
      github.event.issue.number == 623 &&
      github.actor == 'brianstewart377-rgb' &&
      github.event.comment.user.login == 'brianstewart377-rgb' &&
      startsWith(github.event.comment.body, 'V3-CHECKPOINT ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.request.outputs.operation }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      compatibility_evidence: ${{ steps.request.outputs.compatibility_evidence }}
      rollback_eligible: ${{ steps.request.outputs.rollback_eligible }}
      deployment_mode: ${{ steps.request.outputs.deployment_mode }}
      release_run_id: ${{ steps.request.outputs.release_run_id }}
    steps:
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Resolve strict checkpoint request
        id: request
        shell: bash
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, re, sys
          output_path = pathlib.Path(sys.argv[1])
          body = os.environ["REQUEST_BODY"]
          prefix = "V3-CHECKPOINT "
          if not body.startswith(prefix):
              raise SystemExit("checkpoint request prefix is invalid")
          payload = body[len(prefix):]
          if "\n" in payload or "\r" in payload:
              raise SystemExit("checkpoint request must be a single line")
          data = json.loads(payload)
          if not isinstance(data, dict):
              raise SystemExit("request must be a JSON object")
          op = data.get("operation")
          values = {
              "operation": "",
              "source_sha": "",
              "compatibility_evidence": "",
              "rollback_eligible": "false",
              "deployment_mode": "",
              "release_run_id": "",
          }
          if op == "provision":
              if set(data) != {"operation"}:
                  raise SystemExit("provision request has unsupported keys")
              values["operation"] = op
          elif op == "release":
              expected = {"operation", "source_sha", "compatibility_evidence", "rollback_eligible"}
              if set(data) != expected:
                  raise SystemExit("release request keys are invalid")
              source = data["source_sha"]
              evidence = data["compatibility_evidence"]
              eligible = data["rollback_eligible"]
              if not isinstance(source, str) or re.fullmatch(r"[0-9a-f]{40}", source) is None:
                  raise SystemExit("source_sha is invalid")
              if not isinstance(evidence, str) or re.fullmatch(r"[A-Za-z0-9._:/#-]{1,160}", evidence) is None:
                  raise SystemExit("compatibility_evidence is invalid")
              if eligible is not True:
                  raise SystemExit("checkpoint release must be rollback eligible")
              values.update(
                  operation=op,
                  source_sha=source,
                  compatibility_evidence=evidence,
                  rollback_eligible="true",
              )
          elif op == "deploy":
              expected = {"operation", "deployment_mode", "release_run_id"}
              if set(data) != expected:
                  raise SystemExit("deploy request keys are invalid")
              mode = data["deployment_mode"]
              run_id = data["release_run_id"]
              if mode not in {"bootstrap", "upgrade"}:
                  raise SystemExit("deployment_mode is invalid")
              if not isinstance(run_id, str) or re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None:
                  raise SystemExit("release_run_id is invalid")
              values.update(operation=op, deployment_mode=mode, release_run_id=run_id)
          else:
              raise SystemExit("unsupported checkpoint operation")
          with output_path.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

  prepare-provision:
    needs: resolve
    if: needs.resolve.outputs.operation == 'provision' && github.ref == 'refs/heads/main' && github.repository == 'brianstewart377-rgb/ed-finder'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.bundle-artifact.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    steps:
      - name: Checkout exact trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Seal exact source provisioning bundle off-host
        id: bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/operator/v3_checkpoint_bundle.py provision --source "$SOURCE_SHA" --output "$RUNNER_TEMP/operation.tar"
      - name: Upload sealed provisioning bundle
        id: bundle-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkpoint-provision-operation
          path: ${{ runner.temp }}/operation.tar
          if-no-files-found: error
          retention-days: 1

  provision:
    needs: prepare-provision
    if: github.ref == 'refs/heads/main' && github.repository == 'brianstewart377-rgb/ed-finder'
    runs-on: [self-hosted, Linux, X64, codex]
    environment: v3-live-checkpoint
    permissions:
      actions: read
      contents: read
    concurrency:
      group: v3-application-live-checkpoint-deploy
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - name: Execute sealed provision bundle without a worktree
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.prepare-provision.outputs.artifact_id }}
          BUNDLE_SHA: ${{ needs.prepare-provision.outputs.bundle_sha256 }}
          SOURCE_SHA: ${{ github.sha }}
          OPERATION: provision
          RECEIPT: ${{ runner.temp }}/v3-live-checkpoint-authority-candidate.json
        run: |
          set -euo pipefail
          # Only this workflow-owned bootstrap runs here. No checkout, cached action code,
          # git objects or toolcache interpreter is executed with host privileges.
          printf '%s' "$GH_TOKEN" | /usr/bin/sudo -n /usr/bin/env -i \
            PATH=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/python3 -I -c '"""Workflow-embedded bootstrap: no code is loaded from a runner worktree.

          Uses the root-owned OS Python solely to authenticate/unpack the operation bundle.
          The provisioner installs, and the canonical deployer requires, CPython 3.14.
          """
          import hashlib
          import io
          import json
          import os
          import re
          import socket
          import subprocess
          import sys
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          LIMIT = 64 * 1024 * 1024
          REPOSITORY = "brianstewart377-rgb/ed-finder"
          ENTRY = "scripts/operator/actions/v3-live-checkpoint-local.sh"
          PATH = "/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def unpack_bundle(envelope, digest, directory):
              require(len(envelope) <= LIMIT, "oversized artifact")
              with zipfile.ZipFile(io.BytesIO(envelope)) as archive:
                  require(archive.namelist() == ["operation.tar"], "unexpected artifact members")
                  require(archive.getinfo("operation.tar").file_size <= LIMIT, "oversized bundle")
                  payload = archive.read("operation.tar")
              require(hashlib.sha256(payload).hexdigest() == digest, "bundle checksum mismatch")
              seen = set()
              total = 0
              with tarfile.open(fileobj=io.BytesIO(payload), mode="r:") as archive:
                  for member in archive:
                      name = PurePosixPath(member.name)
                      require(not name.is_absolute() and ".." not in name.parts,
                              "unsafe bundle path")
                      require(str(name) not in seen, "duplicate bundle member")
                      seen.add(str(name))
                      require(member.isdir() or member.isfile(), "non-regular bundle member")
                      target = directory.joinpath(*name.parts)
                      if member.isdir():
                          target.mkdir(parents=True, exist_ok=True, mode=0o755)
                          continue
                      total += member.size
                      require(0 <= member.size <= LIMIT and total <= LIMIT, "oversized bundle contents")
                      target.parent.mkdir(parents=True, exist_ok=True, mode=0o755)
                      # Parent is root-created and cannot be written by any coding worker.
                      with target.open("xb") as output:
                          output.write(archive.extractfile(member).read())
                      target.chmod(0o755 if member.mode & 0o111 else 0o644)
              require(ENTRY in seen and "operation.json" in seen, "incomplete operation bundle")


          def main():
              artifact, digest, source, operation = sys.argv[1:]
              require(os.geteuid() == 0, "root bootstrap required")
              require(re.fullmatch(r"[1-9][0-9]{0,19}", artifact), "invalid artifact id")
              require(re.fullmatch(r"[0-9a-f]{64}", digest), "invalid bundle digest")
              require(re.fullmatch(r"[0-9a-f]{40}", source), "invalid source identity")
              require(operation in ("provision", "deploy"), "invalid operation")
              require(os.uname().nodename.split(".")[0] == "vmi3542235"
                      and os.uname().machine == "x86_64"
                      and socket.getfqdn() == "vmi3542235.contaboserver.net", "unexpected checkpoint host")
              os.umask(0o022)
              token = sys.stdin.read(8193)
              require(0 < len(token) <= 8192 and not any(c.isspace() for c in token),
                      "invalid artifact token")
              # No inherited proxy, curl configuration, CA override, PATH or Python imports.
              # curl strips Authorization on a cross-host redirect; never use location-trusted.
              response = subprocess.run([
                  "/usr/bin/curl", "--disable", "--silent", "--show-error", "--fail",
                  "--location", "--proto", "=https", "--proto-redir", "=https",
                  "--noproxy", "*", "--connect-timeout", "10", "--max-time", "120",
                  "--max-filesize", str(LIMIT), "--header", "@-",
                  f"https://api.github.com/repos/{REPOSITORY}/actions/artifacts/{artifact}/zip",
              ], input=f"Authorization: Bearer {token}\n".encode(), stdout=subprocess.PIPE,
                 stderr=subprocess.DEVNULL, env={"PATH": PATH}, timeout=130, check=True)
              # /run is root-owned; the private parent stays non-writable by the runner.
              with tempfile.TemporaryDirectory(prefix="edfinder-v3-", dir="/run") as temporary:
                  directory = Path(temporary)
                  unpack_bundle(response.stdout, digest, directory)
                  request = json.loads((directory / "operation.json").read_text())
                  require(request.get("source_sha") == source and request.get("operation") == operation,
                          "operation bundle identity mismatch")
                  # Code and public manifests may be read, never modified, by the non-root
                  # canonical deployer and the postgres seed process.
                  directory.chmod(0o755)
                  environment = {"PATH": PATH, "HOME": "/root", "LANG": "C", "LC_ALL": "C"}
                  if operation == "deploy":
                      environment["GHCR_TOKEN"] = token
                  return subprocess.run(["/bin/bash", ENTRY], cwd=directory,
                                        env=environment, check=False).returncode


          if __name__ == "__main__":
              try:
                  result = main()
              except (OSError, ValueError, KeyError, tarfile.TarError, zipfile.BadZipFile,
                      subprocess.SubprocessError):
                  print("Checkpoint immutable bootstrap stopped; no unverified bundle executed", file=sys.stderr)
                  result = 78
              raise SystemExit(result)
          ' \
            "$ARTIFACT_ID" "$BUNDLE_SHA" "$SOURCE_SHA" "$OPERATION" > "$RECEIPT"
      - name: Upload v3-live-checkpoint-authority-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v3-live-checkpoint-authority-candidate
          path: ${{ runner.temp }}/v3-live-checkpoint-authority-candidate.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: resolve
    if: needs.resolve.outputs.operation == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Dispatch canonical immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          EVIDENCE: ${{ needs.resolve.outputs.compatibility_evidence }}
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "source_sha": os.environ["SOURCE_SHA"],
                  "schema_compatibility": "exact",
                  "compatibility_evidence": os.environ["EVIDENCE"],
                  "reviewed_compatible_migration_sets": "",
                  "rollback_eligible": True,
              },
          }))
          PY
          )"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/release-response" --write-out '%{http_code}' \
            --request POST --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/v3-application-release.yml/dispatches" \
            --data "$payload")"
          [ "$code" = 204 ] || { echo "Release dispatch failed with HTTP $code" >&2; cat "$RUNNER_TEMP/release-response" >&2; exit 68; }
          echo "Canonical immutable release dispatch accepted for $SOURCE_SHA"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Dispatch canonical live-checkpoint deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_MODE: ${{ needs.resolve.outputs.deployment_mode }}
          RELEASE_RUN_ID: ${{ needs.resolve.outputs.release_run_id }}
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "deployment_mode": os.environ["DEPLOYMENT_MODE"],
                  "release_run_id": os.environ["RELEASE_RUN_ID"],
              },
          }))
          PY
          )"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/deploy-response" --write-out '%{http_code}' \
            --request POST --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/v3-application-live-checkpoint-preflight.yml/dispatches" \
            --data "$payload")"
          [ "$code" = 204 ] || { echo "Deploy dispatch failed with HTTP $code" >&2; cat "$RUNNER_TEMP/deploy-response" >&2; exit 68; }
          echo "Canonical $DEPLOYMENT_MODE deploy dispatch accepted for release run $RELEASE_RUN_ID"
