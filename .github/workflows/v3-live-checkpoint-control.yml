name: V3 live-checkpoint control
run-name: V3 checkpoint control · ${{ github.sha }}

on:
  push:
    branches:
      - v3-live-checkpoint-requests
    paths:
      - '.github/v3-live-checkpoint-requests/*.json'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.request.outputs.operation }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      compatibility_evidence: ${{ steps.request.outputs.compatibility_evidence }}
      rollback_eligible: ${{ steps.request.outputs.rollback_eligible }}
      deployment_mode: ${{ steps.request.outputs.deployment_mode }}
      release_run_id: ${{ steps.request.outputs.release_run_id }}
    steps:
      - name: Checkout request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Resolve strict checkpoint request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- '.github/v3-live-checkpoint-requests/*.json')
          [ "${#files[@]}" -eq 1 ] || { echo "Expected exactly one checkpoint request file" >&2; exit 64; }
          python - "${files[0]}" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request_path, output_path = map(pathlib.Path, sys.argv[1:])
          data = json.loads(request_path.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("request must be a JSON object")
          op = data.get("operation")
          values = {
              "operation": "",
              "source_sha": "",
              "compatibility_evidence": "",
              "rollback_eligible": "false",
              "deployment_mode": "",
              "release_run_id": "",
          }
          if op == "provision":
              if set(data) != {"operation"}:
                  raise SystemExit("provision request has unsupported keys")
              values["operation"] = op
          elif op == "release":
              expected = {"operation", "source_sha", "compatibility_evidence", "rollback_eligible"}
              if set(data) != expected:
                  raise SystemExit("release request keys are invalid")
              source = data["source_sha"]
              evidence = data["compatibility_evidence"]
              eligible = data["rollback_eligible"]
              if not isinstance(source, str) or re.fullmatch(r"[0-9a-f]{40}", source) is None:
                  raise SystemExit("source_sha is invalid")
              if not isinstance(evidence, str) or re.fullmatch(r"[A-Za-z0-9._:/#-]{1,160}", evidence) is None:
                  raise SystemExit("compatibility_evidence is invalid")
              if eligible is not True:
                  raise SystemExit("first checkpoint release must be rollback eligible")
              values.update(operation=op, source_sha=source, compatibility_evidence=evidence, rollback_eligible="true")
          elif op == "deploy":
              expected = {"operation", "deployment_mode", "release_run_id"}
              if set(data) != expected:
                  raise SystemExit("deploy request keys are invalid")
              mode = data["deployment_mode"]
              run_id = data["release_run_id"]
              if mode not in {"bootstrap", "upgrade"}:
                  raise SystemExit("deployment_mode is invalid")
              if not isinstance(run_id, str) or re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None:
                  raise SystemExit("release_run_id is invalid")
              values.update(operation=op, deployment_mode=mode, release_run_id=run_id)
          else:
              raise SystemExit("unsupported checkpoint operation")
          with output_path.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

  provision:
    needs: resolve
    if: needs.resolve.outputs.operation == 'provision'
    runs-on: ubuntu-24.04
    environment: v3-live-checkpoint
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Prepare pinned Contabo SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.V3_LIVE_CHECKPOINT_SSH_KEY }}
          SSH_HOST: ${{ secrets.V3_LIVE_CHECKPOINT_HOST }}
          SSH_PORT: ${{ secrets.V3_LIVE_CHECKPOINT_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.V3_LIVE_CHECKPOINT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "Missing V3_LIVE_CHECKPOINT_SSH_KEY" >&2; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing V3_LIVE_CHECKPOINT_HOST" >&2; exit 1; }
          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && [ "$SSH_PORT" -le 65535 ] || { echo "Invalid V3_LIVE_CHECKPOINT_PORT" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing pinned live-checkpoint known-hosts secret" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/v3_live_checkpoint_key
          chmod 600 ~/.ssh/v3_live_checkpoint_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then known_host_lookup="$SSH_HOST"; else known_host_lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$known_host_lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo "Pinned known-host trust does not cover configured checkpoint host" >&2
            exit 1
          }
      - name: Assemble source-free provisioning bundle
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/v3-checkpoint-provision
        run: |
          set -euo pipefail
          install -d -m 700 "$BUNDLE/scripts/operator/actions" "$BUNDLE/scripts" "$BUNDLE/sql" "$BUNDLE/deploy/v3-live-checkpoint"
          install -m 700 scripts/operator/actions/v3-live-checkpoint-provision.sh "$BUNDLE/scripts/operator/actions/"
          install -m 700 scripts/apply_migrations.sh scripts/seed_check.sh "$BUNDLE/scripts/"
          cp -a sql/. "$BUNDLE/sql/"
          install -m 600 deploy/v3-live-checkpoint/target-authority.json "$BUNDLE/deploy/v3-live-checkpoint/"
          chmod -R a+rX "$BUNDLE"
      - name: Provision persistent Contabo checkpoint infrastructure
        shell: bash
        env:
          SSH_HOST: ${{ secrets.V3_LIVE_CHECKPOINT_HOST }}
          SSH_PORT: ${{ secrets.V3_LIVE_CHECKPOINT_PORT }}
          SSH_USER: ${{ secrets.V3_LIVE_CHECKPOINT_USER }}
          BUNDLE: ${{ runner.temp }}/v3-checkpoint-provision
          CANDIDATE: ${{ runner.temp }}/v3-live-checkpoint-authority-candidate.json
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "Missing V3_LIVE_CHECKPOINT_USER" >&2; exit 1; }
          tar -C "$BUNDLE" -cf - . | ssh -i ~/.ssh/v3_live_checkpoint_key \
            -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts "$SSH_USER@$SSH_HOST" \
            'set -eu; umask 077; uid="$(id -u)"; gid="$(id -g)"; user="$(id -un)"; work="$(mktemp -d)"; trap '\''rm -rf -- "$work"'\'' EXIT HUP INT TERM; chmod 755 "$work"; tar -xf - -C "$work"; chmod -R a+rX "$work"; cd "$work"; sudo -n env CHECKPOINT_OPERATOR_UID="$uid" CHECKPOINT_OPERATOR_GID="$gid" CHECKPOINT_OPERATOR_USER="$user" bash scripts/operator/actions/v3-live-checkpoint-provision.sh' \
            > "$CANDIDATE"
          python -m json.tool "$CANDIDATE" >/dev/null
          python - "$CANDIDATE" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["status"] == "authorized"
          assert value["target"]["production"] is False
          assert value["target"]["hostname"] == "vmi3542235"
          assert value["blockers"] == []
          print("Contabo checkpoint provisioning produced an authorized sanitized candidate.")
          PY
      - name: Upload sanitized authority candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v3-live-checkpoint-authority-candidate
          path: ${{ runner.temp }}/v3-live-checkpoint-authority-candidate.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: resolve
    if: needs.resolve.outputs.operation == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch canonical immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          EVIDENCE: ${{ needs.resolve.outputs.compatibility_evidence }}
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "source_sha": os.environ["SOURCE_SHA"],
                  "schema_compatibility": "exact",
                  "compatibility_evidence": os.environ["EVIDENCE"],
                  "reviewed_compatible_migration_sets": "",
                  "rollback_eligible": True,
              },
          }))
          PY
          )"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/release-response" --write-out '%{http_code}' \
            --request POST --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/v3-application-release.yml/dispatches" \
            --data "$payload")"
          [ "$code" = 204 ] || { echo "Release dispatch failed with HTTP $code" >&2; cat "$RUNNER_TEMP/release-response" >&2; exit 68; }
          echo "Canonical immutable release dispatch accepted for $SOURCE_SHA"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch canonical live-checkpoint deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_MODE: ${{ needs.resolve.outputs.deployment_mode }}
          RELEASE_RUN_ID: ${{ needs.resolve.outputs.release_run_id }}
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "deployment_mode": os.environ["DEPLOYMENT_MODE"],
                  "release_run_id": os.environ["RELEASE_RUN_ID"],
              },
          }))
          PY
          )"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/deploy-response" --write-out '%{http_code}' \
            --request POST --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/v3-application-live-checkpoint-preflight.yml/dispatches" \
            --data "$payload")"
          [ "$code" = 204 ] || { echo "Deploy dispatch failed with HTTP $code" >&2; cat "$RUNNER_TEMP/deploy-response" >&2; exit 68; }
          echo "Canonical $DEPLOYMENT_MODE deploy dispatch accepted for release run $RELEASE_RUN_ID"
