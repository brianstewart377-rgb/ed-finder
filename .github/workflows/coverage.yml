name: Coverage Tracking

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  backend-coverage:
    name: Backend Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edfinder
          POSTGRES_PASSWORD: edfinder
          POSTGRES_DB: edfinder
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            tests/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt coverage

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://edfinder:edfinder@localhost:5432/edfinder
          REDIS_URL: redis://localhost:6379/0
          CORS_ORIGINS: http://test
          ADMIN_TOKEN: test-admin-token
          LOG_LEVEL: WARNING
        run: |
          coverage run -m pytest tests/ -m "unit or integration or db"
          coverage xml
          coverage report --fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  frontend-coverage:
    name: Frontend Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --no-progress --non-interactive

      - name: Run tests with coverage
        working-directory: frontend
        run: yarn test:ci --coverage --run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  coverage-report:
    name: Coverage Summary
    needs: [backend-coverage, frontend-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check coverage results
        run: |
          echo "## Code Coverage Report"
          echo "- Backend: Check Codecov for detailed results"
          echo "- Frontend: Check Codecov for detailed results"
          echo ""
          echo "View coverage dashboard at: https://codecov.io/gh/${{ github.repository }}"
