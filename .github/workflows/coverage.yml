name: Coverage Tracking

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-coverage:
    name: Backend Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: edfinder
          POSTGRES_PASSWORD: edfinder
          POSTGRES_DB: edfinder
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.14 for V3 application validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned uv and frozen V3 backend test environment
        run: |
          python -m pip install uv==0.11.33
          test "$(python -m uv --version | cut -d' ' -f1-2)" = "uv 0.11.33"
          python -m uv lock --project apps/api --check
          python -m uv sync --project apps/api --frozen --group test --no-install-project

      - name: Assert V3 application runtime identity
        run: apps/api/.venv/bin/python scripts/checks/assert_v3_python_runtime.py

      - name: Apply schema + seed
        env:
          PGPASSWORD: edfinder
          DATABASE_URL: postgresql://edfinder:edfinder@localhost:5432/edfinder
        run: bash scripts/seed_check.sh

      - name: Validate seeded coverage database
        env:
          DATABASE_URL: postgresql://edfinder:edfinder@localhost:5432/edfinder
        run: apps/api/.venv/bin/python scripts/checks/data_invariants.py --target-rating-version 3.4

      - name: Run unit coverage
        env:
          DATABASE_URL: postgresql://edfinder:edfinder@localhost:5432/edfinder
          REDIS_URL: redis://localhost:6379/15
          CORS_ORIGINS: http://test
          ADMIN_TOKEN: test-admin-token
          LOG_LEVEL: WARNING
          EDDN_SIMULATION_INGEST_ENABLED: "false"
          PYTHONPATH: ${{ github.workspace }}/apps/api/src
        run: |
          apps/api/.venv/bin/python -m coverage erase
          apps/api/.venv/bin/python -m coverage run -m pytest \
            --ignore=tests/integration \
            --ignore=tests/test_deploy_main_invariants_gate.py \
            -m "unit or not (integration or db or operator or e2e or slow)" -q

      - name: Append integration coverage
        env:
          DATABASE_URL: postgresql://edfinder:edfinder@localhost:5432/edfinder
          REDIS_URL: redis://localhost:6379/15
          CORS_ORIGINS: http://test
          ADMIN_TOKEN: test-admin-token
          LOG_LEVEL: WARNING
          EDDN_SIMULATION_INGEST_ENABLED: "false"
        run: |
          apps/api/.venv/bin/python -m coverage run --append -m pytest \
            tests/integration/ \
            tests/test_migration_applier_runtime.py \
            tests/test_migration_ledger_baseline_runtime.py \
            -q

      - name: Build backend coverage reports
        if: always()
        run: |
          apps/api/.venv/bin/python -m coverage xml -o coverage.xml
          apps/api/.venv/bin/python -m coverage json -o coverage.json
          apps/api/.venv/bin/python -m coverage report --fail-under=70

      - name: Upload backend coverage to Codecov
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Preserve backend coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.run_attempt }}
          path: |
            coverage.xml
            coverage.json
            .coverage
          if-no-files-found: warn
          retention-days: 7

  frontend-coverage:
    name: Frontend Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --no-progress --non-interactive

      - name: Install pinned Vitest V8 coverage provider
        working-directory: frontend
        # Vitest's coverage provider is an optional package. Keep normal app
        # dependencies frozen, then add the exact provider only to this
        # disposable CI workspace until it is promoted into yarn.lock.
        run: >-
          yarn add --dev --exact --ignore-scripts --no-lockfile --non-interactive
          @vitest/coverage-v8@4.1.10

      - name: Run complete frontend suite with coverage
        working-directory: frontend
        run: |
          node scripts/run-vitest.mjs run \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reporter=text \
            --coverage.reporter=json \
            --coverage.reporter=json-summary \
            --coverage.reporter=lcov \
            --coverage.reportOnFailure \
            --maxWorkers=2

      - name: Upload frontend coverage to Codecov
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Preserve frontend coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-${{ github.run_attempt }}
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 7

  coverage-report:
    name: Coverage Summary
    needs: [backend-coverage, frontend-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Write and enforce coverage result summary
        env:
          BACKEND_RESULT: ${{ needs.backend-coverage.result }}
          FRONTEND_RESULT: ${{ needs.frontend-coverage.result }}
        run: |
          {
            echo "## Code Coverage Report"
            echo "- Backend coverage job: ${BACKEND_RESULT}"
            echo "- Frontend coverage job: ${FRONTEND_RESULT}"
            echo "- Detailed reports are retained as workflow artifacts for 7 days."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Coverage pipeline failed: backend=${BACKEND_RESULT}, frontend=${FRONTEND_RESULT}"
            exit 1
          fi
