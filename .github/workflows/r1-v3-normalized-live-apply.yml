name: R1 V3 Normalized Live Structural Apply

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/r1-v3-normalized-live-apply-requests/2026-08-31-authorized.json'

permissions:
  contents: read

concurrency:
  group: r1-v3-normalized-live-structural
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate exact authorised request and migration blob
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || { echo 'Expected exactly one live-apply request change' >&2; exit 64; }
          [ "${changed[0]}" = '.github/r1-v3-normalized-live-apply-requests/2026-08-31-authorized.json' ] || {
            echo 'Changed path is not the exact authorised live-apply request' >&2; exit 64;
          }
          python3 - "${changed[0]}" <<'PY'
          import json, pathlib, sys
          expected={
            'operation':'r1-v3-normalized-live-structural-apply',
            'authorization':'user-authorised-2026-08-31',
            'migration_name':'r1_v3/001_structural_shell.sql',
            'migration_commit':'3978b071d7f98b320c146e58a20b66c7f2845f86',
            'migration_blob_sha':'26d1ef3d4ae343159ba62281102f2143ccff7fb8',
          }
          data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if data != expected:
              raise SystemExit(f'Unsupported live-apply request: {data!r}')
          PY
          actual_blob="$(git hash-object sql/r1_v3/001_structural_shell.sql)"
          [ "$actual_blob" = '26d1ef3d4ae343159ba62281102f2143ccff7fb8' ] || {
            echo "STOP: migration blob mismatch: $actual_blob" >&2; exit 1;
          }
          migration_sha256="$(sha256sum sql/r1_v3/001_structural_shell.sql | awk '{print $1}')"
          [[ "$migration_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo 'STOP: invalid migration sha256' >&2; exit 1; }
          echo "migration_blob_verified=$actual_blob"
          echo "migration_sha256=$migration_sha256"
          echo "migration_sha256=$migration_sha256" >> "$GITHUB_OUTPUT"

      - name: Build atomic apply transaction
        id: applyfile
        shell: bash
        env:
          MIGRATION_SHA256: ${{ steps.migration.outputs.migration_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          source=Path('sql/r1_v3/001_structural_shell.sql').read_text(encoding='utf-8')
          if not source.startswith('BEGIN;\n'):
              raise SystemExit('STOP: migration no longer begins with BEGIN;')
          stripped=source.rstrip()
          if not stripped.endswith('COMMIT;'):
              raise SystemExit('STOP: migration no longer ends with COMMIT;')
          body=stripped[:-len('COMMIT;')].rstrip()
          sha=os.environ['MIGRATION_SHA256']
          prelude="""BEGIN;
SET LOCAL lock_timeout = '5s';
SET LOCAL statement_timeout = '60s';
LOCK TABLE v3_meta.schema_migration IN SHARE ROW EXCLUSIVE MODE;
DO $$
BEGIN
  IF EXISTS (SELECT 1 FROM v3_meta.schema_migration WHERE migration_name = 'r1_v3/001_structural_shell.sql') THEN
    RAISE EXCEPTION 'R1 structural migration is already ledgered';
  END IF;
  IF EXISTS (SELECT 1 FROM pg_namespace WHERE nspname IN ('r1_meta','r1_cache','r1_plan')) THEN
    RAISE EXCEPTION 'R1 schema already exists; refusing partial/repeated apply';
  END IF;
END
$$;
"""
          original_without_begin=body[len('BEGIN;\n'):]
          ledger=f"""

INSERT INTO v3_meta.schema_migration (migration_name, migration_sha256)
VALUES ('r1_v3/001_structural_shell.sql', decode('{sha}', 'hex'));
COMMIT;
"""
          Path('r1-v3-live-atomic-apply.sql').write_text(prelude+original_without_begin+ledger,encoding='utf-8')
          PY
          apply_sha256="$(sha256sum r1-v3-live-atomic-apply.sql | awk '{print $1}')"
          [[ "$apply_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo 'STOP: invalid atomic apply sha256' >&2; exit 1; }
          echo "atomic_apply_sha256=$apply_sha256"
          echo "apply_sha256=$apply_sha256" >> "$GITHUB_OUTPUT"

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"; test -n "$SSH_HOST"; test -n "$SSH_PORT"; test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key; chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null || { echo 'Pinned host trust mismatch' >&2; exit 1; }

      - name: Upload atomic transaction to operator temp path
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"
          scp -i ~/.ssh/ed_new_operator_key -P "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            r1-v3-live-atomic-apply.sql \
            "$SSH_USER@$SSH_HOST:/tmp/r1-v3-live-atomic-apply-${{ github.run_id }}.sql"

      - name: Apply atomically and verify retained normalized V3
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          MIGRATION_SHA256: ${{ steps.migration.outputs.migration_sha256 }}
          APPLY_SHA256: ${{ steps.applyfile.outputs.apply_sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "MIGRATION_SHA256='$MIGRATION_SHA256' APPLY_SHA256='$APPLY_SHA256' RUN_ID='$RUN_ID' python3 -" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys

          container='edfinder-v3-phase4c-full-20260827_r5-postgres'
          database='edfinder_v3_phase4c_full_20260827_r5'
          migration_name='r1_v3/001_structural_shell.sql'
          apply_path=pathlib.Path(f"/tmp/r1-v3-live-atomic-apply-{os.environ['RUN_ID']}.sql")
          try:
              data=apply_path.read_bytes()
              actual_apply=hashlib.sha256(data).hexdigest()
              if actual_apply != os.environ['APPLY_SHA256']:
                  raise SystemExit(f'STOP: uploaded atomic apply hash mismatch: {actual_apply}')
              print('uploaded_atomic_apply_sha256_verified:', actual_apply)

              inspect=json.loads(subprocess.check_output(['docker','inspect',container],text=True))[0]
              if not inspect.get('State',{}).get('Running'):
                  raise SystemExit('STOP: normalized V3 container is not running')
              env={}
              for item in inspect.get('Config',{}).get('Env',[]):
                  if '=' in item:
                      k,v=item.split('=',1); env[k]=v
              user=env.get('POSTGRES_USER') or 'postgres'
              password=env.get('POSTGRES_PASSWORD') or ''
              base=['docker','exec']
              if password: base += ['-e',f'PGPASSWORD={password}']
              psql_base=base+[container,'psql','-h','127.0.0.1','-U',user,'-d',database,'-v','ON_ERROR_STOP=1','-At','-F','|']

              def query(sql, readonly=True):
                  wrapped=('BEGIN READ ONLY; '+sql+'; COMMIT;') if readonly else sql
                  lines=subprocess.check_output(psql_base+['-c',wrapped],text=True,stderr=subprocess.STDOUT).splitlines()
                  return [x for x in lines if x not in ('BEGIN','COMMIT')]

              ident=query("SELECT current_database(),current_user,pg_is_in_recovery(),pg_size_pretty(pg_database_size(current_database()))")
              print('pre_apply_target_identity:', ident)
              if len(ident)!=1 or not ident[0].startswith(database+'|edfinder_v3|f|'):
                  raise SystemExit('STOP: target identity mismatch')

              required=query("SELECT to_regclass('v3_meta.canonical_generation')::text,to_regclass('v3_identity.account')::text,to_regclass('v3_meta.schema_migration')::text")
              if required != ['v3_meta.canonical_generation|v3_identity.account|v3_meta.schema_migration']:
                  raise SystemExit('STOP: normalized V3 authority relation mismatch')

              authority_types=set(query("""
                SELECT n.nspname,c.relname,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull
                FROM pg_attribute a JOIN pg_class c ON c.oid=a.attrelid JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE a.attnum>0 AND NOT a.attisdropped AND (
                  (n.nspname='v3_identity' AND c.relname='account' AND a.attname='account_id') OR
                  (n.nspname='v3_meta' AND c.relname='canonical_generation' AND a.attname='generation_id'))
                ORDER BY n.nspname,c.relname,a.attname
              """))
              expected_types={'v3_identity|account|account_id|uuid|t','v3_meta|canonical_generation|generation_id|uuid|t'}
              if authority_types != expected_types:
                  raise SystemExit(f'STOP: authority type mismatch: {authority_types!r}')

              ledger_columns=query("""
                SELECT a.attnum,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull
                FROM pg_attribute a JOIN pg_class c ON c.oid=a.attrelid JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='v3_meta' AND c.relname='schema_migration' AND a.attnum>0 AND NOT a.attisdropped
                ORDER BY a.attnum
              """)
              if ledger_columns != ['1|migration_name|text|t','2|migration_sha256|bytea|t','3|applied_at|timestamp with time zone|t']:
                  raise SystemExit(f'STOP: migration ledger shape mismatch: {ledger_columns!r}')

              schemas_before=query("SELECT nspname FROM pg_namespace WHERE nspname IN ('r1_meta','r1_cache','r1_plan') ORDER BY nspname")
              if schemas_before:
                  raise SystemExit(f'STOP: R1 schemas already exist: {schemas_before!r}')
              ledger_existing=query("SELECT count(*) FROM v3_meta.schema_migration WHERE migration_name='r1_v3/001_structural_shell.sql'")
              if ledger_existing != ['0']:
                  raise SystemExit('STOP: R1 migration is already ledgered')

              canonical_before=query("SELECT count(*) FROM v3_meta.canonical_generation")[0]
              accounts_before=query("SELECT count(*) FROM v3_identity.account")[0]
              ledger_before=int(query("SELECT count(*) FROM v3_meta.schema_migration")[0])
              print('pre_apply_counts:', {'canonical_generation':canonical_before,'account':accounts_before,'schema_migration':ledger_before})

              proc=subprocess.run(psql_base[:-2], input=data, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              output=proc.stdout.decode('utf-8','replace')
              if proc.returncode != 0:
                  print(output)
                  raise SystemExit(f'STOP: atomic migration failed with exit code {proc.returncode}; transaction rolled back')
              print('atomic_apply_psql_result: success')

              schemas_after=query("SELECT nspname FROM pg_namespace WHERE nspname IN ('r1_meta','r1_cache','r1_plan') ORDER BY nspname")
              if schemas_after != ['r1_cache','r1_meta','r1_plan']:
                  raise SystemExit(f'STOP: post-apply R1 schema set mismatch: {schemas_after!r}')

              ledger_row=query("SELECT migration_name,encode(migration_sha256,'hex') FROM v3_meta.schema_migration WHERE migration_name='r1_v3/001_structural_shell.sql'")
              expected_ledger=[migration_name+'|'+os.environ['MIGRATION_SHA256']]
              if ledger_row != expected_ledger:
                  raise SystemExit(f'STOP: post-apply ledger row mismatch: {ledger_row!r}')

              canonical_after=query("SELECT count(*) FROM v3_meta.canonical_generation")[0]
              accounts_after=query("SELECT count(*) FROM v3_identity.account")[0]
              ledger_after=int(query("SELECT count(*) FROM v3_meta.schema_migration")[0])
              if canonical_after != canonical_before or accounts_after != accounts_before:
                  raise SystemExit('STOP: upstream V3 row counts changed unexpectedly')
              if ledger_after != ledger_before + 1:
                  raise SystemExit(f'STOP: ledger count did not increase by exactly one: {ledger_before}->{ledger_after}')

              expected_relations={
                'r1_cache|system_capability_current|v',
                'r1_meta|capability_generation|r',
                'r1_meta|current_capability_generation|r',
                'r1_meta|mechanics_revision|r',
                'r1_meta|model_revision|r',
                'r1_meta|programme_revision|r',
                'r1_plan|plan_allocation|r',
                'r1_plan|plan_assessment|r',
                'r1_plan|plan_node|r',
                'r1_plan|plan_revision|r',
                'r1_plan|saved_plan|r',
              }
              relations=set(query("""
                SELECT n.nspname,c.relname,c.relkind
                FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname IN ('r1_meta','r1_cache','r1_plan') AND c.relkind IN ('r','v')
                ORDER BY n.nspname,c.relname
              """))
              if relations != expected_relations:
                  raise SystemExit(f'STOP: post-apply R1 relation set mismatch: {sorted(relations)!r}')

              zero_tables=['r1_meta.mechanics_revision','r1_meta.model_revision','r1_meta.programme_revision','r1_meta.capability_generation','r1_meta.current_capability_generation','r1_plan.saved_plan','r1_plan.plan_revision','r1_plan.plan_node','r1_plan.plan_allocation','r1_plan.plan_assessment','r1_cache.system_capability_current']
              for relation in zero_tables:
                  value=query(f'SELECT count(*) FROM {relation}')[0]
                  if value != '0':
                      raise SystemExit(f'STOP: expected zero rows in {relation}, got {value}')
              cap_schemas=query("SELECT nspname FROM pg_namespace WHERE nspname LIKE 'r1_cap_%' ORDER BY nspname")
              if cap_schemas:
                  raise SystemExit(f'STOP: capability physical schema unexpectedly exists: {cap_schemas!r}')

              print('post_apply_counts:', {'canonical_generation':canonical_after,'account':accounts_after,'schema_migration':ledger_after})
              print('post_apply_r1_schemas:', schemas_after)
              print('post_apply_relation_count:', len(relations))
              print('post_apply_all_r1_rows_zero: true')
              print('capability_generation_built: false')
              print('finder_cutover_performed: false')
              print('legacy_or_v3_data_deleted: false')
              print('live_structural_apply_result: passed')
          finally:
              try:
                  apply_path.unlink(missing_ok=True)
              except Exception as exc:
                  print('warning: could not remove temp apply file:', type(exc).__name__, file=sys.stderr)
          PY
