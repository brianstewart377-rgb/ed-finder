name: R1 V3 Normalized Live Structural Apply

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/r1-v3-normalized-live-apply-requests/2026-08-31-authorized.json'

permissions:
  contents: read

concurrency:
  group: r1-v3-normalized-live-structural
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Checkout authorised branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate exact authorisation and pinned migration
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || { echo 'Expected exactly one live-apply request change' >&2; exit 64; }
          [ "${changed[0]}" = '.github/r1-v3-normalized-live-apply-requests/2026-08-31-authorized.json' ] || { echo 'Unexpected changed path' >&2; exit 64; }
          python3 - "${changed[0]}" <<'PY'
          import json, pathlib, sys
          expected = {
              'operation': 'r1-v3-normalized-live-structural-apply',
              'authorization': 'user-authorised-2026-08-31',
              'migration_name': 'r1_v3/001_structural_shell.sql',
              'migration_commit': '3978b071d7f98b320c146e58a20b66c7f2845f86',
              'migration_blob_sha': '26d1ef3d4ae343159ba62281102f2143ccff7fb8',
          }
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if data != expected:
              raise SystemExit(f'Unsupported live-apply request: {data!r}')
          PY
          actual_blob="$(git hash-object sql/r1_v3/001_structural_shell.sql)"
          [ "$actual_blob" = '26d1ef3d4ae343159ba62281102f2143ccff7fb8' ] || { echo "STOP: migration blob mismatch: $actual_blob" >&2; exit 1; }
          python3 -m py_compile \
            scripts/operator/actions/r1_v3_normalized_live_structural_apply.py \
            scripts/operator/actions/r1_v3_normalized_live_structural_apply_v2.py
          migration_sha256="$(sha256sum sql/r1_v3/001_structural_shell.sql | awk '{print $1}')"
          [[ "$migration_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo 'STOP: invalid migration SHA256' >&2; exit 1; }
          echo "migration_blob_verified=$actual_blob"
          echo "migration_sha256=$migration_sha256"
          echo "migration_sha256=$migration_sha256" >> "$GITHUB_OUTPUT"

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"; test -n "$SSH_HOST"; test -n "$SSH_PORT"; test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key
          chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null || { echo 'Pinned host trust mismatch' >&2; exit 1; }

      - name: Upload exact migration and one-shot operator
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"
          common_scp=(-i ~/.ssh/ed_new_operator_key -P "$SSH_PORT" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes)
          scp "${common_scp[@]}" sql/r1_v3/001_structural_shell.sql "$SSH_USER@$SSH_HOST:/tmp/r1-v3-structural-$RUN_ID.sql"
          scp "${common_scp[@]}" scripts/operator/actions/r1_v3_normalized_live_structural_apply.py "$SSH_USER@$SSH_HOST:/tmp/r1_v3_normalized_live_structural_apply.py"
          scp "${common_scp[@]}" scripts/operator/actions/r1_v3_normalized_live_structural_apply_v2.py "$SSH_USER@$SSH_HOST:/tmp/r1-v3-structural-$RUN_ID.py"

      - name: Apply atomic R1 structural shell and verify
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
          MIGRATION_SHA256: ${{ steps.migration.outputs.migration_sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; trap 'rm -f /tmp/r1-v3-structural-$RUN_ID.sql /tmp/r1-v3-structural-$RUN_ID.py /tmp/r1_v3_normalized_live_structural_apply.py' EXIT; MIGRATION_SHA256='$MIGRATION_SHA256' python3 /tmp/r1-v3-structural-$RUN_ID.py /tmp/r1-v3-structural-$RUN_ID.sql"
