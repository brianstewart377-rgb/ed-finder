name: ed-new V3 Relation Inventory

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-v3-inventory-requests/*.json'

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory retained V3 database relations
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-v3-inventory-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json, pathlib, sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {"operation":"inventory-v3-relations"}:
              raise SystemExit(64)
          PY

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ed_new_operator_key; chmod 600 ~/.ssh/ed_new_operator_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null

      - name: Inventory schemas and largest relations
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ed_new_operator_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json, subprocess
          container='edfinder-v3-phase4c-full-20260827_r5-postgres'
          database='edfinder_v3_phase4c_full_20260827_r5'
          inspect=json.loads(subprocess.check_output(['docker','inspect',container], text=True))[0]
          env={}
          for item in inspect.get('Config',{}).get('Env',[]):
              if '=' in item:
                  k,v=item.split('=',1); env[k]=v
          user=env.get('POSTGRES_USER') or 'postgres'
          password=env.get('POSTGRES_PASSWORD') or ''
          base=['docker','exec']
          if password: base += ['-e',f'PGPASSWORD={password}']
          base += [container,'psql','-h','127.0.0.1','-U',user,'-d',database,'-X','-At','-F','|']

          def q(sql):
              return subprocess.check_output(base+['-c',sql], text=True).strip()

          print('== DATABASE ==')
          print(q("SELECT current_database()||'|'||pg_database_size(current_database())"))
          print('== NONSYSTEM SCHEMAS ==')
          print(q("SELECT nspname FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname <> 'information_schema' ORDER BY nspname"))
          print('== SYSTEMS/RATINGS NAMED RELATIONS ACROSS SCHEMAS ==')
          print(q("SELECT n.nspname,c.relname,c.relkind,pg_total_relation_size(c.oid) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relname IN ('systems','ratings','bodies','stations','body_rings','app_users','web_sessions','oauth_login_states','schema_migrations') ORDER BY pg_total_relation_size(c.oid) DESC"))
          print('== TOP 50 USER RELATIONS BY SIZE ==')
          print(q("SELECT n.nspname,c.relname,c.relkind,pg_total_relation_size(c.oid) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname NOT LIKE 'pg_%' AND n.nspname <> 'information_schema' AND c.relkind IN ('r','p','m') ORDER BY pg_total_relation_size(c.oid) DESC LIMIT 50"))
          print('== TABLE COUNTS BY SCHEMA ==')
          print(q("SELECT n.nspname,count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname NOT LIKE 'pg_%' AND n.nspname <> 'information_schema' AND c.relkind IN ('r','p','m') GROUP BY n.nspname ORDER BY count(*) DESC,n.nspname"))
          PY
