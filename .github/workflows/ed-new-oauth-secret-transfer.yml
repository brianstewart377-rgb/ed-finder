name: ed-new OAuth Secret Transfer

on:
  push:
    branches:
      - chatgpt-ed-new-ops-requests
    paths:
      - '.github/ed-new-oauth-transfer-requests/*.json'

permissions:
  contents: read

env:
  TRANSFER_KEYS: FRONTIER_CLIENT_ID,FRONTIER_CLIENT_SECRET,ADMIN_TOKEN,FRONTIER_OWNER_CUSTOMER_IDS,FRONTIER_REDIRECT_URI,AUTH_COOKIE_SECURE

jobs:
  prepare-target:
    name: Prepare encrypted transfer target
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    outputs:
      public_key_b64: ${{ steps.target_key.outputs.public_key_b64 }}
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
          [ "${#changed[@]}" -eq 1 ] || exit 64
          case "${changed[0]}" in .github/ed-new-oauth-transfer-requests/*.json) ;; *) exit 64 ;; esac
          python3 - "${changed[0]}" <<'PY'
          import json, pathlib, sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()) != {"operation":"transfer-oauth-secrets"}:
              raise SystemExit(64)
          PY
      - name: Prepare pinned ed-new SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Generate target-only transfer key
        id: target_key
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          pub="$(ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'set -eu; umask 077; mkdir -p /opt/ed-finder-v3-runtime; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /opt/ed-finder-v3-runtime/oauth-transfer-private.pem >/dev/null 2>&1; openssl pkey -in /opt/ed-finder-v3-runtime/oauth-transfer-private.pem -pubout')"
          test -n "$pub"
          echo "public_key_b64=$(printf '%s' "$pub" | base64 -w0)" >> "$GITHUB_OUTPUT"

  extract-encrypt:
    name: Encrypt OAuth settings on transient runner
    needs: prepare-target
    runs-on: ubuntu-latest
    environment: hetzner-operator
    timeout-minutes: 10
    steps:
      - name: Prepare Hetzner SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Extract selected settings without logging
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.HETZNER_OPERATOR_USER }}
        run: |
          set -euo pipefail
          umask 077
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' > oauth-settings.json <<'PY'
          import json, pathlib
          keys = [
              'FRONTIER_CLIENT_ID','FRONTIER_CLIENT_SECRET','ADMIN_TOKEN',
              'FRONTIER_OWNER_CUSTOMER_IDS','FRONTIER_REDIRECT_URI','AUTH_COOKIE_SECURE',
          ]
          path = pathlib.Path('/opt/ed-finder/.env')
          if not path.is_file():
              raise SystemExit('production .env is missing')
          values = {}
          for raw in path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key in keys:
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in ('\"', "'"):
                      value = value[1:-1]
                  values[key] = value
          missing = [key for key in ('FRONTIER_CLIENT_ID','FRONTIER_CLIENT_SECRET','ADMIN_TOKEN') if not values.get(key)]
          if missing:
              raise SystemExit('required OAuth settings are missing on production')
          values.setdefault('FRONTIER_REDIRECT_URI', 'https://ed-finder.app/api/auth/frontier/callback')
          values.setdefault('FRONTIER_OWNER_CUSTOMER_IDS', '')
          values.setdefault('AUTH_COOKIE_SECURE', 'true')
          for key, value in values.items():
              if '\n' in value or '\r' in value:
                  raise SystemExit(f'invalid newline in {key}')
          print(json.dumps(values, separators=(',', ':')))
          PY
          chmod 600 oauth-settings.json
      - name: Encrypt transfer payload
        shell: bash
        env:
          TARGET_PUBLIC_KEY_B64: ${{ needs.prepare-target.outputs.public_key_b64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$TARGET_PUBLIC_KEY_B64" | base64 -d > target-public.pem
          openssl rand -out transfer.pass 32
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in oauth-settings.json -out oauth-settings.enc -pass file:transfer.pass
          openssl pkeyutl -encrypt -pubin -inkey target-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in transfer.pass -out transfer-pass.enc
          rm -f oauth-settings.json transfer.pass target-public.pem
      - name: Upload ciphertext only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oauth-secret-transfer-ciphertext
          path: |
            oauth-settings.enc
            transfer-pass.enc
          if-no-files-found: error
          retention-days: 1

  install-target:
    name: Install OAuth settings on ed-new
    needs: [prepare-target, extract-encrypt]
    runs-on: ubuntu-latest
    environment: ed-new-operator
    timeout-minutes: 10
    steps:
      - name: Download ciphertext
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: oauth-secret-transfer-ciphertext
          path: transfer
      - name: Prepare pinned ed-new SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ED_NEW_OPERATOR_SSH_KEY }}
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.ED_NEW_OPERATOR_SSH_KNOWN_HOSTS || secrets.ED_NEW_OPERATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then lookup="$SSH_HOST"; else lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null
      - name: Transfer ciphertext to ed-new
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          scp -q -i ~/.ssh/key -P "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            transfer/oauth-settings.enc transfer/transfer-pass.enc \
            "$SSH_USER@$SSH_HOST:/tmp/"
      - name: Decrypt and install without logging values
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ED_NEW_OPERATOR_HOST }}
          SSH_PORT: ${{ secrets.ED_NEW_OPERATOR_PORT }}
          SSH_USER: ${{ secrets.ED_NEW_OPERATOR_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json, os, pathlib, subprocess
          runtime = pathlib.Path('/opt/ed-finder-v3-runtime')
          private = runtime / 'oauth-transfer-private.pem'
          encrypted = pathlib.Path('/tmp/oauth-settings.enc')
          encrypted_pass = pathlib.Path('/tmp/transfer-pass.enc')
          passfile = pathlib.Path('/tmp/oauth-transfer.pass')
          plain = pathlib.Path('/tmp/oauth-settings.json')
          envfile = runtime / 'api.env'
          try:
              subprocess.run([
                  'openssl','pkeyutl','-decrypt','-inkey',str(private),
                  '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256',
                  '-in',str(encrypted_pass),'-out',str(passfile),
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run([
                  'openssl','enc','-d','-aes-256-cbc','-pbkdf2','-iter','200000',
                  '-in',str(encrypted),'-out',str(plain),'-pass',f'file:{passfile}',
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              values = json.loads(plain.read_text(encoding='utf-8'))
              wanted = {
                  'FRONTIER_CLIENT_ID','FRONTIER_CLIENT_SECRET','ADMIN_TOKEN',
                  'FRONTIER_OWNER_CUSTOMER_IDS','FRONTIER_REDIRECT_URI','AUTH_COOKIE_SECURE',
              }
              if not wanted.issuperset(values):
                  raise SystemExit('unexpected key in OAuth transfer payload')
              for required in ('FRONTIER_CLIENT_ID','FRONTIER_CLIENT_SECRET','ADMIN_TOKEN'):
                  if not values.get(required):
                      raise SystemExit(f'missing required transferred setting: {required}')
              current = envfile.read_text(encoding='utf-8').splitlines()
              kept = [line for line in current if not any(line.startswith(key+'=') for key in wanted)]
              for key in sorted(wanted):
                  value = str(values.get(key, ''))
                  if '\n' in value or '\r' in value:
                      raise SystemExit(f'invalid newline in {key}')
                  kept.append(f'{key}={value}')
              envfile.write_text('\n'.join(kept) + '\n', encoding='utf-8')
              os.chmod(envfile, 0o600)

              # Recreate the still-stopped API container so it captures the new env.
              name='edfinder-v3-api'
              if subprocess.run(['docker','inspect',name], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
                  running=subprocess.check_output(['docker','inspect','-f','{{.State.Running}}',name], text=True).strip()
                  if running != 'false':
                      raise SystemExit('refusing to replace a running API container')
                  subprocess.run(['docker','rm',name], check=True, stdout=subprocess.DEVNULL)
              subprocess.run([
                  'docker','create','--name',name,'--restart','unless-stopped',
                  '--network','edfinder-v3-runtime','--network-alias','api',
                  '--label','com.edfinder.v3.runtime=true','--env-file',str(envfile),
                  '-p','127.0.0.1:58095:8000','edfinder-v3-api:phase4c-r5',
              ], check=True, stdout=subprocess.DEVNULL)
              print('oauth_transfer|PASS')
              print('frontier_client_id_present|true')
              print('frontier_client_secret_present|true')
              print('admin_token_present|true')
              print('api_state|created-stopped')
              print('db_access_performed|false')
              print('db_writes_performed|false')
          finally:
              for p in (private, encrypted, encrypted_pass, passfile, plain):
                  try: p.unlink(missing_ok=True)
                  except Exception: pass
          PY
