version: 2
updates:
  # Keeps the commit-SHA pins in .github/workflows/*.yml current. Actions
  # are pinned to a SHA (not a mutable tag like @v4) per the Semgrep
  # github-actions-mutable-action-tag rule (2026-08-08) — Dependabot opens
  # a PR bumping the SHA (and the trailing "# vN" comment) whenever the
  # pinned action publishes a new release, so the pin doesn't just go stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before proposing it, so a bad release
    # has time to get caught/yanked upstream before we pull it in.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # 2026-08-08: extended from github-actions-only to pip/npm — real
  # production dependencies (fastapi, pydantic, psycopg2, etc.) for a
  # service handling live user data, and every Dependabot PR already goes
  # through the full required-checks CI gauntlet before it can merge, so
  # the safety net for a bad bump already exists.
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      api-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/apps/eddn"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      eddn-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/apps/importer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      importer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"
