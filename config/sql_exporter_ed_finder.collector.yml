---
collector_name: ed_finder

metrics:
  - metric_name: ed_finder_dirty_counts_rating_dirty
    type: gauge
    help: Number of systems with rating_dirty = true.
    values: [rating_dirty]
    query_ref: dirty_counts

  - metric_name: ed_finder_dirty_counts_cluster_dirty
    type: gauge
    help: Number of eligible systems with cluster_dirty = true.
    values: [cluster_dirty]
    query_ref: dirty_counts

  - metric_name: ed_finder_dirty_counts_rating_dirty_no_bodies
    type: gauge
    help: >-
      Number of systems matching reconcile_no_body_ratings.py's cleanup
      predicate exactly (rating_dirty = true, has_body_data = false, and no
      bodies rows exist) — the "truthful no-bodies" backlog
      scripts/run_dirty_ratings_if_needed.sh clears on its own 30-minute
      cycle (see CLAUDE.md's "Dirty ratings maintenance"). Deliberately
      excludes systems where has_body_data = false but bodies rows still
      exist (legacy body-contract drift migration 033 does not backfill) —
      those aren't touched by the cleanup job, so counting them here would
      make this metric permanently nonzero regardless of whether the job is
      working. Expected to be transiently nonzero; only worth alerting on if
      it trends upward across cycles rather than draining, which would mean
      the reconciliation job has stopped working (2026-08-07 incident: this
      exact count, previously visible only via one-off manual SQL, was the
      source of a false-positive deploy failure).
    values: [rating_dirty_no_bodies]
    query_ref: dirty_counts

  - metric_name: ed_finder_import_progress_rows_processed
    type: gauge
    help: Import rows processed so far.
    values: [rows_processed]
    query_ref: import_progress

  - metric_name: ed_finder_import_progress_rows_total
    type: gauge
    help: Total import rows expected.
    values: [rows_total]
    query_ref: import_progress

  - metric_name: ed_finder_table_sizes_total_bytes
    type: gauge
    help: Total bytes used by a table, including indexes and TOAST data.
    key_labels: [table_name]
    values: [total_bytes]
    query_ref: table_sizes

  - metric_name: ed_finder_table_sizes_table_bytes
    type: gauge
    help: Bytes used by a table's heap data.
    key_labels: [table_name]
    values: [table_bytes]
    query_ref: table_sizes

  - metric_name: ed_finder_table_sizes_index_bytes
    type: gauge
    help: Bytes used by a table's indexes.
    key_labels: [table_name]
    values: [index_bytes]
    query_ref: table_sizes

  - metric_name: ed_finder_slow_queries_slow_query_count
    type: gauge
    help: Number of queries running longer than five seconds.
    values: [slow_query_count]
    query_ref: slow_queries

  - metric_name: ed_finder_nightly_update_duration_seconds
    type: gauge
    help: >-
      Wall-clock duration of the most recent scripts/nightly_update.sh run,
      recorded on every exit (success, warning, or fatal abort) via a trap,
      not just clean completions. 2026-08-06 incident: an N+1-query
      regression turned a normal ~3h run into ~24h without the job ever
      failing or warning — nothing surfaced until the healthchecks.io
      dead-man's-switch fired a full day later. This metric is the earlier
      signal: a run that's gotten much slower shows up the next scrape
      after it exits, whether or not it ultimately succeeded.
    values: [duration_seconds]
    query_ref: nightly_update_duration

queries:
  - query_name: dirty_counts
    query: |
      SELECT
        (SELECT COUNT(*)
           FROM systems
          WHERE rating_dirty = TRUE) AS rating_dirty,
        (SELECT COUNT(*)
           FROM systems
          WHERE cluster_dirty = TRUE
            AND has_body_data = TRUE
            AND macro_grid_id IS NOT NULL) AS cluster_dirty,
        (SELECT COUNT(*)
           FROM systems s
          WHERE s.rating_dirty = TRUE
            AND COALESCE(s.has_body_data, FALSE) = FALSE
            AND NOT EXISTS (
                SELECT 1
                  FROM bodies b
                 WHERE b.system_id64 = s.id64
            )) AS rating_dirty_no_bodies

  - query_name: import_progress
    query: |
      SELECT
        (SELECT value::bigint FROM app_meta WHERE key = 'import_rows_processed') AS rows_processed,
        (SELECT value::bigint FROM app_meta WHERE key = 'import_rows_total') AS rows_total

  - query_name: table_sizes
    query: |
      SELECT
        relname AS table_name,
        pg_total_relation_size(relid) AS total_bytes,
        pg_relation_size(relid) AS table_bytes,
        pg_indexes_size(relid) AS index_bytes
      FROM pg_catalog.pg_statio_user_tables
      WHERE relname IN ('systems', 'bodies', 'stations', 'ratings', 'cluster_summary', 'grid_cells')

  - query_name: slow_queries
    query: |
      SELECT COUNT(*) AS slow_query_count
      FROM pg_stat_activity
      WHERE state = 'active'
        AND query_start < NOW() - INTERVAL '5 seconds'
        AND query NOT LIKE '%pg_stat_activity%'

  - query_name: nightly_update_duration
    query: |
      SELECT
        (SELECT value::bigint FROM app_meta WHERE key = 'last_nightly_update_duration_seconds') AS duration_seconds
