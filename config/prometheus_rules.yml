groups:
  - name: ed-finder-runtime
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"ed-api|eddn|postgres|postgres-custom|redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ED Finder monitoring target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been unreachable for two minutes."

      - alert: DataInvariantsFailed
        expr: ed_finder_data_invariants_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Latest ED Finder data-invariants receipt failed"

      - alert: DataInvariantsUnknown
        expr: ed_finder_data_invariants_success < 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No valid ED Finder data-invariants receipt is visible"

      - alert: DataInvariantsStale
        expr: ed_finder_data_invariants_age_seconds > 691200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Latest ED Finder data-invariants receipt is older than eight days"

      - alert: EddnFlushStalled
        expr: eddn_seconds_since_flush > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EDDN has not completed a database flush recently"

      - alert: EddnSimulationIngestFlushStalled
        expr: ed_finder_eddn_simulation_ingest_seconds_since_flush > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EDDN simulation ingest has not completed a flush cycle recently"
          description: "Same failure mode and threshold as EddnFlushStalled, for the second, independent EDDN consumer (apps/api/src/ingest/eddn_client.py, journal_events/body_scan_facts) — a long-lived task that's silently stopped cycling (ZMQ disconnect, crash loop, upstream relay outage) looks identical to a healthy one without this."

      - alert: EddnSimulationIngestFlushFailing
        expr: rate(ed_finder_eddn_simulation_ingest_flush_failures_total[5m]) * 60 > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EDDN simulation ingest DB flushes are failing"
          description: "apps/api/src/ingest/eddn_client.py has been failing database flushes for ten minutes ({{ $value | humanize }} failed flushes/min over 5m). Each failed flush drops its batch of journal_events/body_scan_facts rows. Before PR #864 this failure advanced the liveness clock and never fired EddnSimulationIngestFlushStalled (the July 2026 outage shape); check the api log for 'flush failed' and the database for lock waits, statement timeouts or a missing table."

      - alert: EddnSimulationIngestFlushBreakerNear
        expr: ed_finder_eddn_simulation_ingest_consecutive_flush_failures >= (ed_finder_eddn_simulation_ingest_max_consecutive_flush_failures - 1)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "EDDN simulation ingest is one failed flush from its reconnect breaker"
          description: "{{ $value }} consecutive flushes have failed; at EDDN_SIMULATION_INGEST_MAX_CONSECUTIVE_FLUSH_FAILURES (default 5) the ingest loop drops its pending batch and reconnects. One more failure means data loss for that batch, not just a delay. The gauge resets to 0 on the next successful flush, so this clears itself once the write path recovers."

      - alert: EddnSimulationIngestNoSuccessfulFlush
        expr: (time() - ed_finder_eddn_simulation_ingest_last_successful_flush_timestamp_seconds) > 1800 and ed_finder_eddn_simulation_ingest_last_successful_flush_timestamp_seconds > 0 and ed_finder_eddn_simulation_ingest_enabled == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "EDDN simulation ingest has not written to the database for 30 minutes"
          description: "The ingest task is enabled and had flushed successfully at least once since process start, but nothing has reached the database in thirty minutes ({{ $value | humanizeDuration }}). Unlike EddnSimulationIngestFlushStalled (which the receive path keeps fresh while the write path is healthy) this only clears on a successful DB flush, so a wedged or persistently failing write path cannot hide behind a live ZMQ feed. A fresh process that has never flushed reports 0 and is covered by EddnSimulationIngestFlushStalled instead."

      - alert: SseBridgeUnhealthy
        expr: ed_finder_sse_bridge_state != 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EDDN to SSE bridge has not been subscribed to Redis for ten minutes"
          description: "ed_finder_sse_bridge_state is {{ $value }} (0 not started, 1 connecting, 2 subscribed, 3 retrying, 4 stopped). Live /api/events clients receive nothing until the bridge is back in state 2. The bridge retries Redis itself with capped backoff (apps/api/src/routers/events.py), so a sustained non-2 state means Redis is down, unreachable from the api container, or refusing the subscription."

      - alert: SseBridgeReconnecting
        expr: rate(ed_finder_sse_bridge_reconnects_total[15m]) * 60 > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "EDDN to SSE bridge keeps reconnecting to Redis"
          description: "The bridge has been making reconnect attempts for fifteen minutes ({{ $value | humanize }} attempts/min over 15m). A single blip resolves within one scrape; a sustained rate means Redis is flapping or the subscription is being dropped repeatedly (check redis_exporter and the api log for 'bridge' lines)."

      - alert: HealthchecksReportedDown
        expr: hc_checks_down_total > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Healthchecks.io reports one or more checks down"

      - alert: NightlyUpdateDurationAnomaly
        expr: ed_finder_nightly_update_duration_seconds > 21600
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Nightly update ran far longer than its normal ~3h baseline"
          description: "Most recent scripts/nightly_update.sh run took {{ $value }}s (over 6h). This fires on completion, success or failure — a slow-but-still-completing run is the early symptom of the same class of regression that once took 24h (2026-08-06)."

      - alert: DiskSpaceHigh
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space {{ $value | humanizePercentage }} available on root volume"
          description: "Production volume has dropped below 30% free space. This is a warning to plan expansion."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Disk space {{ $value | humanizePercentage }} available on root volume"
          description: "Production volume has dropped below 20% free space. Operations risk. Expansion or cleanup required immediately."
