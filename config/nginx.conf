# Repository nginx configuration. This file is not, by itself, V3 production
# deployment authority; see docs/operations/infrastructure-status.md.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log  warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml
        font/woff font/woff2;

    # Security headers — defined in a snippet because nginx does NOT inherit
    # `add_header` into contexts that declare their own. The snippet is
    # re-`include`-d in every server / location block below that has its
    # own add_header. See ./security-headers.conf for details.

    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;

    # ── Docker DNS-backed API origin ─────────────────────────────────────────
    # Re-resolve `api` at request time so a recreated container's new address is
    # picked up instead of keeping the startup-resolved address indefinitely.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $host $api_origin {
        default http://api:8000;
    }

    # ── HTTP server ──────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name ed-finder.app www.ed-finder.app;
        root /var/www/app;
        index index.html;

        include /etc/nginx/snippets/security-headers.conf;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /nginx-healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /v2 { return 301 https://$host/; }
        location = /v2/ { return 301 https://$host/; }
        location ~ ^/v2/(.*)$ { return 301 https://$host/$1; }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            include /etc/nginx/snippets/security-headers.conf;
        }

        location = /index.html {
            try_files /index.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location /api/ {
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
        }

        location ~ ^/s/[0-9]+$ {
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   User-Agent        $http_user_agent;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        location / {
            try_files $uri /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # ── HTTPS main server ────────────────────────────────────────────────────
    # NOTE: nginx will crash on startup if the cert files do not exist.
    # This repository config is syntax-tested in CI without this TLS block;
    # production certificate management requires a current V3 operator path.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ed-finder.app www.ed-finder.app;

        ssl_certificate     /etc/letsencrypt/live/ed-finder.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ed-finder.app/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/security-headers.conf;

        root /var/www/app;
        index index.html;

        location = /v2 {
            return 301 /;
        }
        location = /v2/ {
            return 301 /;
        }
        location ~ ^/v2/(.*)$ {
            return 301 /$1;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            include /etc/nginx/snippets/security-headers.conf;
        }

        location / {
            try_files $uri /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            include /etc/nginx/snippets/security-headers.conf;
            expires -1;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable, max-age=2592000";
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ~* \.(js|css)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            include /etc/nginx/snippets/security-headers.conf;
        }

        location = /api/events/live {
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
            tcp_nopush         off;
            tcp_nodelay        on;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
            proxy_send_timeout    60s;
            proxy_buffering    on;
            proxy_buffer_size  16k;
            proxy_buffers      8 32k;
        }

        location ~ ^/s/[0-9]+$ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   User-Agent        $http_user_agent;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        location ~ ^/api/(local/search|search/galaxy|search/cluster) {
            limit_req zone=search burst=20 nodelay;
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /api/health {
            proxy_pass $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log off;
        }

        location = /api/metrics {
            allow 127.0.0.1;
            deny  all;
            proxy_pass $api_origin;
        }

        location ^~ /api/admin/ {
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Admin-Token     $http_x_admin_token;
            proxy_read_timeout 300s;
        }

        location = /api/cache/clear {
            proxy_pass         $api_origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Admin-Token     $http_x_admin_token;
        }
    }

    # ── Octopus (self-hosted PR review) ─────────────────────────────────────
    # This is retained because Octopus is part of the current PR acceptance
    # boundary. Its actual V3 deployment is governed separately from this file.
    map $http_upgrade $octopus_conn_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        listen [::]:80;
        server_name octopus.ed-finder.app;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name octopus.ed-finder.app;

        ssl_certificate     /etc/letsencrypt/live/octopus.ed-finder.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/octopus.ed-finder.app/privkey.pem;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 25m;
        resolver 127.0.0.11 valid=30s ipv6=off;

        location = /api/github/webhook {
            set $octopus_upstream http://octopus-web:3000;
            proxy_pass         $octopus_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            auth_basic           "Octopus";
            auth_basic_user_file /etc/nginx/octopus.htpasswd;
            set $octopus_upstream http://octopus-web:3000;
            proxy_pass         $octopus_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $octopus_conn_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
