# Shared logging config — applied to every long-lived service via YAML anchor.
# Without this, container stdout/stderr accumulates in /var/lib/docker/containers
# until the disk fills; on a server doing 186M-row ingestion that takes weeks,
# not months. 50m × 3 files = 150 MB cap per container.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  # Tuned for: Hetzner AX41-SSD — i7-8700 (6C/12T), 128 GB RAM, 3×1 TB NVMe RAID-5
  postgres:
    build:
      context: .
      dockerfile: apps/postgres/Dockerfile
    image: ed-finder-postgres:16-bookworm-repack
    container_name: ed-postgres
    restart: unless-stopped
    logging: *default-logging
    # Postgres is configured (shared_buffers=32GB, effective_cache_size=96GB,
    # work_mem=512MB × max_connections=200) on the assumption that it owns
    # most of the box. We give it a 96 GB ceiling — generous enough that
    # the configured workload never hits it, but firm enough that a runaway
    # query plan can't OOM-kill the api container alongside it. Total non-
    # postgres footprint at peak (api 4 + eddn 1 + nginx 0.25 + maintenance
    # 0.5 + redis 5 + importer 8 when running + monitoring 3) ≈ 22 GB,
    # leaving postgres a comfortable 106 GB headroom against this limit.
    mem_limit: 96g
    cpus: 10.0
    environment:
      POSTGRES_USER:     edfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       edfinder
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - /data/dumps:/data/dumps:ro
      - /data/logs:/data/logs
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
        -c shared_buffers=32GB
        -c effective_cache_size=96GB
        -c maintenance_work_mem=8GB
        -c checkpoint_completion_target=0.99
        -c wal_buffers=256MB
        -c default_statistics_target=500
        -c random_page_cost=1.0
        -c effective_io_concurrency=300
        -c work_mem=512MB
        -c max_worker_processes=12
        -c max_parallel_workers_per_gather=6
        -c max_parallel_workers=12
        -c max_parallel_maintenance_workers=6
        -c max_connections=200
        -c log_min_duration_statement=1000
        -c log_line_prefix='%t [%p]: [%l-1] '
        -c log_checkpoints=on
        -c log_connections=off
        -c log_disconnections=off
        -c autovacuum_vacuum_scale_factor=0.02
        -c autovacuum_analyze_scale_factor=0.02
        -c autovacuum_max_workers=6
        -c autovacuum_naptime=15s
        -c autovacuum_vacuum_cost_limit=5000
        -c autovacuum_vacuum_cost_delay=2ms
        -c max_wal_size=32GB
        -c min_wal_size=4GB
        -c wal_compression=on
        -c huge_pages=try
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edfinder -d edfinder"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 8gb

  # ── pgBouncer (connection pooler) — OPT-IN ────────────────────────────────
  # 2026-05-09: pgbouncer was removed from the api + eddn paths after a
  # production incident traced to its transaction-pool mode silently
  # wiping session-level SETs. The api + eddn containers now connect
  # directly to postgres:5432 (matching the importer + postgres_exporter
  # which already did). pgbouncer is retained behind the `pooler` profile
  # so it can be re-enabled if a future deployment grows enough
  # short-lived clients to actually need multiplexing — but new services
  # should default to direct PG connections unless they have a concrete
  # reason to opt in.
  #
  # Enable explicitly with: `docker compose --profile pooler up -d pgbouncer`
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3   # pinned for reproducibility (audit fix; v1.21.0 from original audit didn't exist on Docker Hub)
    container_name: ed-pgbouncer
    profiles: ["pooler"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      DB_USER:      edfinder
      DB_PASSWORD:  ${POSTGRES_PASSWORD}
      DB_HOST:      postgres
      DB_NAME:      edfinder
      POOL_MODE:    transaction          # best for FastAPI async
      MAX_CLIENT_CONN:  500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      AUTH_TYPE:    md5                  # asyncpg compat — scram-sha-256 causes "wrong password type"
      SERVER_AUTH_TYPE: scram-sha-256    # postgres default auth method
      SERVER_TLS_SSLMODE: disable        # no TLS between pgbouncer and postgres (same host)
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ed-redis
    restart: unless-stopped
    logging: *default-logging
    # maxmemory is configured to 4 GB inside redis itself; give 1 GB
    # headroom for fork-on-RDB and OS overhead. RDB persistence is
    # disabled (--save "") and AOF is off, so this is a tight ceiling.
    mem_limit: 5g
    cpus: 2.0
    command: >
      redis-server
        --maxmemory 4gb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ed-api
    restart: unless-stopped
    logging: *default-logging
    # 4 GB / 4 cpu is well above the steady-state working set of one
    # uvicorn worker + one asyncpg pool (5-20 conns). The ceiling exists
    # primarily so that a runaway query result set or memory leak in
    # this container can't OOM-kill postgres — without a limit, the
    # kernel picks the largest non-postgres consumer when memory
    # pressure spikes, which is always us.
    mem_limit: 4g
    cpus: 4.0
    environment:
      # Direct connection to postgres, bypassing pgbouncer.
      #
      # Why direct (2026-05-09 follow-up to the production search-503
      # incident): pgbouncer's transaction-pool mode wipes session-
      # level SETs (including statement_timeout) between transactions,
      # rejects unknown startup parameters (so `server_settings=` on
      # asyncpg can't propagate them), and forces `statement_cache_size=0`
      # which degrades asyncpg performance. The benefit pgbouncer
      # buys — multiplexing thousands of short-lived clients onto a
      # small server pool — does not apply to a single long-lived
      # api container with its own asyncpg pool (5-20 connections).
      # The `importer` and `postgres_exporter` services already
      # connect direct; this brings api + eddn in line.
      #
      # PostgreSQL `max_connections` is 200 (see postgres command), so
      # api(20) + eddn(5) + importer(short-lived) + monitoring leave
      # ~150 connections of headroom.
      DATABASE_URL:         ${DATABASE_APP_URL:-postgresql://edfinder:${POSTGRES_PASSWORD}@postgres:5432/edfinder}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL:-}
      REDIS_URL:            redis://redis:6379/0
      LOG_LEVEL:            ${LOG_LEVEL:-INFO}
      TTL_SEARCH:           3600
      TTL_SYSTEM:           86400
      TTL_CLUSTER:          86400
      BUILD_SHA:            ${EDFINDER_BUILD_SHA:-unknown}
      COMPOSE_PROJECT_DIR:  /opt/ed-finder   # used by admin/rebuild-clusters endpoint
      # Security — admin endpoints disabled unless a token is set in .env.
      ADMIN_TOKEN:          ${ADMIN_TOKEN:-}
      # Optional read-only artifact generated by station_enrichment_status.py --json.
      # Leave unset unless the host writes the artifact to a path mounted in this container.
      ENRICHMENT_STATUS_JSON_PATH: ${ENRICHMENT_STATUS_JSON_PATH:-}
      # Optional read-only warehouse reconciliation/status JSON artifact.
      # Leave unset unless the host publishes the artifact to a mounted path.
      ENRICHMENT_WAREHOUSE_STATUS_JSON_PATH: ${ENRICHMENT_WAREHOUSE_STATUS_JSON_PATH:-}
      # Comma-separated CORS origins. Override in .env for staging/dev.
      CORS_ORIGINS:         ${CORS_ORIGINS:-https://ed-finder.app,https://www.ed-finder.app}
      # Keep internal error details out of HTTP responses by default.
      EXPOSE_ERROR_DETAIL:  ${EXPOSE_ERROR_DETAIL:-false}
      # Optional error tracking (GlitchTip, Sentry-API-compatible). Blank
      # disables it entirely — sentry_sdk.init() is only called when set.
      # Can point at the internal glitchtip_web service (this container
      # never leaves the docker network for its own DSN), e.g.:
      #   http://<key>@glitchtip_web:8000/<project_id>
      SENTRY_DSN:           ${SENTRY_DSN:-}
      # EDDN simulation ingest background task — see env.example and
      # apps/api/src/ingest/eddn_client.py / config.py. Defaults ON;
      # set to false to disable without a redeploy.
      EDDN_SIMULATION_INGEST_ENABLED: ${EDDN_SIMULATION_INGEST_ENABLED:-true}
    volumes:
      - /data/logs:/data/logs
      # Operator-written invariant receipts; the API reads fixed JSON aliases
      # for metrics and never writes into the receipts tree.
      - /data/receipts:/data/receipts:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── EDDN Listener ─────────────────────────────────────────────────────────
  eddn:
    build:
      context: .
      dockerfile: apps/eddn/Dockerfile
    container_name: ed-eddn
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 2.0
    environment:
      # Direct connection — see `api` service for full rationale.
      DATABASE_URL:         ${DATABASE_APP_URL:-postgresql://edfinder:${POSTGRES_PASSWORD}@postgres:5432/edfinder}
      REDIS_URL:            redis://redis:6379/0
      LOG_LEVEL:            ${LOG_LEVEL:-INFO}
      LOG_FORMAT:           ${EDDN_LOG_FORMAT:-text}    # set to `json` for Loki/CloudWatch
      METRICS_PORT:         9091                          # Prometheus scrape target
      DIRTY_FLUSH_INTERVAL: 300
    expose:
      - "9091"  # internal-only — prometheus container scrapes via the docker network
    volumes:
      - /data/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Scheduled DB maintenance (ANALYZE / REINDEX / refresh MVs) ────────────
  # 2026-05-09: added after a production autocomplete outage traced to
  # stale planner statistics on the 186M-row systems table. Without this
  # sidecar, autovacuum's analyze threshold (`autovacuum_analyze_scale_factor=0.02`)
  # only triggers after 2% of rows change — so on a slow-growing table
  # like systems, stats can drift for weeks. Manifests as: planner picks
  # a sequential scan over the lower(name) prefix index, autocomplete
  # 503s at the 15s statement_timeout.
  #
  # Schedule:
  #   nightly @ 03:15 UTC : ANALYZE all hot tables + refresh map MVs
  #   weekly  @ 04:00 Sun : REINDEX CONCURRENTLY hot indexes + VACUUM
  #
  # Run on demand (skip the wait):
  #   docker compose run --rm maintenance run_maintenance.sh nightly
  #   docker compose run --rm maintenance run_maintenance.sh weekly
  #   docker compose run --rm maintenance run_maintenance.sh smoke
  maintenance:
    build:
      context: .
      dockerfile: apps/maintenance/Dockerfile
    container_name: ed-maintenance
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL:  ${DATABASE_MAINTENANCE_URL:-postgresql://edfinder:${POSTGRES_PASSWORD}@postgres:5432/edfinder}
      DATA_INVARIANTS_DATABASE_URL: ${DATABASE_READONLY_URL:-${DATABASE_APP_URL:-postgresql://edfinder:${POSTGRES_PASSWORD}@postgres:5432/edfinder}}
      LOG_FILE:      /data/logs/maintenance.log
      BACKUP_DIR:    /data/backups/postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RETENTION_MIN_ARCHIVES: ${BACKUP_RETENTION_MIN_ARCHIVES:-3}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-30}
      BACKUP_OFFSITE_RETENTION_MIN_ARCHIVES: ${BACKUP_OFFSITE_RETENTION_MIN_ARCHIVES:-3}
      RCLONE_CONFIG_STORAGEBOX_TYPE: ${RCLONE_CONFIG_STORAGEBOX_TYPE:-}
      RCLONE_CONFIG_STORAGEBOX_HOST: ${RCLONE_CONFIG_STORAGEBOX_HOST:-}
      RCLONE_CONFIG_STORAGEBOX_USER: ${RCLONE_CONFIG_STORAGEBOX_USER:-}
      RCLONE_CONFIG_STORAGEBOX_PORT: ${RCLONE_CONFIG_STORAGEBOX_PORT:-}
      RCLONE_CONFIG_STORAGEBOX_PASS: ${RCLONE_CONFIG_STORAGEBOX_PASS:-}
      # Optional dead-man's-switch services alert when an expected ping does not arrive.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_OFFSITE_HEARTBEAT_URL: ${BACKUP_OFFSITE_HEARTBEAT_URL:-}
      # EDDN ingest dead-man's switch: the external service alerts when the ping does not arrive.
      EDDN_WATCHDOG_HEARTBEAT_URL: ${EDDN_WATCHDOG_HEARTBEAT_URL:-}
      EDDN_WATCHDOG_MAX_AGE_MINUTES: ${EDDN_WATCHDOG_MAX_AGE_MINUTES:-30}
      # Maintenance dead-man's switch: alerts when a nightly/weekly run
      # does not ping (or pings /fail).
      MAINTENANCE_HEARTBEAT_URL: ${MAINTENANCE_HEARTBEAT_URL:-}
      # Inverted disk dead-man's switch: ping only while healthy. Default 40GB stays
      # below the roughly 61GB nightly backup-before-prune dip; higher alerts nightly.
      DISK_WATCHDOG_HEARTBEAT_URL: ${DISK_WATCHDOG_HEARTBEAT_URL:-}
      DISK_WATCHDOG_MIN_FREE_GB: ${DISK_WATCHDOG_MIN_FREE_GB:-40}
      DISK_WATCHDOG_MAX_PERCENT_USED: ${DISK_WATCHDOG_MAX_PERCENT_USED:-80}
      DISK_WATCHDOG_PATH: ${DISK_WATCHDOG_PATH:-/data}
      EVIDENCE_RECORD_RETENTION_DAYS: ${EVIDENCE_RECORD_RETENTION_DAYS:-90}
      ADMIN_JOB_RUN_RETENTION_DAYS: ${ADMIN_JOB_RUN_RETENTION_DAYS:-60}
      BACKUP_LOG_FILE: /data/logs/backup.log
      TZ:            UTC
    volumes:
      - /data/logs:/data/logs
      - /data/backups:/data/backups
      - /data/receipts:/data/receipts
    depends_on:
      postgres:
        condition: service_healthy

  # ── Nginx (SSL + static files) ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ed-nginx
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 1.0
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./frontend/dist:/var/www/app:ro  # current frontend build output, served at /
      - /opt/ed-finder-review/frontend/dist:/var/www/review:ro
      - /opt/ed-finder-review/.secrets/review.htpasswd:/etc/nginx/review.htpasswd:ro
      - /opt/octopus/ui.htpasswd:/etc/nginx/octopus.htpasswd:ro  # basic-auth for octopus.ed-finder.app (see nginx.conf octopus block)
      - /opt/ed-finder-review/.review/nginx-logs:/var/log/nginx-review
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    healthcheck:
      # Hit a static-string location served by nginx itself (see
      # /nginx-healthz in config/nginx.conf). The previous test
      # ("curl -f http://localhost/api/health") routed through the
      # /api/ proxy → api → DB, so a slow DB or restarting api would
      # cause Docker to mark nginx unhealthy and (worse) potentially
      # restart it under restart_policy, compounding the outage.
      # nginx:alpine ships wget but not curl in current builds, hence
      # the wget invocation.
      test: ["CMD", "wget", "-q", "-O-", "--tries=1", "--timeout=2", "http://127.0.0.1/nginx-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - review-edge

  # ── Import runner (one-shot, run manually) ─────────────────────────────────
  # Always use docker compose --profile import run --rm importer <args>
  importer:
    build:
      context: .
      dockerfile: apps/importer/Dockerfile
    container_name: ed-importer
    profiles: ["import"]
    logging: *default-logging
    # 8 GB / 4 cpu — the importer streams a ~110 GB gzipped JSON dump
    # so its working set is bounded by the asyncpg COPY buffer and
    # ijson parse state, not the dump size. 8 GB is well above what
    # we've measured (~2-3 GB resident). The cpu cap keeps the
    # importer from saturating all 12 vCPUs and starving the api
    # of scheduling time during the long ingestion window.
    mem_limit: 8g
    cpus: 4.0
    env_file:
      - .env
    environment:
      # Explicitly pass the password to bypass any URL caching/conflicts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL:  ${DATABASE_IMPORT_URL:-postgresql://edfinder:${POSTGRES_PASSWORD}@postgres:5432/edfinder}
      DUMP_DIR:     /data/dumps
      BATCH_SIZE:   ${BATCH_SIZE:-50000}
      RATING_DIRTY_CLEANUP_CHUNK:   ${RATING_DIRTY_CLEANUP_CHUNK:-1000}
      RATING_DIRTY_CLEANUP_RETRIES: ${RATING_DIRTY_CLEANUP_RETRIES:-3}
      LOG_LEVEL:    INFO
      LOG_FILE:     /data/logs/import.log
      PYTHONUNBUFFERED: "1"
    volumes:
      - /data/dumps:/data/dumps
      - /data/logs:/data/logs
      - ./scripts:/opt/ed-finder/scripts:ro
      # Mount latest scripts directly — no image rebuild needed after code changes.
      # Audit fix (§Refactor 4): paths updated for the apps/importer/src layout.
      - ./apps/importer/src/import_spansh.py:/app/import_spansh.py:ro
      - ./apps/importer/src/progress.py:/app/progress.py:ro
      - ./apps/importer/src/build_grid.py:/app/build_grid.py:ro
      - ./apps/importer/src/build_ratings.py:/app/build_ratings.py:ro
      - ./apps/importer/src/build_clusters.py:/app/build_clusters.py:ro
      - ./apps/importer/src/build_topology.py:/app/build_topology.py:ro
      - ./apps/importer/src/build_archetype_scores.py:/app/build_archetype_scores.py:ro
      - ./apps/importer/src/build_regional_analysis.py:/app/build_regional_analysis.py:ro
      - ./apps/importer/src/api_source_resolver.py:/app/api_source_resolver.py:ro
      - ./apps/importer/src/edsm_station_enrichment_probe.py:/app/edsm_station_enrichment_probe.py:ro
      - ./apps/importer/src/dirty_flags.py:/app/dirty_flags.py:ro
      - ./apps/importer/src/region_map.py:/app/region_map.py:ro
      - ./apps/importer/src/ring_facts.py:/app/ring_facts.py:ro
      - ./shared_contracts:/app/shared_contracts:ro
      - ./apps/api/src/station_body_resolver.py:/app/station_body_resolver.py:ro
      # Importer entrypoints resolve shared mechanics/regional/station modules
      # from the API source tree — vendor the whole apps/api/src alongside
      # the importer at /app/apps_api_src so flat /app scripts see current API
      # code without needing a full importer-image rebuild.
      - ./apps/api/src:/app/apps_api_src:ro
      - ./apps/importer/src/data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── Prometheus (metrics collection) ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: ed-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus_rules.yml:/etc/prometheus/rules.yml:ro
      - ${HEALTHCHECKS_PROMETHEUS_TARGETS_FILE:-./config/healthchecks_targets.empty.yml}:/etc/prometheus/healthchecks-targets.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - healthchecks_readonly_api_key
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  # ── Grafana (dashboards) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.1.1
    container_name: ed-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "%(protocol)s://%(domain)s:%(http_port)s/"
      # Community plugin required for config/grafana/provisioning/datasources/
      # glitchtip.yml (type: grafana-sentry-datasource) — not bundled by default.
      GF_INSTALL_PLUGINS: grafana-sentry-datasource
      # Read by start-with-secret.sh and exported as GLITCHTIP_GRAFANA_AUTH_TOKEN
      # (empty/placeholder by default — GlitchTip integration is opt-in). The
      # Sentry datasource provisioning YAML then consumes that env var directly:
      # Grafana provisioning only supports ${ENV_VAR} substitution, not
      # file-content substitution, so the token can't stay a bare secret file.
      GLITCHTIP_GRAFANA_AUTH_TOKEN_SECRET_FILE: /run/secrets/glitchtip_grafana_auth_token
      # Set once you've created the GlitchTip org in its UI — see
      # docs/operations/glitchtip-error-tracking.md.
      GLITCHTIP_GRAFANA_ORG_SLUG: ${GLITCHTIP_GRAFANA_ORG_SLUG:-not-configured}
    entrypoint: ["/bin/sh", "/etc/grafana/start-with-secret.sh"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/grafana/start-with-secret.sh:/etc/grafana/start-with-secret.sh:ro
    secrets:
      - grafana_admin_password
      - glitchtip_grafana_auth_token
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # ── postgres-exporter (Postgres metrics for Prometheus) ──────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: ed-postgres-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    command:
      - '--config.file=/etc/postgres_exporter/postgres_exporter.yml'
    environment:
      DATA_SOURCE_NAME: "postgresql://edfinder:${POSTGRES_PASSWORD}@postgres:5432/edfinder?sslmode=disable"
    volumes:
      - ./config/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # Custom ED Finder SQL metrics. postgres_exporter's extended-query path is
  # deprecated; SQL Exporter is the supported home for deployment-specific
  # queries while postgres_exporter continues to provide standard pg_* metrics.
  postgres_custom_exporter:
    image: burningalchemist/sql_exporter:0.24.4
    container_name: ed-postgres-custom-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    entrypoint: ["/bin/sh", "/etc/sql_exporter/start.sh"]
    command:
      - '--config.file=/etc/sql_exporter/sql_exporter.yml'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/sql_exporter.yml:/etc/sql_exporter/sql_exporter.yml:ro
      - ./config/sql_exporter_ed_finder.collector.yml:/etc/sql_exporter/ed_finder.collector.yml:ro
      - ./config/sql_exporter_start.sh:/etc/sql_exporter/start.sh:ro
    ports:
      - "127.0.0.1:9399:9399"
    depends_on:
      postgres:
        condition: service_healthy

  # ── redis-exporter (Redis metrics for Prometheus) ─────────────────────────
  redis_exporter:
    image: oliver006/redis_exporter:v1.88.0
    container_name: ed-redis-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis

  # ── GlitchTip (self-hosted, Sentry-API-compatible error tracking) ────────
  # OPT-IN, own Postgres + Redis (never the app's) so a GlitchTip migration,
  # restart, or Renovate-driven version bump can never touch app data or
  # the app's migration-ledger discipline (see CLAUDE.md's "Debugging data
  # drift" section on why that separation matters here). Enable with:
  #   docker compose --profile errortracking up -d
  #
  # First-run bootstrap is manual (not achievable from compose alone):
  # create an org + project in the GlitchTip UI to get SENTRY_DSN /
  # VITE_SENTRY_DSN, and an internal integration auth token (Read access to
  # Project/Issue&Event/Organization) for the Grafana datasource secret.
  # See docs/operations/glitchtip-error-tracking.md.
  glitchtip_postgres:
    image: postgres:16-alpine
    container_name: ed-glitchtip-postgres
    profiles: ["errortracking"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER:     glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD}
      POSTGRES_DB:       glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip_redis:
    image: redis:7-alpine
    container_name: ed-glitchtip-redis
    profiles: ["errortracking"]
    restart: unless-stopped
    logging: *default-logging
    # Pure cache + Celery broker for GlitchTip — no persistence needed,
    # matching the main redis service's --save ""/--appendonly no pattern.
    mem_limit: 512m
    cpus: 0.5
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # One-shot: applies GlitchTip's own Django migrations (unrelated to
  # sql/NNN_*.sql / scripts/apply_migrations.sh) and exits. web/worker
  # wait for it via `service_completed_successfully`.
  glitchtip_migrate:
    image: glitchtip/glitchtip:6.2.3
    container_name: ed-glitchtip-migrate
    profiles: ["errortracking"]
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    command: ./manage.py migrate
    environment: &glitchtip-environment
      SECRET_KEY:       ${GLITCHTIP_SECRET_KEY}
      # generate both with: openssl rand -hex 24 / 32 — see env.example.
      DATABASE_URL:     postgresql://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip_postgres:5432/glitchtip
      REDIS_URL:        redis://glitchtip_redis:6379/0
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8080}
      ENABLE_USER_REGISTRATION: "false"
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@ed-finder.app}
    depends_on:
      glitchtip_postgres:
        condition: service_healthy

  glitchtip_web:
    image: glitchtip/glitchtip:6.2.3
    container_name: ed-glitchtip-web
    profiles: ["errortracking"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0
    environment: *glitchtip-environment
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_redis:
        condition: service_healthy
      glitchtip_migrate:
        condition: service_completed_successfully

  glitchtip_worker:
    image: glitchtip/glitchtip:6.2.3
    container_name: ed-glitchtip-worker
    profiles: ["errortracking"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-environment
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_redis:
        condition: service_healthy
      glitchtip_migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  glitchtip_postgres_data:

secrets:
  grafana_admin_password:
    file: ${GRAFANA_PASSWORD_FILE:-./config/grafana_admin_password.disabled}
  healthchecks_readonly_api_key:
    file: ${HEALTHCHECKS_PROMETHEUS_TOKEN_FILE:-./config/healthchecks_readonly_api_key.disabled}
  glitchtip_grafana_auth_token:
    file: ${GLITCHTIP_GRAFANA_AUTH_TOKEN_FILE:-./config/glitchtip_grafana_auth_token.disabled}

networks:
  default:
    name: ed-finder_default
  review-edge:
    name: edfinder-review-edge
    external: true
