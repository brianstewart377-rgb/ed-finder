[project]
name = "ed-finder-api"
version = "3.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Pillow==12.3.0",
  "asyncpg==0.31.0",
  "defusedxml==0.7.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "pydantic==2.13.4",
  "pyzmq==27.2.0",
  "redis==8.1.0",
  "sentry-sdk==2.68.0",
  "slowapi==0.1.10",
  "tornado==6.5.8",
  "uvicorn[standard]==0.52.4",
]

# CI-only dependencies are locked beside the deployable API dependencies so
# validation cannot accidentally exercise a separately resolved graph. Psycopg
# 3 supports synchronous release, importer, and repository tooling checks on
# the same CPython 3.14 authority.
[dependency-groups]
test = [
  "PyYAML==6.0.3",
  "coverage==7.10.7",
  "ijson==3.5.1",
  "jsonschema==4.25.1",
  "numpy==2.5.1",
  "psycopg[binary]==3.3.4",
  "pytest-asyncio==1.2.0",
  "pytest==8.3.4",
  "ruff==0.15.22",
  "tqdm==4.70.0",
]

[tool.uv]
package = false
required-version = "==0.11.33"
exclude-newer = "1 week"
